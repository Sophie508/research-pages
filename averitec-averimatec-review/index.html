<style>
:root {

*{box-sizing:border-box;margin:0;padding:0}

nav{display:flex;align-items:center;gap:32px;padding:0 40px;height:64px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.brand{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand a{color:inherit;text-decoration:none}
.navlinks{display:flex;gap:28px;margin-left:auto;font-weight:500;color:var(--ink2);font-size:14.5px}
.navlinks a{color:inherit;text-decoration:none} .navlinks a:hover{color:var(--ink)}

.hero{text-align:center;padding:56px 20px 8px}

.pill{display:inline-block;margin-top:16px;padding:8px 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}

.card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 12px rgba(16,24,40,.1)}
.cardimg{width:100%;display:block;max-height:280px;object-fit:cover}
.cardbody{padding:18px 22px 20px}
.claimtext{font-size:15.5px;line-height:1.55;margin-bottom:14px}

.evitem{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.evmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px}

.tag.article{background:var(--info-soft);color:var(--info)}
.tag.external-verified{background:var(--ok-soft);color:var(--ok)}
.tag.external-nodate{background:var(--warn-soft);color:var(--warn)}
.tag.ungrounded{background:var(--bad-soft);color:var(--bad)}
.tag.metadata,.tag.none{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
.detail a{color:var(--info);word-break:break-all;text-decoration:none;font-size:12.5px} .detail a:hover{text-decoration:underline}
.deconbox{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:6px;color:var(--ink2)}
.mono{font-family:"JetBrains Mono",monospace}

.tag.article-recovered{background:var(--info-soft);color:var(--info)}

.tag.image{background:var(--info-soft);color:var(--info)}
</style>

-unrelated-rally-social-media-22651", "img": "media/678cf0f1e2f02e5f49847ee5_CLAIM_0.jpg", "orig": "", "ev": [{"s": "The photo shows a protest rally against narco-terrorism held in Imphal, Manipur, on July 29, 2023, not a rally in support of the accused in the Manipur video case.", "u": "", "d": "", "p": "metadata"}, {"s": "The rally depicted in the image was organized by the Co-ordinating Committee for Manipur's Integrity (COCOMI) to reaffirm their stand against Chin Kuki Narco-Terrorism.", "u": "https://web.archive.org/web/20231207050404/https://northeastlivetv.com/around-ne/manipur/manipur-mega-cocomi-rally-against-narco-terrorism-and-demand-for-separate-administration/#:~:text=A%20sea%20of%20people%20swarmed,in%20support%20of%20their%20demands.", "d": "", "p": "article-recovered", "article_sources": [{"url": "https://web.archive.org/web/20231207050404/https://northeastlivetv.com/around-ne/manipur/manipur-mega-cocomi-rally-against-narco-terrorism-and-demand-for-separate-administration/#:~:text=A%20sea%20of%20people%20swarmed,in%20support%20of%20their%20demands.", "rank": 1, "origin": "ARTICLE_HYPERLINK", "selected": true, "support_status": "UNVERIFIABLE", "support_reason": "FETCH_FAILED", "role": null, "material": {"source_type": "UNKNOWN", "format": "HTML"}}, {"url": "https://web.archive.org/web/20231207050404/https://archive.vn/7AJNt", "rank": 2, "origin": "ARTICLE_HYPERLINK", "selected": false, "support_status": "UNVERIFIABLE", "support_reason": "FETCH_FAILED", "role": null, "material": {"source_type": "UNKNOWN", "format": "HTML"}}, {"url": "https://web.archive.org/web/20231207050404/http://web.archive.org/web/20230729062457/https://www.ifp.co.in/manipur/public-rally-calls-for-stopping-arrests-in-viral-video-case", "rank": 3, "origin": "ARTICLE_HYPERLINK", "selected": false, "support_status": "UNVERIFIABLE", "support_reason": "FETCH_FAILED", "role": null, "material": {"source_type": "UNKNOWN", "format": "HTML"}}, {"url": "https://www.aljazeera.com/gallery/2023/7/16/photos-armed-mobs-rampage-through-indian-state-of-manipur", "rank": 4, "origin": "EXTERNAL_SEARCH", "selected": false, "support_status": "UNVERIFIABLE", "support_reason": "The source text discusses ethnic clashes, casualties, and the nature of the unre", "role": null, "material": {"source_type": "UNKNOWN", "format": "HTML"}}], "previous_source": {"url": "https://www.gettyimages.com/photos/india-unrest-manipur-politics", "date": ""}, "attach": "unverified"}, {"s": "Protestors in the image are seen holding a banner that reads 'MASS RALLY AGAINST CHIN-KUKI NARCO-TERRORISM'.", "u": "", "d": "", "p": "image"}], "ev2r": {"R": 0.5, "P": 0.67, "n_ref": 4}}, {"id": 6, "claim": "In Nigeria, 20% of revenue goes to local government, 35% goes to state governments, and 45% goes to the federal government.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210307003741/https://africacheck.org/fact-checks/reports/kenyas-ex-prime-minister-odinga-mangles-his-numbers-government-revenue-share", "img": "", "orig": "", "ev": [{"s": "Since 2004, Nigeria's revenue sharing formula has allocated 52.68% to the federal government, 26.72% to states, and 20.60% to local governments; according to data from Nigeria's extractive industries transparency initiative, local governments receive approximately 20.6% of national revenue, and in 2019, local governments received N1.04 trillion out of N5.05 trillion available for sharing, which is approximately 20%.", "u": "https://www.neiti.gov.ng/index.php/revenue-allocation", "d": "", "p": "article"}, {"s": "Data from Nigeria's extractive industries transparency initiative shows that 26.72% of revenue is reserved for state governments, and in 2019, state governments received N1.35 trillion out of N5.05 trillion, which equates to 26.72%.", "u": "https://www.neiti.gov.ng/index.php/revenue-allocation", "d": "", "p": "article"}, {"s": "The federal government receives more than half of the total revenue in Nigeria, and in 2019, the federal government received N2.66 trillion of the N5.05 trillion available, which aligns with the 52.68% sharing formula.", "u": "https://www.neiti.gov.ng/index.php/revenue-allocation", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 11, "claim": "In Nigeria, 20% of revenue goes to local governments, 35% goes to state governments, and 45% goes to the federal government.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210307003741/https://africacheck.org/fact-checks/reports/kenyas-ex-prime-minister-odinga-mangles-his-numbers-government-revenue-share", "img": "", "orig": "", "ev": [{"s": "Since 2004, the revenue allocation formula in Nigeria has remained at the levels established in a March 2004 circular from the finance ministry, where Nigeria's revenue sharing formula has allocated 52.68% to the federal government (which in 2019 received N2.66 trillion out of the N5.05 trillion available for sharing), 26.72% to states, and 20.60% to local governments, according to data from Nigeria's extractive industries transparency initiative.", "u": "http://www.internationalpolicybrief.org/images/2019/FEBRUARY/IJORMSSE/ARTICLE7.pdf#page=1", "d": "", "p": "article"}, {"s": "Value-added tax (VAT) is shared among Nigeria's three levels of government using a different formula: 35% to local governments, 50% to state governments, and 15% to the federal government.", "u": "https://africacheck.org//wp-content/uploads/2020/09/Nigeria-MTEF-Fiscal-Strategy-Paper-2020-22.pdf#page=8", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 35, "claim": "President Nana Addo Dankwa Akufo-Addo claimed that his administration increased Ghana's average annual GDP growth to 7% for three successive years from a 3.4% rate, and that the Ghana Living Standards Survey shows unemployment rates fell from 11.9% in 2015 to 7.3% in 2019.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Not Enough Evidence", "art": "https://web.archive.org/web/20210228151829/https://ghanafact.com/2020/08/fact-check-akufo-addos-speech-at-npp-manifesto-launch/", "img": "", "orig": "", "ev": [{"s": "The GDP growth rate averaged 6.94% during the first three years of President Akufo-Addo's administration, while the 3.4% GDP growth rate mentioned by the President refers only to the 2016 growth rate under Former President Mahama, not the average of his first three years, which was 4.09%.", "u": "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG?locations=GH", "d": "", "p": "article"}, {"s": "The Ghana Living Standards Survey (GLSS) was not conducted in 2015 or 2019, as it is conducted every five years, with editions occurring in 2012/13 and 2016/17, where the unemployment rate in the 2012/13 GLSS report was 5.2% and according to the GLSS 2016/17 report, the unemployment rate was 8.4%.", "u": "https://statsghana.gov.gh/gssmain/fileUpload/Living%20conditions/GLSS6_Main%20Report.pdf", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 45, "claim": "Only 31% of South Africans drink alcohol. South Africans drink more alcohol per person than anywhere else in Africa. South Africans are among the top drinkers in the world.", "date": "", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "Supported", "art": "https://web.archive.org/web/20210102061347/https://africacheck.org/reports/fact-checking-south-africas-health-minister-on-the-countrys-relationship-with-alcohol/", "img": "", "orig": "", "ev": [{"s": "According to WHO data, 69% of South Africans over the age of 15 did not drink alcohol in 2016, meaning approximately 31% did drink, and research confirms that only 31% of South Africans drink alcohol.", "u": "https://apps.who.int/iris/bitstream/handle/10665/274603/9789241565639-eng.pdf?sequence=1&isAllowed=y", "d": "", "p": "article"}, {"s": "In 2016, South African drinkers over the age of 15 consumed an average of 29.9 litres of pure alcohol each, which works out to 64.6 grams of pure alcohol per day compared to a global average of 32.8 grams per drinker per day; however, Tunisia (36.6 litres), Eswatini (34.4 litres) and Namibia (32.4 litres) had higher alcohol consumption levels among drinkers than South Africa, and on a per capita basis (including non-drinkers), South Africa ranked 9th out of 53 African countries with 9.3 litres of pure alcohol per person in 2016, while South Africa ranked sixth out of 189 countries for alcohol consumption among drinkers.", "u": "https://apps.who.int/iris/bitstream/handle/10665/274603/9789241565639-eng.pdf?sequence=1&isAllowed=y#page=203", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 47, "claim": "Only 31% of South Africans drink alcohol. South Africans drink more alcohol per person than anywhere else in Africa, and they are among the top drinkers in the world.", "date": "", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "Refuted", "art": "https://web.archive.org/web/20210102061347/https://africacheck.org/reports/fact-checking-south-africas-health-minister-on-the-countrys-relationship-with-alcohol/", "img": "", "orig": "", "ev": [{"s": "Research shows that approximately 31% of South Africans drink alcohol, and according to WHO data, 69% of South Africans over the age of 15 did not drink alcohol in 2016.", "u": "https://apps.who.int/iris/bitstream/handle/10665/274603/9789241565639-eng.pdf?sequence=1&isAllowed=y", "d": "", "p": "article"}, {"s": "South African drinkers over the age of 15 consumed an average of 29.9 litres of pure alcohol each in 2016, while Tunisia (36.6 litres), Eswatini (34.4 litres) and Namibia (32.4 litres) had higher levels of alcohol consumption among drinkers than South Africa; on a per capita basis (including non-drinkers), South Africa ranked 9th out of 53 African countries with 9.3 litres of pure alcohol per person in 2016, whereas Nigeria had the highest per capita alcohol consumption in Africa with 13.4 litres per person, and South Africa ranked sixth out of 189 countries for alcohol consumption among drinkers, with South African drinkers consuming an average of 64.6 grams of pure alcohol per day compared to a global average of 32.8 grams per drinker per day.", "u": "https://apps.who.int/iris/bitstream/handle/10665/274603/9789241565639-eng.pdf?sequence=1&isAllowed=y#page=203", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 56, "claim": "Arizona Superintendent of Public Instruction Kathy Hoffman swore her oath of office on a Dr. Seuss book and is pushing for sex education that teaches kindergartners about masturbation and sexual positions.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210217053253/https://checkyourfact.com/2020/08/26/fact-check-misinformation-arizona-superintendent-hoffman-sex-education/", "img": "", "orig": "", "ev": [{"s": "Kathy Hoffman took her oath of office in January 2019 on the children's book 'Too Many Moose!' by Lisa Bakos, not a Dr. Seuss book, because it had sentimental value and was a favorite of her former students; there is no legal requirement for public officials to swear in on the Bible or any religious book under the U.S. Constitution's Article VI, Clause 3.", "u": "https://thehill.com/homenews/state-watch/424367-dem-schools-chief-takes-oath-of-office-on-childrens-book", "d": "", "p": "article"}, {"s": "The claim regarding sex education stems from a June 2019 proposal to change Arizona sex education guidelines, which did not include teaching kindergartners about masturbation and sexual positions, but focused on removing language prohibiting 'abnormal' sexual acts and ensuring instruction is 'medically accurate' rather than changing the age of instruction; these proposed changes were never implemented, and Arizona sex education guidelines state that all instruction must be age-appropriate, while sex education in Arizona is optional, determined at the local level, and requires parental opt-in.", "u": "https://www.azcentral.com/story/news/local/arizona-education/2019/06/26/arizona-sex-ed-state-board-meeting-public-schools-instruction/1560006001/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 138, "claim": "The Choluteca bridge in Honduras was built in 1996 and withstood Hurricane Mitch in 1998, despite the hurricane changing the river's course so that it no longer flows under the bridge.", "date": "", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "Supported", "art": "https://web.archive.org/web/20210508170245/https://newsmeter.in/fact-check-yes-choluteca-bridge-withstood-hurricane-mitch-in-1998", "img": "", "orig": "", "ev": [{"s": "The Choluteca bridge in Honduras survived Hurricane Mitch in 1998 in near perfect condition, but the storm caused the river to change its course so that it no longer flows under the bridge.", "u": "https://www.linkedin.com/pulse/you-building-choluteca-bridge-vivek-saxena", "d": "", "p": "external-verified"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 184, "claim": "1.11 lakh laddus are being prepared for the Ayodhya Ram Mandir Bhoomi Pujan ceremony. A kitchen will be established at the Ram Mandir to offer free meals and \"Raghupati\" laddus to devotees.", "date": "", "mod": "text-only", "pred": "Supported", "gold": "Supported", "art": "https://web.archive.org/web/20201025104755/https://newsmeter.in/claims-of-1-11l-laddus-prepared-for-ram-mandir-bhoomi-pujan-are-true/", "img": "", "orig": "", "ev": [{"s": "1.11 lakh gram flour laddus are being prepared in pure desi ghee for the Ram Mandir Bhoomi Pujan ceremony by 15 special chefs from Vindhyachal beginning on August 3, and the distribution of the 1.11 lakh laddus will be handled by Devraha Baba’s organization.", "u": "https://timesofindia.indiatimes.com/life-style/food-news/111000-laddoos-being-prepared-for-ram-mandir-foundation-stone-laying-ceremony/articleshow/77279155.cms", "d": "", "p": "external-verified"}, {"s": "The Mahavir Temple Trust of Patna will arrange a community banquet called 'Ram Rasoi' near the Lord Ram Janambhoomi site in Ayodhya to provide regular meals and 'Raghupati' laddus to devotees.", "u": "https://news.abplive.com/videos/news/free-meals-for-devotees-as-ram-rasoi-begins-across-ayodhya-1116983", "d": "", "p": "external-verified"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 228, "claim": "5G cell towers have military-grade capabilities and are being strategically installed near schools and playgrounds to target children and fetuses with radiation that causes cancer and infertility.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210308120302/https://leadstories.com/hoax-alert/2020/07/fact-check-no-proof-5g-causes-cancer-infertity-more-towers-not-targeting-children.html", "img": "", "orig": "", "ev": [{"s": "There is no scientific proof that 5G technology causes cancer or infertility, as 5G networks use non-ionizing radiation which lacks the ability to directly damage DNA in cells, and while some scientists have expressed concerns about EMF exposure, there is no conclusive proof that 5G causes the specific maladies claimed in the video, while the FDA maintains that current safety limits for cellphone radiofrequency energy exposure are acceptable for protecting public health.", "u": "https://www.cancer.org/cancer/cancer-causes/radiation-exposure/cellular-phone-towers.html", "d": "", "p": "article"}, {"s": "There is no evidence that telecommunications companies are strategically targeting children in schools or playgrounds with 5G technology, and cell towers do not emit the frequency or power levels required to function as military-grade weapons.", "u": "https://www.linkedin.com/pulse/5g-weapon-should-we-scared-dr-michelle-dickinson-mnzm-", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 295, "claim": "Hackers in China are using \"Good Morning\" and \"Good Night\" images and videos on WhatsApp to hide phishing codes that steal personal and bank card information.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210112075437/https://newsmeter.in/fact-checkhidden-phishing-codes-are-not-shared-with-whatsapp-good-morning-messages/", "img": "", "orig": "", "ev": [{"s": "A similar hoax message regarding 'Good Morning' images has been circulating since at least 2017, and a Kathmandu-based channel had previously identified this specific message as a hoax in January 2018.", "u": "https://www.thestar.com.my/news/true-or-not/2018/01/21/true-or-not-its-okay-to-say-good-morning-really", "d": "", "p": "article"}, {"s": "While digital steganography can hide malware in images, this method is not restricted to 'good morning' or 'good night' messages.", "u": "https://www.virusbulletin.com/virusbulletin/2016/04/how-it-works-steganography-hides-malware-image-files/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 333, "claim": "The Obama administration stopped testing for the H1N1 swine flu pandemic right in the middle of the outbreak.", "date": "", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "Refuted", "art": "https://web.archive.org/web/20210426170815/https://www.factcheck.org/2020/07/trump-misleads-on-h1n1-swine-flu-testing/", "img": "", "orig": "", "ev": [{"s": "The World Health Organization also announced in July 2009 that it would no longer issue global reports on confirmed H1N1 cases due to the difficulty of testing such a large number of cases.", "u": "https://www.cidrap.umn.edu/avian-influenza-bird-flu/who-says-h1n1-pandemic-over", "d": "", "p": "external-verified"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 334, "claim": "South Africa has an established vaccine manufacturing capability and expertise in the development and trial of a range of vaccines.", "date": "", "mod": "text-only", "pred": "Supported", "gold": "Supported", "art": "https://web.archive.org/web/20210226010455/https://africacheck.org/fact-checks/reports/south-african-president-ramaphosa-correct-about-countrys-ability-make-vaccines", "img": "", "orig": "", "ev": [{"s": "South Africa has a history of producing human vaccines, such as polio and smallpox, through its State Vaccine Institute, the South African Institute of Medical Research, and the National Institute of Virology, though since the early 2000s it has not manufactured vaccines from start to finish, largely due to cost; meanwhile, the Biovac Institute is a public-private entity responsible for the government's human vaccine procurement that currently supplies 25 million doses of vaccines annually, can manufacture certain types of vaccines like mRNA, DNA, protein-subunit, and inactivated vaccines but currently imports the raw materials and does not manufacture the active pharmaceutical ingredient (drug substance) locally, and has developed technology for the manufacture of Haemophilus influenzae type b (Hib) conjugate vaccine which has been transferred to international manufacturers.", "u": "https://journals.co.za/docserver/fulltext/m_samj/30/25/30656.pdf?expires=1594720711&id=id&accname=guest&checksum=CB03C593D0DD2F1DCBBCB593730A7898", "d": "", "p": "article"}, {"s": "Only one locally developed human vaccine has reached the human-trial stage in South Africa, which was an HIV vaccine developed primarily by a team at the University of Cape Town, yet South Africa possesses extensive infrastructure and capability for conducting clinical trials with over a thousand trials currently underway, including participation in clinical trials for a Covid-19 vaccine candidate developed by the Jenner Institute at the University of Oxford.", "u": "https://jvi.asm.org/content/93/8/e02155-18/article-info", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 343, "claim": "Dr. Paa Kwasi Nduom endorsed Prof. Naana Opoku-Agyeman over Vice President Mahamudu Bawumia and called him a \"talkative.\" Prof. Stephen Adei praised Prof. Naana Opoku-Agyeman as a great leader during an interview on 3 FM.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210122052511/https://ghanafact.com/2020/07/what-did-dr-paa-kwasi-nduom-and-prof-stephen-adei-say-about-ndcs-running-mate/", "img": "", "orig": "", "ev": [{"s": "The claim that Prof. Stephen Adei praised Prof. Naana Opoku-Agyeman as a great leader during a 3 FM interview is false, as both Prof. Stephen Adei and 3 FM issued rejoinders refuting the claim that he made those comments during an interview on July 10, with a rejoinder regarding Prof. Adei's comments available via MyJoyOnline.", "u": "https://3news.com/we-did-not-interview-prof-adei-on-opoku-agyemang-alfred-ocansey/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 356, "claim": "Dr. Paa Kwasi Nduom endorsed Prof. Naana Opoku-Agyeman over Vice President Mahamudu Bawumia. Prof. Stephen Adei described Prof. Naana Opoku-Agyeman as a great leader during an interview on 3 FM.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210122052511/https://ghanafact.com/2020/07/what-did-dr-paa-kwasi-nduom-and-prof-stephen-adei-say-about-ndcs-running-mate/", "img": "", "orig": "", "ev": [{"s": "The claim that Prof. Stephen Adei described Prof. Naana Opoku-Agyeman as a great leader during a 3 FM interview is false, as both Prof. Stephen Adei and the radio station 3 FM issued official refutations regarding the alleged interview, with a rejoinder from 3 FM specifically stating they did not interview Prof. Adei regarding Prof. Opoku-Agyeman.", "u": "https://3news.com/we-did-not-interview-prof-adei-on-opoku-agyemang-alfred-ocansey/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 370, "claim": "The COVID-19 outbreak in Leicester was caused by Muslims failing to understand government messaging and refusing to use alcohol-based hand sanitiser because it is against their religion.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210119124632/https://fullfact.org/health/leicester-covid-outbreak-islam/", "img": "", "orig": "", "ev": [{"s": "The claim that Muslims caused the Leicester outbreak by failing to understand government messaging is not proven and has not been explicitly tied to any one community, as the Department of Health and Social Care suggested the Leicester outbreak was due to household transmission, lower social distancing compliance, and workplace transmission, rather than a specific religious group.", "u": "https://www.leicestermercury.co.uk/news/leicester-news/reasons-coronavirus-outbreak-leicester-according-4282049", "d": "", "p": "article"}, {"s": "There is no evidence that Muslims use hand sanitiser less than other communities or that hand sanitiser use was a factor in the Leicester outbreak, especially as many Muslims consider the use of alcohol-based hand sanitiser to be permissible, as the prohibition in Islam generally relates to drinking alcohol rather than topical disinfection, and the Muslim Council of Britain (MCB) issued guidance recommending frequent hand washing with soap and water or the use of hand sanitiser gel.", "u": "https://mcb.org.uk/resources/coronavirus/", "d": "", "p": "article"}, {"s": "Health Secretary Matt Hancock stated that a high number of cases in children prompted the Leicester lockdown.", "u": "https://www.telegraph.co.uk/news/2020/06/30/tuesday-evening-news-briefing-cause-leicester-lockdown/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 402, "claim": "The rollout of 5G in Leicester is linked to the city going back into lockdown.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210119120532/https://fullfact.org/online/leicester-5g-no-connection-covid/", "img": "", "orig": "", "ev": [{"s": "5G coverage was available in Leicester since at least November 2019, which was months before Covid-19 was detected in the UK, while other cities, like Hull, Leeds and Newcastle, first got 5G more recently than Leicester, from at least December 2019, and these places aren’t currently going back into lockdown.", "u": "https://newsroom.ee.co.uk/ee-continues-5g-rollout-and-takes-top-spot-in-independent-5g-testing/", "d": "", "p": "article"}, {"s": "The re-imposition of lockdown restrictions in Leicester was due to the rising number of Covid-19 cases in the city.", "u": "https://www.gov.uk/government/speeches/local-action-to-tackle-coronavirus", "d": "", "p": "article"}, {"s": "5G technology is not linked to the symptoms or cause of Covid-19, which is caused by the SARS-CoV-2 virus and its genetic material has been sequenced, and 5G uses non-ionising radio waves which cannot damage DNA inside cells.", "u": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7180649/", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 457, "claim": "Face masks violate OSHA oxygen standards, cloth masks do not filter anything and trap carbon dioxide, surgical masks spread germs, and N95 masks expel unfiltered air.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210222141326/https://factcheck.afp.com/covid-19-cases-spike-us-mask-misinformation-also-spreads", "img": "", "orig": "", "ev": [{"s": "The claim that masks violate OSHA's 19.5% minimum oxygen level is false as OSHA has made no determination about masks' impact on oxygen levels, and masks worn in the workplace to slow the spread of COVID-19 should not pose an oxygen deficiency risk; cloth masks are porous enough to allow the free flow of oxygen and carbon dioxide, meaning they do not trap CO2 or cause oxygen deficiency, and the claim that cloth masks do not filter anything is false as evidence suggests they limit the transmission of virus droplets, while correctly worn masks filter out particles without preventing the exchange of air, oxygen, and carbon dioxide.", "u": "https://deohs.washington.edu/faculty/marissa-baker", "d": "", "p": "article"}, {"s": "The claim that surgical masks must be changed every 20-30 minutes to avoid spreading germs is misleading as they should be changed when noticeably dirty or damaged; while N95 masks with one-way valves allow unfiltered air to be exhaled, which is why they are not recommended for protecting people around the wearer during COVID-19, the unvented N95 masks recommended for healthcare workers are more effective at preventing spread.", "u": "https://perma.cc/7YTX-B5QH", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 480, "claim": "Nigeria has the highest burden of sickle cell disease worldwide. Nigeria bears 50% of the global sickle cell burden. One out of every two babies born with sickle cell disease in the world is Nigerian.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210317230435/https://africacheck.org/fact-checks/reports/weighing-nigerias-sickle-cell-burden-it-worlds-highest", "img": "", "orig": "", "ev": [{"s": "Nigeria has the highest burden of sickle cell disease worldwide, with disability-adjusted life years (DALY) for sickle cell disorders being the highest globally at 643,374 per 100,000 people and the highest global death rate from sickle cell disease complications at 7,105 per 100,000.", "u": "https://docs.google.com/document/d/1FLwtmU2Usp9i9pFoEgGAHlyslbRZg11OdSe96Y5VeV0/edit", "d": "", "p": "article"}, {"s": "Nigeria's share of the global sickle cell burden is approximately 30%, not 50%; in 2010, Nigeria, India, and the Democratic Republic of the Congo combined represented 57% of the annual number of newborns with sickle cell anaemia; Nigeria's share of the global newborn sickle cell burden is projected to increase from 30% to 35% by 2050, and one in every three babies born with sickle cell in the world is Nigerian, rather than one in two.", "u": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1001484", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 482, "claim": "The Twitter accounts of Benjamin Netanyahu and Donald Trump have shared messages expressing their support for India amid the border tensions between India and China.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210413181143/https://www.thequint.com/news/webqoof/stand-with-india-netizens-fall-for-fake-accounts-of-world-leaders-fact-check", "img": "", "orig": "", "ev": [{"s": "The Twitter account claiming to be Benjamin Netanyahu that tweeted 'I stand with India' was a fake impersonating account using the incorrect spelling @Netyanyahu.", "u": "http://archive.is/yd4TD", "d": "", "p": "article"}, {"s": "A fake Twitter account impersonating US President Donald Trump used the incorrect spelling @realDonaldkTrum, shared messages of support for India and called for a boycott of Chinese products, though there has been no official word from Benjamin Netanyahu or Donald Trump regarding support for India during the border tensions with China.", "u": "http://archive.is/ppOs0", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}, {"id": 491, "claim": "One out of every two babies born with sickle cell disease in the world is Nigerian.", "date": "", "mod": "text-only", "pred": "Refuted", "gold": "Refuted", "art": "https://web.archive.org/web/20210317230435/https://africacheck.org/fact-checks/reports/weighing-nigerias-sickle-cell-burden-it-worlds-highest", "img": "", "orig": "", "ev": [{"s": "Research indicates that in 2010, Nigeria, India, and the Democratic Republic of the Congo together accounted for 57% of the annual number of newborns with sickle cell anaemia, and Nigeria's share of the global newborn sickle cell anaemia burden is projected to increase from 30% to 35% by 2050.", "u": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1001484", "d": "", "p": "article"}], "ds": "AVeriTeC", "ev2r": null}];
function vclass(d){
  const g = d.gold||"", p = d.pred||"";
  if (g && g===p) return "ok";
  if (!g || p==="Not Enough Evidence" || p==="Conflicting Evidence/Cherrypicking") return "na";
  return g ? "bad" : "na";
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
// BEGIN ARTICLE SOURCE RENDERER
const MATERIAL_LABELS={ACADEMIC:"Academic literature",OFFICIAL:"Official / judicial",NEWS:"News",ORGANIZATION:"Organization / company",SOCIAL:"Social post",REFERENCE:"Reference / document mirror",MEDIA_ARCHIVE:"Image archive",FACT_CHECK:"Fact-check",UNKNOWN:"Unclassified"};
function sourceLink(url,label){return /^https?:\/\//i.test(url||"")?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(label||url)}</a>`:""}
function sourceRow(s){
  const type=(s.material||{}).source_type||"UNKNOWN";
  const format=(s.material||{}).format||"UNKNOWN";
  return `<div class="source-row"><div class="evmeta"><span class="tag article">Article link #${s.rank}</span><span>${esc(MATERIAL_LABELS[type]||type)}</span><span>${esc(format)}</span></div>${sourceLink(s.url)}<details class="source-history" onclick="event.stopPropagation()"><summary>Source details</summary><div>Original anchor: ${esc((s.article_anchor||{}).anchor||"[unnamed link]")}</div>${s.page_date?`<div>Source date: ${esc(s.page_date)} (${esc(s.date_source||"unknown field")})</div>`:""}</details></div>`;
}
function evidenceHTML(e){
  if(!e.article_sources){
    const label=e.p==="external-verified"?"External search":e.p==="image"?"Image evidence":e.p==="metadata"?"Metadata (no URL by design)":e.p;
    const note=e.article_recovery_status?`<div class="source-hint">${e.article_recovery_status==="NO_ARTICLE_CANDIDATE"?"No article-link candidate was found; the previous external URL is retained.":"Not covered by this recovery batch; the previous external URL is retained."}</div>`:"";
    return `<div class="evitem">${esc(e.s)}<div class="evmeta"><span class="tag ${esc(e.p)}">${esc(label)}</span>${e.d?`<span class="mono">${esc(e.d)}</span>`:""}</div>${sourceLink(e.u)}${note}</div>`;
  }
  const selected=e.article_sources.filter(s=>s.selected),shown=selected.length?selected:e.article_sources;
  const others=selected.length?e.article_sources.filter(s=>!s.selected):[];
  const label="Fact-checking article links";
  const extra=others.length?`<details class="source-history" onclick="event.stopPropagation()"><summary>Other article candidates (${others.length})</summary>${others.map(sourceRow).join("")}</details>`:"";
  const old=e.previous_source||{};
  return `<div class="evitem">${esc(e.s)}<div class="source-label">${label}</div><div class="source-list">${shown.map(sourceRow).join("")}</div>${extra}<details class="source-history" onclick="event.stopPropagation()"><summary>Previous external-search URL</summary>${sourceLink(old.url)}${old.date?`<div>Previous source date: ${esc(old.date)}</div>`:""}</details></div>`;
}
// END ARTICLE SOURCE RENDERER

function card(d){
  const vc = vclass(d);
  const vlabel = vc==="ok" ? "✓ " : vc==="bad" ? "✗ " : "";
  const img = d.img ? `<img class="cardimg" src="${d.img}" loading="lazy" alt="claim media">` : "";
  const ev = d.ev.map(evidenceHTML).join("");
  const decon = d.orig ? `<h4>Decontextualization</h4><div class="deconbox">original: ${esc(d.orig)}</div>` : "";
  return `<div class="card" onclick="this.classList.toggle('open')">${img}<div class="cardbody">
  <div class="claimtext">${esc(d.claim)}</div>
  <div class="cfoot"><span>#${d.id}</span><span>${d.date}</span><span class="chip mod">${d.mod}</span><span class="chip mod">${d.ds}</span>${d.ev2r?`<span class="chip mod" title="official-protocol EV2R, evidence score for this claim">EV2R R ${d.ev2r.R} · P ${d.ev2r.P}</span>`:""}
  <span class="chip v-${vc}" style="margin-left:auto">${vlabel}${esc(d.pred||"—")}${d.gold?` · gold: ${esc(d.gold)}`:""}</span></div>
  <div class="detail">${decon}<h4>Evidence (${d.ev.length})</h4>${ev}
  <h4>Source</h4><a href="${esc(d.art)}" target="_blank" onclick="event.stopPropagation()">fact-checking article ↗</a></div></div></div>`;
}
function render(){
  const fv=document.getElementById("fVerdict").value, fm=document.getElementById("fMod").value,
        fe=document.getElementById("fEv").value, ord=document.getElementById("fOrder").value;
  let list=[...DATA];
  list.sort((a,b)=>ord==="desc"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  const htmls=[]; let n=0;
  for(const d of list){
    const fds=document.getElementById("fDs").value; if(fds && d.ds!==fds) continue;
    if(fv && vclass(d)!==fv) continue;
    if(fm && d.mod!==fm) continue;
    if(fe && !d.ev.some(e=>e.p===fe)) continue;
    htmls.push(card(d)); n++;
  }
  document.getElementById("grid").innerHTML=htmls.join("");
  document.getElementById("count").textContent=n+" shown";
  document.getElementById("pill").textContent=DATA.length+" claims";
}
for(const id of ["fDs","fVerdict","fMod","fEv","fOrder"]) document.getElementById(id).addEventListener("change",render);
const btn=document.getElementById("themeBtn");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);btn.textContent=t==="dark"?"☀️":"🌙";localStorage.setItem("mcfc_theme",t)}
btn.onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
setTheme(localStorage.getItem("mcfc_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
render();
</script>
