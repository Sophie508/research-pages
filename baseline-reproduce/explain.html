<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Explainer · Baseline Reproduce</title>
<meta name="description" content="逐步查看四个文本 fact-checking baseline 从输入 claim 到最终判决的每一步真实中间结果。">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafbfc;--card:#ffffff;--ink:#101828;--ink2:#475467;--ink3:#98a2b3;--line:#eaecf0;--accent:#e8590c;--info:#175cd3;--info-soft:#eff8ff;
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);--surface2:#f2f4f7;
  --k-io:#101828;--k-io-bg:#ffffff;--k-llm:#e8590c;--k-llm-bg:#fff4ed;--k-web:#175cd3;--k-web-bg:#eff8ff;--k-emb:#079455;--k-emb-bg:#ecfdf3;--k-alg:#475467;--k-alg-bg:#f2f4f7;
  --v-ref:#d92d20;--v-sup:#079455;--v-nee:#667085;--v-con:#dc6803;--ok:#079455;--bad:#d92d20;--warn:#dc6803}
[data-theme="dark"]{--bg:#0c111d;--card:#161b26;--ink:#f5f5f6;--ink2:#94969c;--ink3:#61646c;--line:#1f242f;--accent:#ff692e;--info:#84adff;--info-soft:#0e1f3d;--shadow:0 1px 3px rgba(0,0,0,.4);--surface2:#1c2130;
  --k-io:#f5f5f6;--k-io-bg:#161b26;--k-llm:#ff9c66;--k-llm-bg:#2a1608;--k-web:#84adff;--k-web-bg:#0e1f3d;--k-emb:#47cd89;--k-emb-bg:#0a2a1c;--k-alg:#cecfd2;--k-alg-bg:#1c2130;
  --v-ref:#f97066;--v-sup:#47cd89;--v-nee:#94969c;--v-con:#fdb022;--ok:#47cd89;--bad:#f97066;--warn:#fdb022}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 "DM Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
nav.top{display:flex;align-items:center;gap:22px;padding:0 32px;height:60px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:30}
nav.top .brand{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
nav.top .section-name{font-weight:600;color:var(--ink2);font-size:14.5px;padding-left:22px;border-left:1px solid var(--line)}
nav.top .navlinks{display:flex;gap:20px;margin-left:auto;font-weight:500;color:var(--ink2);font-size:14.5px;flex-wrap:wrap}
nav.top .navlinks a{color:inherit} nav.top .navlinks a.on{color:var(--ink);border-bottom:2px solid var(--accent)} nav.top .navlinks a:hover{color:var(--ink);text-decoration:none}
#themeBtn{background:none;border:none;font-size:18px;color:var(--ink2)}

/* control bar, same role as the explainer's top bar */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:12px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.ctl label{white-space:nowrap;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
select.ex{max-width:520px;min-width:260px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.scrub{display:flex;align-items:center;gap:10px;flex:1;min-width:280px}
.scrub input[type=range]{flex:1;accent-color:var(--accent)}
.play{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:30px;font-size:13px}
.steplabel{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink);white-space:nowrap}

/* claim strip */
.claimbar{padding:16px 32px 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
.claimbar .c{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;max-width:980px}
.claimbar .m{font-size:12.5px;color:var(--ink2)}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.v-Refuted{background:rgba(217,45,32,.12);color:var(--v-ref);border-color:rgba(217,45,32,.35)}
.v-Supported{background:rgba(7,148,85,.12);color:var(--v-sup);border-color:rgba(7,148,85,.35)}
.v-NEE{background:rgba(102,112,133,.12);color:var(--v-nee);border-color:rgba(102,112,133,.35)}
.v-Conflicting{background:rgba(220,104,3,.12);color:var(--v-con);border-color:rgba(220,104,3,.35)}
.v-none{background:var(--surface2);color:var(--ink2);border-color:var(--line)}

/* canvas: columns left to right, ribbons behind */
.stage{position:relative;padding:8px 0 0}
.canvas-wrap{overflow-x:auto;overflow-y:hidden;padding:4px 32px 18px}
.canvas{position:relative;display:flex;gap:40px;align-items:flex-start;min-width:max-content}
svg.ribbons{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.ribbons path{fill:none;stroke-width:1.6;opacity:.45;transition:opacity .2s,stroke-width .2s}
svg.ribbons path.hl{opacity:.95;stroke-width:2.6}
svg.ribbons path.dim{opacity:.07}
svg.ribbons path.future{opacity:0}
.col{width:196px;flex:none;position:relative;z-index:1;transition:opacity .25s}
.col.wide{width:250px}
.col.future{opacity:.22}
.col .hd{border-top:3px solid var(--kc);background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;margin-bottom:10px;cursor:pointer}
.col.current .hd{outline:2px solid var(--kc);outline-offset:1px}
.col .hd .n{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--kc);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.col .hd .t{font-weight:700;font-size:13.5px;line-height:1.3;margin-top:2px}
.col .hd .s{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.item{display:block;width:100%;text-align:left;background:var(--kb);border:1.4px solid var(--kc);border-radius:7px;padding:4px 7px;margin-bottom:4px;transition:opacity .2s,box-shadow .2s,transform .15s}
.item:hover{transform:translateX(1px)}
.item .l{font-size:11.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.item .x{font-size:10px;color:var(--ink2);margin-top:1px;font-family:"JetBrains Mono",monospace;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item.muted{border-style:dashed;opacity:.8}
.item.bad{border-color:var(--bad)} .item.good{box-shadow:inset 3px 0 0 var(--ok)}
.item.hl{box-shadow:0 0 0 2px var(--kc),var(--shadow)}
.item.dim{opacity:.28}
.item.sel{outline:2px solid var(--accent);outline-offset:1px}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex;margin-top:4px}
.bar span{display:block;height:100%}
.k-io{--kc:var(--k-io);--kb:var(--k-io-bg)} .k-llm{--kc:var(--k-llm);--kb:var(--k-llm-bg)} .k-web{--kc:var(--k-web);--kb:var(--k-web-bg)} .k-emb{--kc:var(--k-emb);--kb:var(--k-emb-bg)} .k-alg{--kc:var(--k-alg);--kb:var(--k-alg-bg)}

/* output column: the top-1 and what it is made of */
.out{width:300px;flex:none;position:relative;z-index:1}
.outcard{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.outcard .big{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:22px;margin:4px 0 6px}
.comps{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.comp{border:1.2px solid var(--line);background:var(--surface2);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.comp.hl{border-color:var(--accent);background:var(--k-llm-bg)} .comp.dim{opacity:.35}
.cand{display:grid;grid-template-columns:1fr 64px;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:10px}
.cand .lab{display:flex;align-items:center;gap:6px}
.cand .pbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.cand .pbar span{display:block;height:100%;background:var(--ink3)}
.cand .top .pbar span{background:var(--accent)}
.cand .top .lab{font-weight:700}
.cand .pct{font-family:"JetBrains Mono",monospace;font-size:11.5px;text-align:right;color:var(--ink2)}
.whatif{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.whatif .row{display:grid;grid-template-columns:1fr 110px 18px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.whatif input{accent-color:var(--accent);width:100%}
.whatif .flag{font-size:11.5px;color:var(--warn);margin-top:4px}
.small{font-size:12px} .muted{color:var(--ink2)} .faint{color:var(--ink3)}
.linkbtn{background:none;border:0;color:var(--info);padding:0;font-size:12.5px}

/* explanation + detail */
.lower{padding:6px 32px 50px}
.stepnote{margin:6px 32px 8px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;box-shadow:var(--shadow);padding:10px 16px;min-height:74px}
.stepnote h2{font-family:"Plus Jakarta Sans",sans-serif;font-size:15px;margin-bottom:2px}
.stepnote p{margin:3px 0;color:var(--ink2);font-size:13px} .stepnote p b{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.panel h2{font-family:"Plus Jakarta Sans",sans-serif;font-size:17px;margin-bottom:6px}
.panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:12px 0 6px}
.panel p{margin:6px 0;color:var(--ink2)} .panel p b{color:var(--ink)}
.dev{border-left:3px solid var(--warn);background:rgba(220,104,3,.07);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2);margin-top:8px}
.plain{white-space:pre-wrap;word-break:break-word;font-size:13px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12.5px;color:var(--ink2)} .kv b{color:var(--ink);font-weight:500}
.hitlist{list-style:none;font-size:12.5px} .hitlist li{padding:5px 0;border-bottom:1px solid var(--line);word-break:break-word}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 32px 4px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:9px;border-radius:3px;border:1.5px solid var(--kc);background:var(--kb);margin-right:5px;vertical-align:-1px}
.hint{padding:0 32px 4px;font-size:12px;color:var(--ink3)}
@media (max-width:900px){.stepnote{margin-left:16px;margin-right:16px}.seg{flex-wrap:wrap}.ctl{flex-wrap:wrap}.controls,.claimbar,.canvas-wrap,.lower,.legend,.hint{padding-left:16px;padding-right:16px}nav.top{height:auto;padding:10px 16px;flex-wrap:wrap;gap:8px 16px}nav.top .navlinks{margin-left:0;width:100%;gap:14px}nav.top .section-name{padding-left:0;border-left:0}.claimbar .c{font-size:16px}select.ex{min-width:0;width:100%}}
</style>
</head>
<body>
<nav class="top"><a class="brand" href="../">MCFC Bench</a><a class="section-name" href="index.html#/">Baseline Reproduce</a>
  <div class="navlinks"><a href="../">Home</a><a href="index.html#/">Claims</a><a href="index.html#/compare">Compare</a><a class="on" href="explain.html">Pipeline</a><a href="methods.html">Methods</a><a href="index.html#/results">Results</a><a href="progress.html">Progress</a></div>
  <button id="themeBtn" title="切换明暗主题">🌙</button></nav>

<div class="controls">
  <div class="ctl"><label>示例</label><select class="ex" id="ex"></select></div>
  <div class="ctl"><label>系统</label><span class="seg" id="sys"></span></div>
  <div class="ctl scrub"><label>步骤</label><button class="play" id="play" title="逐步播放">▶</button><input type="range" id="step" min="0" max="1" value="0"><span class="steplabel" id="steplabel"></span></div>
</div>
<div class="claimbar" id="claimbar"></div>
<div class="legend"><span class="k-io"><i></i>输入 / 输出</span><span class="k-llm"><i></i>LLM 调用（Gemma-4-26B）</span><span class="k-web"><i></i>搜索与日期过滤（共同适配层，我们设计）</span><span class="k-emb"><i></i>向量检索（本地嵌入模型）</span><span class="k-alg"><i></i>原系统的非 LLM 步骤</span></div>
<div class="hint">拖动“步骤”或点列标题逐步看；鼠标放在格子上会高亮它的上游和下游；点格子在页面下方看完整内容。</div>
<div class="stepnote" id="explain"></div>
<div class="stage"><div class="canvas-wrap" id="wrap"><div class="canvas" id="canvas"></div></div></div>
<div class="lower"><div class="panel" id="detail"><h2>点一个格子查看完整内容</h2><p>每个格子都是这条 claim 在这一步的真实中间结果，来自冻结的系统输出和运行缓存。</p></div></div>

<script>
(function(){
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>typeof u==='string'&&/^https?:\/\//i.test(u);
const link=(u,t)=>safe(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:esc(t||u||'');
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u||''}};
const cut=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s};
const plain=s=>String(s||'').replace(/^\s*#{1,6}\s*/gm,'').replace(/\*\*|__|`/g,'').replace(/^\s*[-*]\s+/gm,'').replace(/^Passage:\s*/i,'');
const vcls=v=>!v?'v-none':v.startsWith('Ref')?'v-Refuted':v.startsWith('Sup')?'v-Supported':v.startsWith('Not')?'v-NEE':'v-Conflicting';
const short=v=>!v?'无判决':v.replace('Conflicting Evidence/Cherrypicking','Conflicting').replace('Not Enough Evidence','NEE');
const LABELS=['Refuted','Supported','Not Enough Evidence','Conflicting Evidence/Cherrypicking'];
const SYS=[['infact','InFact'],['hero2','HerO2'],['sanctuary','SANCTUARY'],['aic_ctu_averitec','AIC CTU']];
const ADM={admitted:['放行','ok'],admitted_elsewhere:['放行（重复）','ok'],fetch_failed:['抓取失败','bad'],after_claim:['晚于 claim','bad'],unknown_date:['日期不明','warn'],revision_after:['修订晚于 claim','bad'],no_cache:['无缓存','warn']};
const admChip=h=>{const a=ADM[h.admission]||[h.admission,''];return `<span class="chip ${a[1]}" title="${esc(h.why)}">${a[0]}</span>`};

// theme: same key as the rest of MCFC Bench
const tb=$('#themeBtn');function setTheme(t){document.documentElement.setAttribute('data-theme',t);tb.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('mcfc_theme',t)}catch(e){}}
let t0='light';try{t0=localStorage.getItem('mcfc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
setTheme(t0);tb.onclick=()=>{setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');requestAnimationFrame(draw)};

let IDX=null,DOC=null,M=null; const S={ex:null,sys:'infact',step:0,sel:null,whatif:null,timer:null};

// ---------------------------------------------------------------- model builders
// each returns {cols:[{id,kind,n,t,s,calls,explain,items:[{id,kind,l,x,cls,detail}]}], links:[[a,b]], out:{...}}
function funnelText(f){ if(!f) return ''; const r=f.rejected_by_reason||{}; const parts=[['fetch_failed','抓取失败'],['after_claim','晚于 claim'],['unknown_date','日期不明'],['revision_after','修订晚于 claim'],['no_cache','无缓存']].filter(([k])=>r[k]).map(([k,z])=>`${z} ${r[k]}`);
  return `${f.results} 条结果 → ${f.unique_urls} 个去重 URL → <b>${f.admitted} 页放行</b>${parts.length?'（挡掉：'+parts.join('，')+'）':''}`; }
function funnelBar(f){ if(!f||!f.unique_urls) return ''; const a=f.admitted/f.unique_urls*100; return `<div class="bar"><span style="width:${a}%;background:var(--k-web)"></span></div>`; }
function searchHtml(rows){ return rows.map(r=>`<h3>查询：${esc(r.q)} <span class="faint">（取 ${r.num} 条）</span></h3><ul class="hitlist">${r.hits.map(h=>`<li>${admChip(h)} ${link(h.url,h.title||h.url)} <span class="faint mono">${esc(h.page_date||'')}</span></li>`).join('')||'<li class="faint">无结果</li>'}</ul>`).join(''); }
const claimItem=d=>({id:'claim',l:d.claim,x:`${d.claim_date||''}`,detail:()=>`<h2>输入 claim</h2><p class="plain">${esc(d.claim)}</p><div class="kv"><span>日期</span><b>${esc(d.claim_date||'缺失')}</b><span>说话者</span><b>${esc(d.speaker||'—')}</b><span>平台</span><b>${esc(d.reporting_source||'—')}</b><span>gold 标签</span><b>${esc(d.gold_label)}</b></div><p class="small faint">gold 标签只用于评分，系统看不到。</p>`});
const inputCol=d=>({id:'in',kind:'io',n:'输入',t:'数据集里的 claim',s:'文本 + 日期 +（若有）说话者、平台',calls:'',items:[claimItem(d)],explain:{t:'输入',p:[`所有系统的输入都是同一条数据集 claim：<b>${esc(cut(d.claim,160))}</b>。claim 日期 ${esc(d.claim_date||'缺失')} 会被用来过滤网页：只放行发布日期不晚于它的页面。`,'gold 标签（右上角）只在评分时使用，系统在运行时看不到。']}});

function mInfact(d,sd){ const t=sd.trace, Q=t.questions; const cols=[inputCol(d)], L=[];
  cols.push({id:'q',kind:'llm',n:'① 提问',t:'提出 10 个核查问题',s:'prompt: pose_questions.md',calls:'LLM ×1',items:Q.map(q=>({id:'q'+q.i,l:q.question,x:`Q${q.i+1}`,detail:()=>`<h2>问题 Q${q.i+1}</h2><p class="plain">${esc(q.question)}</p>`})),
    explain:{t:'① 提问',p:['InFact 像记者一样先想清楚要问什么：一次 LLM 调用生成 10 个问题，每个问题之后都各自独立去搜、去读。']}});
  Q.forEach(q=>L.push(['claim','q'+q.i]));
  cols.push({id:'g',kind:'llm',n:'② 查询',t:'每个问题生成搜索词',s:'prompt: propose_queries.md；每问题最多 3 条',calls:'LLM ×10',items:Q.map(q=>({id:'g'+q.i,l:q.queries.join(' ｜ ')||'（未生成查询）',x:`${q.queries.length} 条查询`,cls:q.queries.length?'':'muted',detail:()=>`<h2>Q${q.i+1} 的搜索词</h2><ol class="small" style="padding-left:18px">${q.queries.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`})),
    explain:{t:'② 生成查询',p:['对每个问题再调用一次 LLM，让它写出搜索词。'],dev:'D-18：原代码会给每条查询整体加双引号做精确短语搜索，实测 135 次搜索 134 次零命中，适配版去掉了这层引号。D-13：每个问题最多取 3 条查询（原来无上限）。'}});
  Q.forEach(q=>L.push(['q'+q.i,'g'+q.i]));

  H.forEach((h,i)=>L.push(['hq'+i,'ss'+i]));

  H.forEach((h,i)=>L.push(['ss'+i,'bm']));
  cols.push({id:'ck',kind:'emb',n:'④ 语义切块',t:'切成 ≤160 token 的小块',s:'Chonkie + bilingual-embedding-small',calls:'',items:[{id:'ck',l:`${st.n_chunks??'—'} 个小块`,x:st.chunker_fallback?'句子窗口回退':'真实语义切块',detail:()=>`<h2>语义切块</h2><div class="kv"><span>小块数</span><b>${st.n_chunks??'—'}</b><span>是否回退</span><b>${st.chunker_fallback?'是':'否'}</b></div>`}],
    explain:{t:'④ 语义切块',p:[`按语义相似度把这些文档切成不超过 160 token 的小块，本条共 ${st.n_chunks??'—'} 块。`],dev:'D-09：正式运行必须用真实的 Chonkie 语义切块，禁止静默退回句子窗口。'}});
  L.push(['bm','ck']);
  cols.push({id:'ev',kind:'emb',n:'⑤ 向量筛选',t:'每个问题选 ≤20 块',s:'Arctic 相似度 ≥0.52；互相 ≥0.905 的去重',calls:'',items:H.map((h,i)=>{const n=h.kept.length;return {id:'ev'+i,l:n?cut(h.kept.find(k=>k.text)?.text||'',140):'No Evidence.（没有片段过阈值）',x:`Q${i+1} · ${n} 块`,cls:n?'good':'muted',

function mAic(d,sd){ const t=sd.trace; const cols=[inputCol(d)], L=[]; const failed=sd.status!=='ok';
  cols.push({id:'as',kind:'web',n:'① 搜索 + 过滤',t:'claim 原文搜 1 次',s:'共同适配层',calls:'搜索 ×1',items:[{id:'as',l:`${t.funnel.results} 条结果 → ${t.funnel.admitted} 页放行`,x:'查询 = claim 原文',html:funnelBar(t.funnel),cls:t.funnel.admitted?'':'bad',detail:()=>`<h2>搜索与过滤</h2><p>${funnelText(t.funnel)}</p>${searchHtml(t.search)}`}],
    explain:{t:'① 搜索与日期过滤',p:['AIC CTU 只用 claim 原文搜一次。这是四个系统里搜索最少的，也是它最脆弱的地方。',funnelText(t.funnel)+'。',failed?'<b>本条过滤后一页都没剩，后面的步骤全部没有发生，状态记为 retrieval_failed，判决按错误计。</b>':''],dev:'D-14：原系统在 FAISS store 里检索；用 claim 搜一次是本项目的规则（原系统的子查询检索与投稿一致保持关闭）。'}});
  L.push(['claim','as']);
  if(failed){
    [['② 切块 + MMR','emb'],['③ few-shot','alg'],['④ 一次生成','llm'],['⑤ Likert 打分','llm']].forEach(([n,k],j)=>{ cols.push({id:'ghost'+j,kind:k,n,t:'本条没有发生',s:'上一步没有任何可用页面',calls:'',items:[{id:'ghost'+j,l:'未发生',x:'retrieval_failed',cls:'muted',detail:()=>`<h2>${esc(n)}：本条没有发生</h2><p>搜索结果经日期过滤后一页都没剩，这一步没有输入，所以没有执行。</p>`}],explain:{t:n+'（未发生）',p:['上一步没有留下任何可用页面，AIC CTU 的流程在这里就停了：没有切块、没有问答、没有打分。']}}); L.push([j?'ghost'+(j-1):'as','ghost'+j]); });
    return {cols,links:L,out:{calls:'未调用 LLM',components:[],failed:true,explain:{t:'输出：检索失败',p:['没有任何可用的文本块，模型没有被调用，所以没有问答、没有打分、没有判决。这条保留在 100 的固定分母里，按错误计。']}}}; }
  const C=t.chunks;
  cols.push({id:'ch',kind:'emb',n:'② 切块 + MMR',t:`选 ${C.length} 个 2048 字符的块`,s:'mxbai 向量：L2 取 40 → MMR（λ=0.7）选 10',calls:'',items:C.map(c=>({id:'ch'+c.id,l:c.excerpt,x:`Source ${c.id} · ${host(c.url)}`,detail:()=>`<h2>Source ID ${c.id}</h2><p>${link(c.url)}</p><p class="plain">${esc(c.excerpt)}</p><p class="small faint">网页原文摘录（截短）。每块含前后文。检索分数运行时没有记录。</p>`})),
    explain:{t:'② 切块与 MMR 选块',p:[`把放行页面切成 2048 字符的块（每块带前后文），用 mxbai 向量按 L2 距离取最近的 40 块，再用 MMR 在“相关”和“不重复”之间取舍，选出 ${C.length} 块，编号成 Source ID。`],dev:'D-01：修了原代码每篇文档丢最后一句的 bug。检索参数按实际代码 λ=0.7（论文写 0.75）。'}});
  C.forEach(c=>L.push(['as','ch'+c.id]));
  cols.push({id:'fs',kind:'alg',n:'③ few-shot',t:'训练集里挑 10 个相似 claim',s:'BM25 选；整体作为示范放进 prompt',calls:'',items:t.few_shot.map((f,i)=>({id:'fs'+i,l:f.claim,x:short(f.label),detail:()=>`<h2>few-shot 范例 ${i+1}</h2><p class="plain">${esc(f.claim)}</p><p>标签 <span class="badge ${vcls(f.label)}">${esc(f.label)}</span></p><p class="small faint">来自 AVeriTeC 训练集，prompt 里附带它的 gold 问答作为示范。</p>`})),
    explain:{t:'③ few-shot 范例',p:['从训练集里用 BM25 挑 10 条和本条 claim 最像的例子，连同它们的人工问答一起放进 prompt，示范“问答该怎么写”。']}});
  t.few_shot.forEach((f,i)=>L.push(['claim','fs'+i]));
  const Q=t.qa;
  cols.push({id:'gq',kind:'llm',n:'④ 一次生成',t:'问答 + 引用的 Source ID',s:'所有内容在同一次调用里产生',calls:'LLM ×1',items:Q.map((q,i)=>{const sid=parseInt(String(q.source||'').split(',')[0],10);return {id:'gq'+i,l:q.question,x:`${q.answer_type||''} · ${Number.isFinite(sid)?'Source '+sid:'无来源'}`,cls:Number.isFinite(sid)?'good':'muted',
      detail:()=>`<h2>问答 ${i+1}</h2><p class="plain"><b>${esc(q.question)}</b></p><p class="plain">${esc(q.answer)}</p><div class="kv"><span>回答类型</span><b>${esc(q.answer_type||'—')}</b><span>引用</span><b>${Number.isFinite(sid)?'Source ID '+sid:'未提供对应来源'}</b></div>`}}),
    explain:{t:'④ 一次生成问答',p:['把 10 个块、10 个范例和输出格式说明拼成一个大 prompt，模型一次性写出问答（每条注明引用哪个 Source ID）和对四个标签的打分。这是 AIC CTU 唯一的一次 LLM 调用。'],dev:'D-02：原代码解析失败会拿上一条 claim 的输出顶替，我们改成同一条重试一次后记失败。'}});
  Q.forEach((q,i)=>{const sid=parseInt(String(q.source||'').split(',')[0],10); if(Number.isFinite(sid)&&C.some(c=>c.id===sid)) L.push(['ch'+sid,'gq'+i]);});
  const lk=t.likert_raw||{};
  cols.push({id:'lk',kind:'llm',n:'⑤ Likert 打分',t:'四个标签各打 1–5 分',s:'同一次调用的输出',calls:'',items:LABELS.map((lab,i)=>({id:'lk'+i,l:`${short(lab)}：${lk[lab]??'—'} 分`,x:['非常不同意','不同意','中立','同意','非常同意'][(parseInt(lk[lab],10)||3)-1],detail:()=>`<h2>${esc(lab)}</h2><p>模型给“判为 ${esc(lab)}”的同意程度打了 <b>${esc(lk[lab])}</b> 分（1–5）。</p>`})),
    explain:{t:'⑤ Likert 打分',p:['模型对四个候选标签分别打 1–5 分：“我有多同意这条 claim 该判为这个标签”。这四个分数就是最终判决的组件。','④ 和 ⑤ 是同一次调用的两部分输出，所以每条问答都连到全部四个分数：分数取决于模型读到的全部内容，不是某一条问答。']}});
  Q.forEach((q,i)=>LABELS.forEach((l,j)=>L.push(['gq'+i,'lk'+j])));  // same call: every score is conditioned on the whole answer, not on one QA
  LABELS.forEach((l,j)=>L.push(['lk'+j,'OUT']));
  return {cols,links:L,out:{calls:'⑥ softmax → 取最大',components:LABELS.map((l,j)=>({id:'lk'+j,l:`${short(l)} · ${lk[l]} 分`})),probs:t.probs,likert:lk,
    explain:{t:'⑥ softmax → top-1',p:['把四个 Likert 分数映射到 −2…+2，做 softmax 得到四个概率，取最大的一个作为判决。这是四个系统里唯一一个真的有“概率分布”的：下面的条形图就是本条的真实数值。','可以拖下面的“假设”滑杆改某个分数，看 top-1 怎么变。这只是演示计算规则，不是系统输出。']}}};
}
const BUILD={infact:mInfact,hero2:mHero2,sanctuary:mSanct,aic_ctu_averitec:mAic};

// ---------------------------------------------------------------- render
function render(){
  const d=DOC, sd=d.systems[S.sys]; M=BUILD[S.sys](d,sd);
  const nSteps=M.cols.length; $('#step').max=String(nSteps); if(S.step>nSteps) S.step=nSteps;
  $('#claimbar').innerHTML=`<span class="c">${esc(d.claim)}</span><span class="m">${esc(d.claim_date||'')} · 原始 ID ${d.original_index} · gold <span class="badge ${vcls(d.gold_label)}">${esc(d.gold_label)}</span>${d.note?` · ${esc(d.note)}`:''}</span>`;
  const colHtml=M.cols.map((c,ci)=>`<div class="col k-${c.kind}${c.items.length>8?' ':''}" data-ci="${ci}"><div class="hd" data-ci="${ci}"><div class="n"><span>${esc(c.n)}</span><span>${esc(c.calls||'')}</span></div><div class="t">${esc(c.t)}</div><div class="s">${esc(c.s||'')}</div></div>${c.items.map(it=>`<button class="item k-${c.kind} ${it.cls||''}" data-id="${esc(it.id)}" title="${esc(cut(plain(it.l),400))}"><div class="l">${esc(cut(plain(it.l),160))}</div>${it.x?`<div class="x">${esc(it.x)}</div>`:''}${it.html||''}</button>`).join('')}</div>`).join('');
  $('#canvas').innerHTML=`<svg class="ribbons" id="rib"></svg>${colHtml}${outHtml(d,sd)}`;
  $('#canvas').querySelectorAll('.item').forEach(b=>{b.onmouseenter=()=>hover(b.dataset.id);b.onmouseleave=()=>hover(null);b.onclick=()=>select(b.dataset.id)});
  $('#canvas').querySelectorAll('.hd').forEach(h=>h.onclick=()=>{S.step=+h.dataset.ci;sync()});
  $('#canvas').querySelectorAll('[data-comp]').forEach(b=>{b.onmouseenter=()=>hover(b.dataset.comp);b.onmouseleave=()=>hover(null);b.onclick=()=>select(b.dataset.comp)});
  bindWhatIf(); sync(); requestAnimationFrame(draw);
}
function outHtml(d,sd){ const o=M.out, pred=sd.predicted_label, ok=sd.label_correct;
  let cand='';
  if(o.probs&&o.probs.length){ const p=S.whatif?softmaxLikert(S.whatif):o.probs; const top=p.indexOf(Math.max(...p));
    cand=`<div class="cand">${LABELS.map((l,i)=>`<div class="${i===top?'top':''}" style="display:contents"><div class="lab">${i===top?'▶ ':''}<span class="badge ${vcls(l)}">${short(l)}</span><div class="pbar" style="flex:1"><span style="width:${(p[i]*100).toFixed(1)}%"></span></div></div><div class="pct">${(p[i]*100).toFixed(1)}%</div></div>`).join('')}</div>
    <div class="whatif"><div class="small"><b>假设</b>：拖动改 Likert 分数（不是系统输出）</div>${LABELS.map(l=>`<div class="row"><span>${short(l)}</span><input type="range" min="1" max="5" step="1" data-lab="${esc(l)}" value="${(S.whatif||o.likert)[l]}"><span class="mono">${(S.whatif||o.likert)[l]}</span></div>`).join('')}${S.whatif?`<div class="flag">⚠ 假设模式：top-1 变成 ${short(LABELS[top])}。<button class="linkbtn" id="resetWI">恢复真实分数</button></div>`:''}</div>`;
  } else {
    cand=`<div class="cand">${LABELS.map(l=>`<div class="${l===pred?'top':''}" style="display:contents"><div class="lab">${l===pred?'▶ ':''}<span class="badge ${vcls(l)}">${short(l)}</span></div><div class="pct">${l===pred?'选中':''}</div></div>`).join('')}</div><div class="small faint" style="margin-top:6px">${o.failed?'没有调用模型，所以没有候选。':'该系统不输出概率；判决来自判决调用文本的解析。'}</div>`;
  }
  const comps=!o.components.length&&!o.failed?`<div class="small" style="margin-top:10px;color:var(--warn)">没有任何问答进入判决：判决调用里只有 claim 本身。</div>`:o.components.length?`<h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:12px 0 6px">组成这个判决的组件（${o.components.length}）</h3><div class="comps">${o.components.map(c=>`<button class="comp" data-comp="${esc(c.id)}" title="${esc(c.l)}">${esc(c.l.split(' ')[0]==='Q'?c.l:(/^Q\d+/.test(c.l)?c.l.match(/^Q\d+/)[0]+(c.l.includes('块')?' · '+(c.l.match(/(\d+) 块/)||['',''])[1]+' 块':''):cut(c.l,18)))}</button>`).join('')}</div><div class="small faint" style="margin-top:4px">把鼠标放在组件上，可以看到它在左边流程里是从哪里来的。</div>`:'';
  return `<div class="out" data-ci="${M.cols.length}"><div class="col k-io" style="width:auto"><div class="hd" data-ci="${M.cols.length}"><div class="n"><span>输出 · top-1</span><span>${esc(o.calls||'')}</span></div><div class="t">最终判决</div></div></div>
    <div class="outcard" id="OUT"><div class="small muted">系统判决</div><div class="big"><span class="badge ${vcls(pred)}" style="font-size:18px;padding:4px 12px">${esc(pred||'无判决')}</span></div>
    <div class="small">gold：<span class="badge ${vcls(d.gold_label)}">${esc(d.gold_label)}</span> ${ok?'<span class="chip ok">判对 ✓</span>':`<span class="chip bad">${pred?'判错 ✗':'无判决，按错误计 ✗'}</span>`}</div>
    ${cand}${comps}
    ${o.reason?`<div style="margin-top:10px"><button class="linkbtn" id="showReason">查看${esc(o.reasonLabel)}</button></div>`:''}
    <div class="small faint" style="margin-top:8px">状态 ${esc(sd.status)} · 旧版 QA Hungarian-METEOR ${sd.legacy_scores?Number(sd.legacy_scores.qa_hu_meteor).toFixed(3):'—'}</div></div></div>`;
}
function softmaxLikert(lk){ const map=v=>({1:-2,2:-1,3:0,4:1,5:2})[parseInt(v,10)]??0; const x=LABELS.map(l=>map(lk[l])); const mx=Math.max(...x); const e=x.map(v=>Math.exp(v-mx)); const s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); }
function bindWhatIf(){
  $('#canvas').querySelectorAll('.whatif input').forEach(inp=>inp.oninput=()=>{ S.whatif={...(S.whatif||M.out.likert)}; S.whatif[inp.dataset.lab]=String(inp.value); const o=$('#canvas .out'); o.outerHTML=outHtml(DOC,DOC.systems[S.sys]); rebindOut(); requestAnimationFrame(draw); });
  const r=$('#resetWI'); if(r) r.onclick=()=>{S.whatif=null; const o=$('#canvas .out'); o.outerHTML=outHtml(DOC,DOC.systems[S.sys]); rebindOut(); requestAnimationFrame(draw);};
  const sr=$('#showReason'); if(sr) sr.onclick=()=>{ $('#detail').innerHTML=`<h2>${esc(M.out.reasonLabel)}</h2><p class="small faint">模型生成的原文，按纯文本显示。</p><div class="plain">${esc(M.out.reason)}</div>`; };
}
function rebindOut(){ $('#canvas .out').querySelectorAll('[data-comp]').forEach(b=>{b.onmouseenter=()=>hover(b.dataset.comp);b.onmouseleave=()=>hover(null);b.onclick=()=>select(b.dataset.comp)}); $('#canvas .out .hd').onclick=()=>{S.step=M.cols.length;sync()}; bindWhatIf(); }

// ribbons
function draw(){ const cv=$('#canvas'), svg=$('#rib'); if(!cv||!svg) return; const R=cv.getBoundingClientRect(); svg.setAttribute('width',cv.scrollWidth); svg.setAttribute('height',cv.scrollHeight);
  const colOf={}; M.cols.forEach((c,ci)=>c.items.forEach(it=>colOf[it.id]=ci)); colOf.OUT=M.cols.length; colOf.claim=0;
  const el=id=>id==='OUT'?$('#OUT'):cv.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  const kc=ci=>ci>=M.cols.length?'var(--k-io)':`var(--k-${M.cols[ci].kind})`;
  svg.innerHTML=M.links.map(([a,b])=>{const A=el(a),B=el(b); if(!A||!B) return ''; const ra=A.getBoundingClientRect(), rb=B.getBoundingClientRect();
    const x1=ra.right-R.left, y1=ra.top+ra.height/2-R.top, x2=rb.left-R.left, y2=b==='OUT'?Math.min(rb.top+60,rb.bottom)-R.top:rb.top+rb.height/2-R.top, dx=Math.max(20,(x2-x1)*.5);
    return `<path data-a="${esc(a)}" data-b="${esc(b)}" data-c="${colOf[b]}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${kc(colOf[b])}"/>`}).join('');
  applyStep(); if(S.hov) hover(S.hov); }
function chain(id){ const up=new Set([id]), down=new Set([id]); let ch=true; while(ch){ch=false; M.links.forEach(([a,b])=>{ if(up.has(b)&&!up.has(a)){up.add(a);ch=true;} if(down.has(a)&&!down.has(b)){down.add(b);ch=true;} });} return new Set([...up,...down]); }
function hover(id){ S.hov=id; const cv=$('#canvas'); const items=cv.querySelectorAll('.item'); const paths=cv.querySelectorAll('#rib path');
  if(!id){ items.forEach(i=>i.classList.remove('hl','dim')); cv.querySelectorAll('.comp').forEach(i=>i.classList.remove('hl','dim')); paths.forEach(p=>p.classList.remove('hl','dim')); return; }
  const c=chain(id); items.forEach(i=>{const on=c.has(i.dataset.id)||c.has(i.dataset.comp); i.classList.toggle('hl',on); i.classList.toggle('dim',!on);});
  cv.querySelectorAll('.comp').forEach(i=>{const on=c.has(i.dataset.comp); i.classList.toggle('hl',on); i.classList.toggle('dim',!on);});
  paths.forEach(p=>{const on=c.has(p.dataset.a)&&c.has(p.dataset.b); p.classList.toggle('hl',on); p.classList.toggle('dim',!on);}); }
function select(id){ const cv=$('#canvas'); cv.querySelectorAll('.item.sel').forEach(i=>i.classList.remove('sel')); const b=cv.querySelector(`.item[data-id="${CSS.escape(id)}"]`); if(b) b.classList.add('sel');
  let it=null; M.cols.forEach(c=>c.items.forEach(x=>{ if(x.id===id) it=x; })); if(it&&it.detail) $('#detail').innerHTML=it.detail(); }

// step scrubber
function applyStep(){ const cv=$('#canvas'); cv.querySelectorAll('.col[data-ci]').forEach(c=>{const ci=+c.dataset.ci; c.classList.toggle('future',ci>S.step); c.classList.toggle('current',ci===S.step);});
  const out=cv.querySelector('.out'); if(out){ out.style.opacity=S.step>=M.cols.length?1:.22; out.querySelector('.col').classList.toggle('current',S.step>=M.cols.length); }
  cv.querySelectorAll('#rib path').forEach(p=>p.classList.toggle('future',+p.dataset.c>S.step)); }
function sync(){ $('#step').value=S.step; const n=M.cols.length; const ex=S.step>=n?M.out.explain:M.cols[S.step].explain; const title=S.step>=n?'输出':M.cols[S.step].n;
  $('#steplabel').textContent=`${Math.min(S.step,n)+1} / ${n+1} · ${title}`;
  $('#explain').innerHTML=`<h2>${esc(ex.t)}</h2>${ex.p.filter(Boolean).map(p=>`<p>${p}</p>`).join('')}${ex.dev?`<div class="dev"><b>与原系统的差异：</b>${ex.dev}</div>`:''}`;
  applyStep(); const cur=$('#canvas').querySelector(`[data-ci="${S.step}"]`); if(cur&&S.scroll){ const w=$('#wrap'); w.scrollTo({left:Math.max(0,cur.offsetLeft-80),behavior:'smooth'}); } S.scroll=true;
  writeHash(); }
$('#step').oninput=e=>{S.step=+e.target.value;stopPlay();sync()};
function stopPlay(){ if(S.timer){clearInterval(S.timer);S.timer=null;$('#play').textContent='▶';} }
$('#play').onclick=()=>{ if(S.timer) return stopPlay(); if(S.step>=M.cols.length) S.step=0; $('#play').textContent='❚❚'; S.timer=setInterval(()=>{ if(S.step>=M.cols.length) return stopPlay(); S.step++; sync(); },1500); };

// routing and loading
function writeHash(){ history.replaceState(null,'',`#ex=${S.ex}&sys=${S.sys}&step=${S.step}`); }
function readHash(){ const p=new URLSearchParams(location.hash.slice(1)); return {ex:p.has('ex')?+p.get('ex'):null, sys:p.get('sys'), step:p.has('step')?+p.get('step'):null}; }
async function loadEx(i){ const r=await fetch(`data/traces/${i}.json`,{cache:'no-store'}); if(!r.ok) throw new Error('trace '+i+' HTTP '+r.status); DOC=await r.json(); S.ex=i; S.whatif=null; }
function sysBar(){ $('#sys').innerHTML=SYS.map(([k,n])=>{const sd=DOC.systems[k]; return `<button data-k="${k}" class="${k===S.sys?'on':''}">${n} <span class="badge ${vcls(sd.predicted_label)}" style="font-size:10.5px;padding:0 5px">${short(sd.predicted_label)}${sd.label_correct?' ✓':' ✗'}</span></button>`;}).join('');
  $('#sys').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.sys=b.dataset.k;S.step=0;S.whatif=null;stopPlay();sysBar();render();}); }
async function boot(){
  const r=await fetch('data/traces/index.json',{cache:'no-store'}); IDX=await r.json();
  $('#ex').innerHTML=IDX.examples.map(e=>`<option value="${e.original_index}">#${e.original_index} · ${esc(e.note||'')} · ${esc(cut(e.claim,70))}</option>`).join('');
  const h=readHash(); const first=IDX.examples.some(e=>e.original_index===h.ex)?h.ex:IDX.examples[0].original_index;
  if(h.sys&&BUILD[h.sys]) S.sys=h.sys; if(h.step!=null) S.step=h.step; S.scroll=false;
  await loadEx(first); $('#ex').value=String(first); sysBar(); render();
  $('#ex').onchange=async e=>{stopPlay(); await loadEx(+e.target.value); S.step=0; sysBar(); render();};
}
window.addEventListener('resize',()=>requestAnimationFrame(draw));
boot().catch(e=>{ $('#canvas').innerHTML=`<div class="panel" style="margin:20px">加载失败：${esc(e.message)}。本页需通过 HTTP 访问，并且 data/traces/ 必须存在。</div>`; console.error(e); });
})();
</script>
</body>
