<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Browser · Baseline 复现</title>
<meta name="description" content="以 claim 为中心浏览六个 adapted baseline 在实时 web 检索下产出的证据、问答与判决。">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ /* MCFC Bench tokens (shared with the site home) */
  --bg:#fafbfc; --card:#ffffff; --ink:#101828; --ink2:#475467; --ink3:#98a2b3; --line:#eaecf0; --accent:#e8590c; --info:#175cd3; --info-soft:#eff8ff;
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  /* aliases used by this page */
  --surface:var(--card); --surface2:#f2f4f7; --border:var(--line); --text:var(--ink); --muted:var(--ink2); --faint:var(--ink3);
  --accent-ink:#ffffff; --link:var(--info);
  --v-refuted:#d92d20; --v-supported:#079455; --v-nee:#667085; --v-conflict:#dc6803;
  --ref-gold:#b54708; --ref-silver:#475467;
  --ok:#079455; --noev:#175cd3; --fail:#d92d20; --pending:#98a2b3;
}
[data-theme="dark"]{
  --bg:#0c111d; --card:#161b26; --ink:#f5f5f6; --ink2:#94969c; --ink3:#61646c; --line:#1f242f; --accent:#ff692e; --info:#84adff; --info-soft:#0e1f3d;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --surface2:#1c2130; --accent-ink:#1a0f00;
  --v-refuted:#f97066; --v-supported:#47cd89; --v-nee:#94969c; --v-conflict:#fdb022;
  --ref-gold:#fec84b; --ref-silver:#98a2b3;
  --ok:#47cd89; --noev:#84adff; --fail:#f97066; --pending:#61646c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.6 "DM Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1,h2,.brand,.card .name,.empty .big{font-family:"Plus Jakarta Sans","DM Sans",sans-serif}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
button{font:inherit;cursor:pointer}

/* top bar: same shape as the MCFC Bench home nav */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:22px;height:64px;max-width:none;padding:0 40px}
.brand{font-weight:800;letter-spacing:-.02em;color:var(--ink);font-size:20px;white-space:nowrap}
.brand small{display:none}
.section-name{font-weight:600;color:var(--ink2);font-size:14.5px;white-space:nowrap;padding-left:22px;border-left:1px solid var(--line)}
.nav{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;font-weight:500;color:var(--ink2);font-size:14.5px}
.nav a{color:inherit;padding:4px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent)} .nav a:hover{color:var(--ink);text-decoration:none}
.theme{margin-left:4px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink2)}

/* freshness bar */
.fresh{background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.fresh .wrap{display:flex;gap:18px;flex-wrap:wrap;padding:7px 24px}
.fresh b{color:var(--text);font-weight:600}
.fresh .warn{color:var(--accent)}

main{padding:28px 0 60px}
h1{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
h2{font-size:20px;font-weight:700;margin:0 0 10px}
h3{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:22px 0 10px}
.pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--pending)}
.chip.ok i{background:var(--ok)} .chip.no_evidence i{background:var(--noev)} .chip.system_failed i{background:var(--fail)}
.chip.ok{color:var(--text)}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid transparent}
.v-Refuted{background:rgba(229,72,77,.15);color:var(--v-refuted);border-color:rgba(229,72,77,.4)}
.v-Supported{background:rgba(48,164,108,.15);color:var(--v-supported);border-color:rgba(48,164,108,.4)}
.v-NEE{background:rgba(139,141,152,.15);color:var(--v-nee);border-color:rgba(139,141,152,.4)}
.v-Conflicting{background:rgba(245,165,36,.15);color:var(--v-conflict);border-color:rgba(245,165,36,.4)}
.v-none{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.tag{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted);vertical-align:middle;margin-left:6px}
.tag.gen{color:var(--accent);border-color:rgba(242,140,40,.5)}
.tag.human{color:var(--ref-gold);border-color:rgba(212,176,74,.5)}
.tag.auto{color:var(--ref-silver);border-color:rgba(143,163,184,.5)}
.tag.quote{color:var(--v-supported);border-color:rgba(48,164,108,.5)}

.hero-banner{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px}
.hb-title{font-family:"Plus Jakarta Sans","DM Sans",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em}
.plain{white-space:pre-wrap;word-break:break-word}
details.more{margin-top:6px} details.more summary{cursor:pointer;color:var(--link);font-size:12.5px}
.qa.ph{opacity:.85;border-style:dashed}
.legacy{margin-top:12px;font-size:13px;padding:8px 12px;border:1px dashed var(--border);border-radius:8px}
.thsub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px}
.report .mdh{font-family:"Plus Jakarta Sans","DM Sans",sans-serif;margin:18px 0 8px;text-transform:none;letter-spacing:0;color:var(--ink)} .report h2.mdh{font-size:22px} .report h3.mdh{font-size:17px}
/* explore */
.howto{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.howto span{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--muted)}
.howto b{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;margin-right:6px}
.filters{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin:18px 0 22px;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;align-items:end}
.filters label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.filters input,.filters select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2)}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 14px;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px;display:flex;flex-direction:column;gap:10px;color:var(--text);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card .claim{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .body{display:flex;gap:12px}
.card .thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none;background:var(--surface2)}
.card .sys{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:22px 0 0}
.pager button{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 10px;font-size:13px;min-width:36px}
.pager button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .pager button:disabled{opacity:.4;cursor:default}
.empty{border:1px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}

/* detail */
.crumb{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:12px 0 4px}
.meta b{color:var(--text);font-weight:500}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.imgs a img{height:150px;max-width:260px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.imgs .cap{display:block;font-size:11px;color:var(--faint);margin-top:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:22px 0 6px}
.runinfo{font-size:12.5px;color:var(--muted)}
details.inl{display:inline-block;margin-left:8px} details.inl summary{display:inline;cursor:pointer;color:var(--link);font-size:12px} details.inl[open]{display:block;margin:6px 0 0;padding:8px 10px;background:var(--surface2);border-radius:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:10px 0 18px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font-size:14px;font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.panel + .panel{margin-top:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}
.qa{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--surface2)}
.qa .q{font-weight:600;margin-bottom:6px}
.qa .a{margin:6px 0;color:var(--text)}
.qa .lab{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.qa .src{font-size:12.5px;margin-top:6px;word-break:break-all}
.qa .miss{color:var(--v-refuted);font-size:12.5px}
.qa .evimg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qa .evimg a{display:block;max-width:180px;font-size:11px;word-break:break-all}
.qa .evimg img{max-height:110px;max-width:180px;border-radius:6px;border:1px solid var(--border);display:block;margin-bottom:3px}
.just{font-size:14px;line-height:1.7;color:var(--text)}
.just p{margin:0 0 8px} .just ol,.just ul{margin:0 0 8px 1.4em} .just li{margin:2px 0} .just strong{font-weight:600} .just code{font-family:"JetBrains Mono",monospace;font-size:12.5px;background:var(--surface2);padding:0 4px;border-radius:3px}
details.src{margin-top:8px}
details.src summary{cursor:pointer;color:var(--muted);font-size:13px}
details.src table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
details.src td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-all}
.notice{border-left:3px solid var(--accent);background:rgba(242,140,40,.07);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:var(--muted);margin:10px 0}
.notice.err{border-left-color:var(--v-refuted);background:rgba(229,72,77,.07)}
.ref{border:1px dashed var(--ref-gold);border-radius:12px;padding:18px 22px;margin-top:16px;background:rgba(212,176,74,.04)}
.ref.silver{border-color:var(--ref-silver);background:rgba(143,163,184,.05)}
.ref h2{font-size:15px}
.reftoggle{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}
.reftoggle button{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 12px;font-size:13px}
.reftoggle button.on{border-color:var(--ref-gold);color:var(--ref-gold)}
.reftoggle button.on.s{border-color:var(--ref-silver);color:var(--ref-silver)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tbl{overflow-x:auto;margin-top:12px} .tbl table{width:100%;border-collapse:collapse;font-size:13px} .tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--border)} .tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.cmp select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;width:100%}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
footer{border-top:1px solid var(--border);color:var(--faint);font-size:12px;padding:20px 0}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.cmp{grid-template-columns:1fr}}
@media (max-width:760px){.top .wrap{height:auto;padding:10px 16px;flex-wrap:wrap;gap:10px 16px}.nav{margin-left:0;width:100%;gap:14px}.section-name{padding-left:0;border-left:0}}
@media (max-width:640px){.wrap{padding:0 16px}.filters{grid-template-columns:1fr}h1{font-size:23px}.imgs a img{height:110px;max-width:100%}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../">MCFC Bench</a><a class="section-name" href="#/">Baseline Reproduce</a>
  <nav class="nav" id="nav">
    <a href="../">Home</a>
    <a href="#/" data-r="claims">Claims</a>
    <a href="#/compare" data-r="compare">Compare</a>
    <a href="#/results" data-r="results">Results</a>
    <a href="progress.html">Progress</a>
  </nav>
  <button class="theme" id="theme" title="切换明暗主题">🌙</button>
</div></header>
<div class="fresh"><div class="wrap" id="fresh">加载导出数据…</div></div>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">本站只读取冻结交付包的脱敏导出文件，不连接实验服务器；页面刷新不会拉取新数据。系统输出中的问题、回答与判决说明均为模型生成或拼接，按纯文本显示。</div></footer>

<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const safeUrl=(u)=>typeof u==='string'&&/^https?:\/\//i.test(u.trim());
  const link=(u)=>safeUrl(u)?`<a href="${esc(u.trim())}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:`<span class="mono">${esc(u)}</span>`;
  const DS={averitec:'AVeriTeC dev · 文本',averimatec:'AVerImaTeC val · 图文'};
  const STATUS_ZH={ok:'ok（有输出）',no_evidence:'无证据',retrieval_failed:'检索失败',system_failed:'系统失败',generation_failed:'生成失败',crashed:'崩溃',deferred:'正式运行暂缓',not_in_smoke:'小样未覆盖'};
  const ROLE_ZH={formal:'正式运行',smoke:'小样（前 5 条试运行）'};
  const ROLE_TIP={formal:'正式运行：四个文本系统各跑 AVeriTeC dev 原始 ID 0–99，结果来自冻结交付包；两个图文系统的正式运行暂缓。',smoke:'小样：每系统只跑前 5 条，用真实检索与模型调用证明系统能跑通；结果不进入评估，也不计入正式分母。'};
  const vclass=(v)=>!v?'v-none':v.startsWith('Refuted')?'v-Refuted':v.startsWith('Supported')?'v-Supported':v.startsWith('Not Enough')?'v-NEE':'v-Conflicting';
  const pct=(x)=>x==null?'—':(x*100).toFixed(0)+'%';
  const f3=(x)=>x==null?'—':Number(x).toFixed(3);
  function fmt(iso){ if(!iso) return '未核实'; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`; }
  const bucket=(st)=>st==='ok'?'ok':st==='no_evidence'?'no_evidence':(st==='deferred'||st==='not_in_smoke'||st==null)?'pending':'system_failed';

  // escape first, then render a small markdown subset; model text is never injected as HTML
  function md(text){
    const lines=esc(text).replace(/\r/g,'').split('\n'); let out='', list=null, table=null;
    const inline=(t)=>t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
    const close=()=>{ if(list){out+=`</${list}>`;list=null;} if(table){out+='</tbody></table></div>';table=null;} };
    for(const raw of lines){ const l=raw.trim(); let m;
      if(/^\|.*\|$/.test(l)){ const cells=l.slice(1,-1).split('|').map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;
        if(!table){ if(list){out+=`</${list}>`;list=null;} out+=`<div class="tbl"><table><thead><tr>${cells.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`; table=true; } else out+=`<tr>${cells.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`; }
      else if((m=l.match(/^(#{1,3})\s+(.*)$/))){ close(); out+=`<h${m[1].length+1} class="mdh">${inline(m[2])}</h${m[1].length+1}>`; }
      else if((m=l.match(/^(\d+)[.)]\s+(.*)$/))){ if(table){close();} if(list!=='ol'){close();out+='<ol>';list='ol';} out+=`<li value="${m[1]}">${inline(m[2])}</li>`; }
      else if((m=l.match(/^[-*•]\s+(.*)$/))){ if(table){close();} if(list!=='ul'){close();out+='<ul>';list='ul';} out+=`<li>${inline(m[1])}</li>`; }
      else if(l===''){ close(); }
      else if(list){ out+=`<li style="list-style:none;margin-left:-1.2em">${inline(l)}</li>`; }
      else { close(); out+=`<p>${inline(l)}</p>`; } }
    close(); return out;
  }
  function fold(text, limit=700){ const t=String(text||''); if(t.length<=limit) return `<span class="plain">${esc(t)}</span>`;
    return `<span class="plain">${esc(t.slice(0,limit))}…</span><details class="more"><summary>展开全文（${t.length} 字符）</summary><span class="plain">${esc(t)}</span></details>`; }

  // theme: same key and default rule as the MCFC Bench home page
  function setTheme(t){ document.documentElement.setAttribute('data-theme',t); $('#theme').textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('mcfc_theme',t);}catch(e){} }
  let t0='light'; try{ t0=localStorage.getItem('mcfc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }catch(e){}
  setTheme(t0); $('#theme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

  let IDX=null, DIDX=null, MET=null, META=null, STATUS=null; const DET={}, FDET={};
  const state={q:'',dataset:'all',sys:'all',status:'all',correct:'all',role:'formal',img:'all',page:1}; const PAGE=24;
  const getJSON=async(u)=>{ const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(u+' HTTP '+r.status); return r.json(); };
  async function boot(){
    [IDX,DIDX,MET,META]=await Promise.all([getJSON('data/claims/index.json'),getJSON('data/delivery/index.json'),getJSON('data/delivery/metrics.json'),getJSON('data/delivery/meta.json')]);
    DIDX.byIdx={}; DIDX.claims.forEach(c=>DIDX.byIdx[c.original_index]=c);
    $('#fresh').innerHTML=`<span title="正式文本结果来自冻结交付包 ${esc(META.package)}（独立校验 ${fmt(META.package_validated_utc)}）。本站不连接实验服务器，刷新页面不会更新数据。">正式文本结果：交付包 <b>${fmt(META.package_created_utc)}</b></span><span>schema <b class="mono">${esc(MET.schema_version)}</b></span>`;
  }
  const loadSmoke=async(key)=>DET[key]||(DET[key]=await getJSON('data/claims/'+key.replace(/\//g,'__')+'.json'));
  const loadFormal=async(idx)=>FDET[idx]||(FDET[idx]=await getJSON('data/delivery/claims/'+idx+'.json'));
  async function loadStatus(){ if(STATUS) return STATUS; try{ STATUS=await getJSON('data/status.json'); }catch(e){ STATUS=null; } return STATUS; }

  const TEXT_SYS=()=>MET.scope.active_systems;
  const MM_SYS=()=>Object.keys(IDX.systems).filter(s=>IDX.systems[s].modality==='multimodal');
  const sysFor=(ds)=>ds==='averitec'?TEXT_SYS():MM_SYS();
  const sysName=(sid)=>(IDX.systems[sid]||{}).name_en||sid;
  const smokeRun=(ds)=>IDX.runs.find(r=>r.dataset===ds&&r.role==='smoke'&&r.exists)||null;

  // status of (claim, role, system) — formal text comes only from the delivery package
  function cell(c, role, sid){
    if(role==='formal'){
      if(c.dataset==='averitec'){ const r=DIDX.byIdx[c.original_index]?.results?.[sid]; return r?{status:r.status,label:r.predicted_label,correct:r.label_correct}:{status:null}; }
      return {status:'deferred'};
    }
    const run=smokeRun(c.dataset); const st=run?c.outputs[run.run_id]?.[sid]:null; return {status:st||'not_in_smoke'};
  }

  // ---------------- Explore ----------------
  function readState(params){ for(const k of ['q','dataset','sys','status','correct','role','img']) if(params.has(k)) state[k]=params.get(k); state.page=Math.max(1,parseInt(params.get('page')||'1',10)||1); }
  function writeState(){ const p=new URLSearchParams(); for(const k of ['q','dataset','sys','status','correct','role','img']) if(state[k]&&state[k]!=='all'&&!(k==='role'&&state[k]==='formal')) p.set(k,state[k]); if(state.page>1) p.set('page',state.page); const qs=p.toString(); history.replaceState(null,'','#/'+(qs?'?'+qs:'')); }
  function banner(){ const s=META.status_totals, sc=MET.scope;
    return `<div class="hero-banner"><div class="hb-title">文本适配复现交付完成：${sc.active_systems.length}/4 系统，${sc.terminal_system_claims}/${sc.planned_system_claims} 最终记录</div>
      <div class="row" style="margin-top:8px"><span class="chip ok"><i></i>${s.ok} ok</span><span class="chip no_evidence"><i></i>${s.no_evidence} 无证据</span><span class="chip system_failed"><i></i>${s.retrieval_failed} 检索失败</span><span class="chip pending"><i></i>图文两系统正式运行：暂缓</span></div>
      <div class="small muted" style="margin-top:8px">三个概念不要混：<b>任务已结束</b>（每条都有终态记录）≠ <b>输出成功</b>（ok）≠ <b>判决正确</b>（与 gold 标签一致，见 <a href="#/results">评估结果</a>）。这是 adapted reproduction，不是官方榜单成绩；六系统总范围尚未完成。</div></div>`; }
  function explore(params){
    setNav('claims'); if(params) readState(params);
    const sysOpts=[...TEXT_SYS(),...MM_SYS()].map(s=>`<option value="${s}">${esc(sysName(s))}</option>`).join('');
    $('#view').innerHTML=`${banner()}
      <h1 style="margin-top:26px">浏览 Claims <span class="pill">${IDX.n_claims} 条冻结样本</span></h1>
      <div class="howto"><span><b>1</b> 找到一条 claim，点开</span><span><b>2</b> 切换系统，看它的问答、来源与判决</span><span><b>3</b> 点“并排比较”看两个系统</span><span><b>4</b> “Results”看指标，“Progress”看过程</span></div>
      <p class="muted small" style="margin-top:10px;max-width:860px">claim 与 gold 标签来自数据集；系统只产出问答、来源、判决与说明。卡片上每个芯片是一个系统在当前类别下的结果：预测标签，✓ / ✗ 表示是否与 gold 一致。</p>
      <div class="filters">
        <div><label>关键词 / ID</label><input id="f-q" placeholder="搜索 claim 原文或原始 ID…" value="${esc(state.q)}"></div>
        <div><label>数据集</label><select id="f-dataset"><option value="all">全部</option><option value="averitec">AVeriTeC dev（文本）</option><option value="averimatec">AVerImaTeC val（图文）</option></select></div>
        <div><label>系统</label><select id="f-sys"><option value="all">任一系统</option>${sysOpts}</select></div>
        <div><label>执行状态</label><select id="f-status"><option value="all">全部</option><option value="ok">ok（有输出）</option><option value="no_evidence">无证据</option><option value="system_failed">检索 / 系统失败</option><option value="pending">暂缓 / 未覆盖</option></select></div>
        <div><label>判决（对 gold）</label><select id="f-correct"><option value="all">全部</option><option value="yes">判决正确</option><option value="no">判决错误或无判决</option></select></div>
      </div>
      <div class="toolbar"><span class="seg"><button data-role="formal" class="${state.role==='formal'?'on':''}" title="${esc(ROLE_TIP.formal)}">${ROLE_ZH.formal}</button><button data-role="smoke" class="${state.role==='smoke'?'on':''}" title="${esc(ROLE_TIP.smoke)}">${ROLE_ZH.smoke}</button></span>
        <span id="role-note"></span><span id="count" style="margin-left:auto"></span></div>
      <div class="grid" id="grid"></div><div class="pager" id="pager"></div>`;
    for(const k of ['dataset','sys','status','correct']){ $('#f-'+k).value=state[k]; $('#f-'+k).onchange=e=>{state[k]=e.target.value;state.page=1;drawGrid();}; }
    $('#f-q').oninput=e=>{state.q=e.target.value;state.page=1;drawGrid();};
    document.querySelectorAll('.toolbar .seg button').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.page=1;document.querySelectorAll('.toolbar .seg button').forEach(x=>x.classList.toggle('on',x===b));drawGrid();});
    drawGrid();
  }
  function drawGrid(){
    const q=state.q.trim().toLowerCase();
    const rows=IDX.claims.filter(c=>{
      if(state.dataset!=='all'&&c.dataset!==state.dataset) return false;
      if(q&&!c.claim.toLowerCase().includes(q)&&!c.key.includes(q)&&String(c.original_index)!==q) return false;
      const sids=sysFor(c.dataset).filter(s=>state.sys==='all'||s===state.sys); if(!sids.length) return false;
      const cells=sids.map(s=>cell(c,state.role,s));
      if(state.status!=='all'&&!cells.some(x=>bucket(x.status)===state.status)) return false;
      if(state.correct!=='all'&&!cells.some(x=>x.correct!==undefined&&(state.correct==='yes'?x.correct===true:x.correct===false))) return false;
      return true; });
    $('#role-note').innerHTML=state.role==='formal'?'文本四系统：dev 0–99，来自冻结交付包 · 图文：正式运行暂缓':'历史小样：每系统前 5 条，不进入评估、不计入正式分母';
    const pages=Math.max(1,Math.ceil(rows.length/PAGE)); if(state.page>pages) state.page=pages; writeState();
    const slice=rows.slice((state.page-1)*PAGE,state.page*PAGE);
    $('#count').textContent=`匹配 ${rows.length} / ${IDX.n_claims} · 第 ${state.page} / ${pages} 页`;
    $('#pager').innerHTML=pages>1?`<button ${state.page<=1?'disabled':''} data-p="${state.page-1}">‹ 上一页</button>${Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" class="${i+1===state.page?'on':''}">${i+1}</button>`).join('')}<button ${state.page>=pages?'disabled':''} data-p="${state.page+1}">下一页 ›</button>`:'';
    $('#pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=parseInt(b.dataset.p,10);drawGrid();window.scrollTo(0,0);});
    $('#grid').innerHTML=slice.length?slice.map(c=>{
      const gold=c.dataset==='averitec'?DIDX.byIdx[c.original_index]?.gold_label:null;
      const chips=sysFor(c.dataset).map(s=>{const x=cell(c,state.role,s); const b=bucket(x.status);
        const txt=x.label?`${x.label.replace('Conflicting Evidence/Cherrypicking','Conflicting').replace('Not Enough Evidence','NEE')} ${x.correct?'✓':'✗'}${x.status==='no_evidence'?' · 无证据':''}`:(STATUS_ZH[x.status]||x.status||'无记录');
        return `<span class="chip ${b}" title="${esc(sysName(s))}: ${esc(STATUS_ZH[x.status]||x.status||'')}"><i></i>${esc(sysName(s))} · ${esc(txt)}</span>`;}).join('');
      const img=c.has_images?`<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(c.images[0].public_url)}" alt="claim image">`:'';
      return `<a class="card" href="#/claim/${c.key}${state.role==='smoke'?'?role=smoke':''}">
        <div class="head"><span>${esc(DS[c.dataset])}</span><span class="mono">#${c.original_index} · ${esc(c.claim_date||'日期缺失')}</span></div>
        <div class="body"><div class="claim">${esc(c.claim)}</div>${img}</div>
        ${gold?`<div class="small muted">gold 标签 <span class="badge ${vclass(gold)}" style="font-size:11.5px;padding:1px 8px">${esc(gold)}</span></div>`:''}
        <div class="sys">${chips}</div></a>`;
    }).join(''):`<div class="empty" style="grid-column:1/-1">没有匹配的样本</div>`;
  }

  // ---------------- Record normalisation ----------------
  function formalRec(fd, sid){ const r=fd.results[sid]; if(!r) return null;
    return {kind:'formal',status:r.status,verdict:r.predicted_label,correct:r.label_correct,gold:fd.gold_label,justification:r.justification,
      qa:r.qa_pairs.map(q=>({question:q.question,answer:q.answer,url:q.url,placeholder:!!q.placeholder,source_status:q.source_status,images:[],evidence_text:null})),
      sources:r.admitted_sources||[],legacy:r.legacy_scores,note:r.qa_source_note,error_category:r.error_category,sha:r.source_output_sha256}; }
  function smokeRec(sd, run, sid){ const r=run&&sd?.outputs?.[run.run_id]?.[sid]; if(!r) return null;
    return {kind:'smoke',status:r.status,verdict:r.verdict,correct:null,gold:null,justification:r.justification,
      qa:r.qa_pairs.map(q=>({question:q.question,answer:q.answer,url:q.url,placeholder:false,images:q.images||[],evidence_text:q.evidence_text})),
      sources:r.sources||[],legacy:null,note:null,error_category:r.error?'failed':null,error:r.error,stats:r.stats}; }

  function outputPanel(c, role, sid, rec){
    if(!rec){
      const why=role==='formal'?(c.dataset==='averimatec'?`${sysName(sid)} 的正式运行按用户指示暂缓：尚未运行，不等于失败，也不等于完成。历史小样在“小样”标签下单独查看。`:'交付包中没有这条记录。')
        :`小样只覆盖原始 ID 0–4；${sysName(sid)} 在小样中没有这条记录。`;
      return `<div class="panel"><div class="row"><span class="badge v-none">尚无本轮输出</span><span class="chip pending"><i></i>${esc(role==='formal'?(c.dataset==='averimatec'?'正式运行暂缓':'无记录'):'小样未覆盖')}</span></div><div class="muted" style="margin-top:10px">${esc(why)}</div></div>`;
    }
    const st=rec.status; const b=bucket(st);
    const verdictRow=`<div class="row">${rec.verdict?`<span class="badge ${vclass(rec.verdict)}">预测：${esc(rec.verdict)}</span>`:'<span class="badge v-none">无判决</span>'}
      ${rec.kind==='formal'?(rec.correct?'<span class="chip ok"><i></i>与 gold 一致 ✓</span>':`<span class="chip system_failed"><i></i>${rec.verdict?'与 gold 不一致 ✗':'无判决，按错误计 ✗'}</span>`):''}
      <span class="chip ${b}"><i></i>状态：${esc(STATUS_ZH[st]||st)}</span></div>`;
    const legacy=rec.legacy?`<div class="legacy">旧版 / legacy Hungarian-METEOR（逐条）：问题 <b>${f3(rec.legacy.question_hu_meteor)}</b> · 问答 <b>${f3(rec.legacy.qa_hu_meteor)}</b><span class="muted"> — 与 gold 问答的词汇相似度，不是置信度、真假概率或 EV2R。</span></div>`:'';
    if(b==='system_failed'){
      const why=rec.kind==='formal'?'检索失败：没有任何通过日期政策的可用候选片段，系统未产出问答和判决。':(rec.error?.reason||'系统在本条上失败。');
      return `<div class="panel">${verdictRow}<div class="notice err" style="margin-top:12px"><b>失败原因：</b>${esc(why)}</div>
        <div class="muted small">本条保留在 100 的固定分母里：标签按错误计、证据按零分计。失败未为改善成绩而挑选重跑。</div>${legacy}</div>`;
    }
    const noev=st==='no_evidence'?`<div class="notice">该系统跑完但没有产出任何最终问答证据；判决仍由系统给出，标签照常计分、QA 旧指标记零分。状态本身不能说明是搜索、日期过滤、问答环节还是事件本身缺证据所致。</div>`:'';
    const just=rec.justification?`<div class="just">${md(rec.justification)}</div>`:`<div class="muted">无（${esc(sysName(sid))} 不输出 reasoning / justification）。</div>`;
    const note=rec.note?`<div class="notice"><b>来源说明：</b>SANCTUARY 的问答会把多个来源的片段合并进一条回答，但只保留第一个来源链接；该链接不能当作覆盖整段回答的唯一来源。<span class="faint">（${esc(rec.note)}）</span></div>`:'';
    const qas=rec.qa.length?rec.qa.map((q,i)=>`<div class="qa${q.placeholder?' ph':''}">
        <div class="q"><span class="lab">Q${i+1}</span><span class="plain">${esc(q.question)}</span><span class="tag gen">模型生成问题</span></div>
        ${q.placeholder?`<div class="a muted"><span class="lab">A</span>该问题未找到证据<span class="faint small">（系统原文占位：${esc(q.answer)}）</span></div>`
          :`<div class="a"><span class="lab">A</span>${fold(q.answer||'（空）')}<span class="tag gen">模型生成 / 拼接</span></div>`}
        ${q.evidence_text?`<div class="a"><span class="lab">证据陈述</span>${fold(q.evidence_text)}<span class="tag gen">模型生成陈述</span></div>`:''}
        <div class="src">${q.url?`对应来源 ${link(q.url)}<span class="faint small"> · 未做蕴含验证</span>`:'<span class="miss">未提供对应来源</span>'}</div>
        ${q.images&&q.images.length?`<div class="evimg">${q.images.filter(safeUrl).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(u)}" alt="" onerror="this.style.display='none'">${esc(u)}</a>`).join('')}</div>`:''}
      </div>`).join(''):`<div class="muted">没有问答对。</div>`;
    const counts={}; rec.qa.forEach(q=>{ if(q.url) counts[q.url]=(counts[q.url]||0)+1; }); const uq=Object.keys(counts);
    const qaSrc=`<details class="src"><summary>最终问答来源：${uq.length} 个去重 URL，共出现 ${rec.qa.filter(q=>q.url).length} 次（${rec.qa.filter(q=>!q.url).length} 条问答未提供来源）</summary><table>${uq.map(u=>`<tr><td>${link(u)}</td><td class="mono">×${counts[u]}</td></tr>`).join('')||'<tr><td class="muted">无</td></tr>'}</table></details>`;
    const adm=`<details class="src"><summary>放行候选页面：${rec.sources.length} 条通过日期政策的候选（不等于被最终引用，也不表示支持判决）</summary>
      <div class="small muted" style="margin:6px 0">claim 日期 <b>${esc(c.claim_date||'缺失')}</b>。时间筛选是启发式的：按页面元数据的发布日期与修订标记过滤，不是历史快照，不能证明抓到的正文是 claim 当日版本。</div>
      <table>${rec.sources.map(s=>`<tr><td>${link(s.url)}</td><td class="mono">${esc(s.date||'—')}</td><td class="mono">${esc(s.date_class||'')}</td></tr>`).join('')}</table></details>`;
    const stats=rec.stats?`<div class="kv" style="margin-top:8px">${Object.entries(rec.stats).map(([k,v])=>`<span class="mono">${esc(k)}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b>`).join('')}</div>`:'';
    return `<div class="panel">${verdictRow}${noev}${legacy}
        <h3>Reasoning / 判决说明 <span class="tag gen">模型生成</span></h3>${just}
        <h3>问答（${rec.qa.length} 对）</h3>${note}${qas}
        <h3>来源</h3>${qaSrc}${adm}${stats}
        ${rec.sha?`<div class="faint small mono" style="margin-top:10px">源输出 SHA-256 ${esc(rec.sha.slice(0,16))}…</div>`:''}</div>`;
  }

  function header(c, gold){
    const imgs=c.images&&c.images.length?`<div class="imgs">${c.images.map(i=>`<a href="${esc(i.public_url)}" target="_blank" rel="noopener noreferrer"><img referrerpolicy="no-referrer" src="${esc(i.public_url)}" alt="claim image"><span class="cap">${esc(i.file)}</span></a>`).join('')}</div><div class="small faint">claim 输入图片，来自已公开的固定版本镜像。</div>`:'';
    return `<div class="crumb">Claim ${esc(c.key)}</div><h1>${esc(c.claim)}</h1>
      <div class="meta"><span>数据集 <b>${esc(DS[c.dataset])}</b></span><span>claim 日期 <b>${esc(c.claim_date||'缺失')}</b></span>${c.speaker?`<span>说话者 <b>${esc(c.speaker)}</b></span>`:''}${c.reporting_source?`<span>来源平台 <b>${esc(c.reporting_source)}</b></span>`:''}<span>原始 ID <b class="mono">${c.original_index}</b></span>
      ${gold?`<span>gold 标签 <span class="badge ${vclass(gold)}">${esc(gold)}</span></span>`:''}</div>${imgs}`;
  }
  function roleBar(role){ return `<div class="runbar"><span class="seg">${['formal','smoke'].map(r=>`<button data-role="${r}" class="${role===r?'on':''}" title="${esc(ROLE_TIP[r])}">${ROLE_ZH[r]}</button>`).join('')}</span><span class="runinfo">${role==='formal'?'冻结交付包 · 固定分母 100':'历史小样 · 不进入评估'}</span></div>`; }
  async function recordsFor(c, role){
    if(role==='formal'){ if(c.dataset!=='averitec') return {get:()=>null,gold:null}; const fd=await loadFormal(c.original_index); return {get:(sid)=>formalRec(fd,sid),gold:fd.gold_label}; }
    const run=smokeRun(c.dataset); const sd=c.has_detail?await loadSmoke(c.key):null; return {get:(sid)=>smokeRec(sd,run,sid),gold:null,smoke:sd}; }
  function refPanels(sd, show){
    if(!sd||!sd.reference||(!show.gold&&!show.silver)) return ''; let h='';
    if(show.gold){ const g=sd.reference.gold; h+=`<div class="ref"><h2>Gold 参照 <span class="tag human">人工标注 · 数据集自带</span></h2><div class="row" style="margin:8px 0"><span class="badge ${vclass(g.label)}">${esc(g.label)}</span></div>${g.justification?`<h3>Gold 判决说明</h3><div class="just">${md(g.justification)}</div>`:''}<h3>Gold 问答（${g.questions.length}）</h3>${g.questions.map((q,i)=>`<div class="qa"><div class="q"><span class="lab">Q${i+1}</span>${esc(q.question)}</div>${q.answers.map(a=>`<div class="a"><span class="lab">A</span>${fold(a.answer)}<span class="tag human">${esc(a.answer_type||'')}</span></div><div class="src">${a.source_url?`来源 ${link(a.source_url)}`:'<span class="miss">未提供对应来源</span>'}</div>`).join('')}</div>`).join('')}</div>`; }
    if(show.silver){ const s=sd.reference.silver; h+=`<div class="ref silver"><h2>Silver 参照 <span class="tag auto">自动生成 · 本项目 pipeline</span></h2><div class="small muted" style="margin:6px 0 10px">${esc(s.note||'')} 本轮没有用它给系统打分。</div>${s.available?s.statements.map((x,i)=>`<div class="qa"><div class="a"><span class="lab">S${i+1}</span>${fold(x.statement)}</div></div>`).join(''):'<div class="notice">此 ID 没有 silver 参照。</div>'}</div>`; }
    return h; }

  async function detail(key, params){
    setNav('claims'); const c=IDX.claims.find(x=>x.key===key); if(!c){ $('#view').innerHTML=`<div class="empty">未知 claim ${esc(key)}</div>`; return; }
    let role=params.get('role')==='smoke'?'smoke':'formal', sid=params.get('sys'); const show={gold:false,silver:false};
    async function draw(){
      const R=await recordsFor(c,role); const sids=sysFor(c.dataset); if(!sid||!sids.includes(sid)) sid=sids[0];
      history.replaceState(null,'',`#/claim/${key}?role=${role}&sys=${sid}`);
      const tabs=`<div class="small muted" style="margin-top:14px">选择一个系统，查看它对这条 claim 的输出：</div><div class="tabs">${sids.map(s=>{const x=cell(c,role,s); return `<button data-sys="${s}" class="${s===sid?'on':''}">${esc(sysName(s))}<span class="chip ${bucket(x.status)}"><i></i>${esc(x.label?(x.correct?'✓ ':'✗ ')+x.label.replace('Conflicting Evidence/Cherrypicking','Conflicting').replace('Not Enough Evidence','NEE'):(STATUS_ZH[x.status]||x.status||'无记录'))}</span></button>`;}).join('')}</div>`;
      const refs=role==='smoke'&&R.smoke&&R.smoke.reference?`<div class="reftoggle"><span class="small muted" style="align-self:center">参考层（仅小样样本导出；独立于系统输出）：</span><button data-ref="gold" class="${show.gold?'on':''}">Gold · 人工参照</button><button data-ref="silver" class="s ${show.silver?'on':''}">Silver · 自动参照</button></div>`+refPanels(R.smoke,show):'';
      $('#view').innerHTML=header(c,R.gold)+roleBar(role)+tabs+outputPanel(c,role,sid,R.get(sid))+refs+`<div class="row" style="margin:14px 0 0"><a class="btn ghost" href="#/compare/${key}?role=${role}&a=${sid}">↔ 与另一系统并排比较</a><a class="btn ghost" href="#/">← 返回列表</a></div>`;
      $('#view').querySelectorAll('.runbar .seg button').forEach(b=>b.onclick=()=>{role=b.dataset.role;draw();});
      $('#view').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{sid=b.dataset.sys;draw();});
      $('#view').querySelectorAll('.reftoggle button').forEach(b=>b.onclick=()=>{show[b.dataset.ref]=!show[b.dataset.ref];draw();});
    }
    await draw();
  }

  async function compare(key, params){
    setNav('compare');
    if(!key){ $('#view').innerHTML=`<h1>并排比较</h1><p class="muted" style="margin:6px 0 16px">选一条 claim，然后在两列里各选一个系统。100 条文本 claim 全部可比较，包括失败与无证据的样本。</p><div class="grid">${DIDX.claims.map(c=>`<a class="card" href="#/compare/${c.key}"><div class="head"><span>${esc(DS.averitec)}</span><span class="mono">#${c.original_index}</span></div><div class="claim">${esc(c.claim)}</div><div class="small muted">gold <span class="badge ${vclass(c.gold_label)}" style="font-size:11.5px;padding:1px 8px">${esc(c.gold_label)}</span></div></a>`).join('')}</div>`; return; }
    const c=IDX.claims.find(x=>x.key===key); if(!c){ $('#view').innerHTML=`<div class="empty">未知 claim ${esc(key)}</div>`; return; }
    let role=params.get('role')==='smoke'?'smoke':'formal'; const sids=sysFor(c.dataset);
    let a=sids.includes(params.get('a'))?params.get('a'):sids[0], b=sids.includes(params.get('b'))?params.get('b'):(sids.find(s=>s!==a)||sids[0]);
    async function draw(){
      const R=await recordsFor(c,role); history.replaceState(null,'',`#/compare/${key}?role=${role}&a=${a}&b=${b}`);
      const col=(sid,w)=>`<div><select data-which="${w}">${sids.map(s=>`<option value="${s}" ${s===sid?'selected':''}>${esc(sysName(s))}</option>`).join('')}</select><div style="height:10px"></div>${outputPanel(c,role,sid,R.get(sid))}</div>`;
      $('#view').innerHTML=header(c,R.gold)+roleBar(role)+`<div class="small muted" style="margin:12px 0 8px">同一数据集、同一原始 ID 的固定输出。没有输出的系统显示“尚无本轮输出”，不会用小样或历史输出代替。</div><div class="cmp">${col(a,'a')}${col(b,'b')}</div><div class="row" style="margin-top:14px"><a class="btn ghost" href="#/claim/${key}?role=${role}">← 回到详情</a></div>`;
      $('#view').querySelectorAll('.runbar .seg button').forEach(x=>x.onclick=()=>{role=x.dataset.role;draw();});
      $('#view').querySelectorAll('.cmp select').forEach(s=>s.onchange=()=>{ if(s.dataset.which==='a') a=s.value; else b=s.value; draw(); });
    }
    await draw();
  }

  // ---------------- Results ----------------
  async function results(){
    setNav('results'); const S=MET.systems, order=TEXT_SYS(); const th=Object.keys(S[order[0]].legacy_joint_by_threshold);
    const labels=Object.keys(MET.gold_label_counts); const b=MET.budget;
    const main=`<div class="tbl"><table><thead><tr><th>系统</th><th>终态（固定分母 100）</th><th>标签 accuracy<br><span class="thsub">全样本 /100</span></th><th>Macro-F1<br><span class="thsub">四类等权</span></th><th>QA Hungarian-METEOR<br><span class="thsub">旧版 / legacy</span></th><th>标签正确且 QA &gt; 0.25<br><span class="thsub">旧版 / legacy 联合分</span></th></tr></thead><tbody>
      ${order.map(s=>{const m=S[s]; const sc=m.status_counts; return `<tr><td><b>${esc(sysName(s))}</b></td><td>ok ${sc.ok||0}${sc.no_evidence?` · 无证据 ${sc.no_evidence}`:''}${sc.retrieval_failed?` · 检索失败 ${sc.retrieval_failed}`:''}</td><td><b>${pct(m.accuracy_full_sample)}</b> <span class="muted">(${m.n_correct}/100)</span></td><td>${f3(m.macro_f1)}</td><td>${f3(m.qa_hu_meteor)}</td><td>${pct(m.legacy_joint_by_threshold['0.25'])}</td></tr>`;}).join('')}</tbody></table></div>`;
    const thr=`<div class="tbl"><table><thead><tr><th>旧联合分（legacy）· 阈值 τ</th>${th.map(t=>`<th>QA &gt; ${t}</th>`).join('')}</tr></thead><tbody>${order.map(s=>`<tr><td>${esc(sysName(s))}</td>${th.map(t=>`<td>${pct(S[s].legacy_joint_by_threshold[t])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const valid=`<div class="tbl"><table><thead><tr><th>系统</th><th>全样本口径（分母 100）</th><th>仅有效判决口径（分母 = 有判决的条数）</th></tr></thead><tbody>${order.map(s=>{const m=S[s]; return `<tr><td>${esc(sysName(s))}</td><td>${m.n_correct}/100 = ${pct(m.accuracy_full_sample)}</td><td>${m.n_correct}/${m.n_valid_verdict} = ${(m.accuracy_valid_only*100).toFixed(1)}%</td></tr>`;}).join('')}</tbody></table></div>`;
    const cls=`<div class="tbl"><table><thead><tr><th>各类 F1</th>${labels.map(l=>`<th>${esc(l)}<br><span class="thsub">gold ${MET.gold_label_counts[l]} 条</span></th>`).join('')}</tr></thead><tbody>${order.map(s=>`<tr><td>${esc(sysName(s))}</td>${labels.map(l=>`<td>${f3(S[s].class_f1[l])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const cm=order.map(s=>{const m=S[s].confusion_matrix; const cols=[...labels,'SYSTEM_FAILED']; return `<details class="src"><summary>${esc(sysName(s))} 混淆矩阵（行 = gold，列 = 预测）</summary><div class="tbl"><table><thead><tr><th>gold ＼ 预测</th>${cols.map(x=>`<th>${esc(x==='SYSTEM_FAILED'?'系统失败（无判决）':x)}</th>`).join('')}</tr></thead><tbody>${labels.map(g=>`<tr><td>${esc(g)}</td>${cols.map(p=>`<td>${m[g][p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;}).join('');
    const src=`<div class="tbl"><table><thead><tr><th>系统</th><th>问答总数</th><th>未提供来源的问答</th><th>涉及 claim 数</th><th>解析回退判决</th><th>非 ok 的原始 ID</th></tr></thead><tbody>${order.map(s=>{const m=S[s]; return `<tr><td>${esc(sysName(s))}</td><td>${m.qa_count}</td><td>${m.qa_missing_source_url}</td><td>${m.claims_with_missing_qa_url}</td><td>${m.verdict_fallback_count}</td><td class="mono">${Object.entries(m.non_ok_ids||{}).map(([k,v])=>`${k}: ${v.join(', ')}`).join('；')||'—'}</td></tr>`;}).join('')}</tbody></table></div>`;
    $('#view').innerHTML=`<h1>评估结果</h1>
      <div class="notice" style="margin:14px 0">四个文本系统，固定 AVeriTeC dev 原始 ID 0–99，<b>所有指标的分母都是 100</b>，失败保留在分母里。恒猜 Refuted 的 accuracy 是 <b>${pct(MET.majority_label_accuracy)}</b>（gold：${labels.map(l=>`${l} ${MET.gold_label_counts[l]}`).join('，')}），四个系统都不高于它。这是 adapted reproduction 在固定切片上的结果，不是官方榜单成绩，未做显著性检验。</div>
      <div class="panel"><h2>四系统比较</h2>${main}
        <div class="small muted" style="margin-top:10px">证据列是<b>旧版 / legacy</b> AVeriTeC Hungarian-METEOR：最多取 10 组预测问答，与 gold 问答做词汇 / WordNet 匹配和最优配对。<b>它不核实链接、证据真假或网页历史版本</b>，不是 2025 EV2R，也没有用模型 judge。联合分要求判决正确且问答分<b>严格大于</b>阈值；0.25 只是报告的展示列，没有按结果挑阈值。</div>
        <div class="small muted" style="margin-top:6px">不同指标下领先的系统不同：标签 accuracy 上 SANCTUARY 与 InFact 并列，QA 匹配分 HerO2 最高，0.25 联合分 InFact 最高，Macro-F1 SANCTUARY 最高。本页不把它们合成一个“最佳模型”。</div>
        <h3>全部阈值</h3>${thr}
        <h3>全样本口径 vs 仅有效判决口径</h3>${valid}<div class="small muted" style="margin-top:6px">AIC CTU 的 4 条检索失败没有判决，所以它的有效口径分母是 96；表格与排名一律使用全样本口径，两者不混用。InFact 的无证据样本仍有判决，分母仍是 100。</div>
        <h3>各类 F1 与混淆矩阵</h3>${cls}${cm}
        <h3>问答来源与失败</h3>${src}<div class="small muted" style="margin-top:6px">未提供来源的问答包括 SANCTUARY 的 No Evidence. 占位与 AIC CTU 的“来源无法回答”；非空 URL 只核对过在放行来源列表中，没有做蕴含验证。</div></div>
      <div class="cmp" style="margin-top:16px">
        <div class="panel"><h2>EV2R / 付费 judge / silver–gold 排名</h2><div class="empty" style="margin-top:8px">本轮未执行。</div><div class="small muted" style="margin-top:10px">没有 EV2R precision / recall / F1，没有模型 judge 调用，也没有 silver 与 gold 参照下的排名一致性比较。上面的旧版 METEOR 分数不会填入这里，缺测也不记零分。</div></div>
        <div class="panel"><h2>图文系统（VILLAIN、AIC CTU AVerImaTeC）</h2><div class="empty" style="margin-top:8px">正式运行暂缓。</div><div class="small muted" style="margin-top:10px">按用户指示暂缓，未运行；不等于失败，也不等于完成。各五条历史小样可在 <a href="#/?dataset=averimatec&role=smoke">Claims · 小样</a> 下单独查看，不进入任何指标或分母。六系统总范围尚未完成。</div></div>
      </div>
      <div class="panel" style="margin-top:16px"><h2>报告与数据下载</h2><div class="row" style="margin-top:6px"><a class="btn" href="#/report">在线阅读 REPORT.md</a>${META.downloads.map(f=>`<a class="btn ghost" href="downloads/${esc(f)}" download>${esc(f)}</a>`).join('')}</div>
        <div class="small muted" style="margin-top:10px">results.csv 与上表同源（metrics.json，导出时逐项核对）。manifest.json 含载荷文件、四个冻结源输出、gold 与评分器的 SHA-256。不含实验缓存、请求消息、账本原件或私有上下文。</div></div>
      <div class="panel" style="margin-top:16px"><h2 style="font-size:16px">费用口径（次级信息）</h2><div class="small">累计预算占用 <b>$${b.all_history_conservative_usd} / $${b.global_cap_usd}</b>，余 <b>$${b.unallocated_usd}</b>，无活动预留（$${b.active_reservations_usd}）。</div><div class="small muted" style="margin-top:4px">全历史保守核算，含旧图文小样、失败与未知费用预留、搜索估价。不是服务商实付，也不是本次 400 条的净成本，不能据此给各系统做成本排名。</div></div>
      <p class="muted small" style="margin-top:14px">运行过程与时间线见 <a href="progress.html">Progress</a>。</p>`;
  }
  async function report(){ setNav('results'); const r=await fetch('downloads/REPORT.md?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('REPORT.md HTTP '+r.status); const t=await r.text();
    $('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><a class="btn ghost" href="#/results">← 评估结果</a><a class="btn ghost" href="downloads/REPORT.md" download>下载 REPORT.md</a></div><div class="panel just report">${md(t)}</div>`; }

  // ---------------- Router ----------------
  function setNav(r){ document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r)); }
  async function route(){
    const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const params=new URLSearchParams(qs||''); const parts=path.split('/').filter(Boolean);
    try{ if(!IDX) await boot();
      if(parts[0]==='claim'&&parts.length>=4) await detail(parts.slice(1,4).join('/'),params);
      else if(parts[0]==='compare') await compare(parts.length>=4?parts.slice(1,4).join('/'):null,params);
      else if(parts[0]==='results') await results();
      else if(parts[0]==='report') await report();
      else explore(params);
      window.scrollTo(0,0);
    }catch(e){ $('#view').innerHTML=`<div class="empty">加载失败：${esc(e.message)}。本页需通过 HTTP 访问，并且 data/ 下的导出文件必须存在。</div>`; console.error(e); }
  }
  window.addEventListener('hashchange',route); route();
})();
</script>
