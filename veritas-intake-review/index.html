 "d": "", "p": "external-verified"}, {"s": "An NFL source stated that no White House invitation had been extended to the Seahawks as of February 18, 2026.", "u": "https://www.seattletimes.com/seattle-news/politics/seahawks-havent-received-a-white-house-invitation/", "d": "", "p": "article"}, {"s": "The White House has not responded to inquiries regarding whether an invitation was extended to the Seahawks.", "u": "https://x.com/seattletimes/status/2024294595723477159", "d": "", "p": "external-verified"}, {"s": "Championship teams typically visit the White House a few months after winning, often in the spring or summer.", "u": "https://abcnews.com/Sports/white-house-visits-champions-us-tradition/story?id=37305752", "d": "", "p": "external-verified"}, {"s": "The Seahawks won Super Bowl LX on February 8, 2026, meaning a visit would still be in early planning stages if it were to occur.", "u": "", "d": "", "p": "metadata"}]}, {"id": 102648, "claim": "Various public figures, including Adam Sandler, introduced a bill to block George Soros from funding protests by classifying such funding as organized crime under the RICO Act.", "date": "2026-02-15", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-bill-block-soros-funding-protests-organized-crime-rico-act.html", "img": "102648.jpg", "orig": "", "ev": [{"s": "The claim that Adam Sandler introduced a bill to block George Soros from bankrolling protests is a viral narrative that lacks verified evidence.", "u": "https://www.theatlantic.com/magazine/archive/2024/04/us-anti-semitism-jewish-american-safety/677469/", "d": "", "p": "external-verified"}, {"s": "The viral claim has been spread through Facebook posts that are part of a network of foreign websites and pages, including some run by people in Vietnam.", "u": "https://restofworld.org/2023/force-47-vietnam-military-group-facebook/", "d": "", "p": "external-verified"}]}, {"id": 104860, "claim": "Ukraine tested nuclear weapons underground ahead of the 2026 Munich Security Conference.", "date": "2026-02-14", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.stopfake.org/en/fake-ukraine-tested-nuclear-weapons-ahead-of-munich-security-conference/", "img": "", "orig": "", "ev": [{"s": "Seismic activity in Ukraine during January–February 2026 consisted of 13 minor events in naturally active regions, with magnitudes between 1.0 and 3.5, consistent with routine geological activity.", "u": "https://gcsk.gov.ua/monitoring-ukraiini.html", "d": "", "p": "article"}, {"s": "The seismic events were recorded in known seismically active areas, such as the coastal zones of the Azov and Black Seas, Western Zakarpattia, and Poltava Oblast.", "u": "https://geomap.land.kiev.ua/tectonic.html", "d": "", "p": "article"}, {"s": "Reports of food poisoning in Bukovel are a recurring public health issue linked to water quality and sanitation challenges in mountain resort areas, rather than clandestine activity.", "u": "https://www.bbc.com/ukrainian/articles/cdxjp24xep2o", "d": "", "p": "article"}, {"s": "Ukraine is legally bound by international and national commitments to remain a non-nuclear state, including the Treaty on the Non-Proliferation of Nuclear Weapons.", "u": "https://www.un.org/ru/documents/decl_conv/conventions/npt.shtml", "d": "", "p": "article"}, {"s": "International Atomic Energy Agency (IAEA) experts have verified that Ukraine is not developing nuclear weapons.", "u": "https://www.iaea.org/newscenter/pressreleases/iaea-inspectors-complete-in-field-verification-activities-at-three-ukraine-locations-no-indications-of-undeclared-nuclear-activities-and-materials", "d": "", "p": "article"}]}, {"id": 110361, "claim": "Three British men were jailed for violent disorder and attacking police following Hadush Geberslasie Kebatu's conviction for sexual assault.", "date": "2026-02-11", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-claim-about-three-british-men-sentenced-to-longer-sentences-than-an-asulum-seeker-does-not-factually-represent-those-case.html", "img": "", "orig": "Three British men were jailed for violent disorder and attacking police following a migrant's conviction for sexual assault.", "ev": [{"s": "Three men, Stuart Williams (26), Dean Smith (51), and Martin Peagram (33), were jailed for a total of more than six years for violent disorder in Epping.", "u": "https://www.manchestereveningnews.co.uk/news/uk-news/two-double-murderers-among-uk-32761492", "d": "", "p": "external-verified"}, {"s": "The three men were charged with and admitted to violent disorder, which occurred while they were clashing with police during a protest.", "u": "https://acleddata.com/report/demonstrations-and-political-violence-america-new-data-summer-2020", "d": "", "p": "external-verified"}, {"s": "Hadush Geberslasie Kebatu was found guilty of sexual assault involving a 14-year-old female, not rape.", "u": "https://www.cps.gov.uk/east-england/news/man-who-sexually-assaulted-teenage-girl-epping-convicted", "d": "", "p": "external-verified"}, {"s": "The sexual assault committed by Hadush Geberslasie Kebatu involved inappropriate remarks, attempting to kiss a minor, and touching her thigh.", "u": "https://www.judiciary.uk/wp-content/uploads/2025/09/R-v-Hadush-Kebatu-1.pdf", "d": "", "p": "article"}, {"s": "Hadush Geberslasie Kebatu was jailed for his sexual assault and subsequently deported to Ethiopia.", "u": "https://www.bbc.co.uk/news/articles/clyj5lk7p9zo", "d": "", "p": "external-verified"}]}, {"id": 102679, "claim": "Airspace around El Paso, Texas, and Santa Teresa, New Mexico, was shut down for 10 days, and airspace around New Orleans was shut down for 5 days due to national security.", "date": "2026-02-11", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-new-orleans-flight-restrictions-not-associated-with-el-paso-airspace-closure.html", "img": "", "orig": "", "ev": [{"s": "The airspace closure in El Paso, Texas, and Santa Teresa, New Mexico, was lifted within hours, not for 10 days.", "u": "https://www.kob.com/new-mexico/southeast-new-mexico/faa-imposes-then-lifts-10-day-restriction-on-airspace-around-el-paso/", "d": "", "p": "external-verified"}, {"s": "The Temporary Flight Restriction (TFR) in New Orleans was issued for Mardi Gras festivities and was not related to the El Paso airspace closure.", "u": "https://nbaa.org/aircraft-operations/airspace/alerts/notams-and-tfrs/temporary-flight-restrictions/", "d": "2017-03-31", "p": "external-verified"}, {"s": "The New Orleans flight restrictions were specifically for Unmanned Aircraft Systems (drones) during Mardi Gras.", "u": "https://www.facebook.com/LouisianaStatePolice/posts/louisiana-state-police-would-like-to-remind-everyone-that-the-federal-aviation-a/1197723005881969/", "d": "", "p": "article"}, {"s": "The New Orleans TFR was scheduled for specific times between February 13 and February 18, 2026.", "u": "https://tfr.faa.gov/tfr3/?page=detail_6_2231", "d": "", "p": "article"}, {"s": "An initial report suggested El Paso flights were halted for 10 days for security reasons, but the FAA later reopened the airport hours after the announcement.", "u": "https://www.nbcnews.com/news/us-news/flights-el-paso-airport-texas-halted-10-days-security-reasons-faa-rcna258497", "d": "", "p": "article"}, {"s": "The FAA officially stated that the temporary closure of airspace over El Paso was lifted and there was no threat to commercial aviation.", "u": "https://x.com/FAANews/status/2021583720465969421", "d": "", "p": "article"}]}, {"id": 102411, "claim": "Gefilterd water of bronwater uit glazen flessen is gezonder dan ongefilterd Nederlands kraanwater.", "date": "2026-02-13", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://dpa-factchecking.com/netherlands/260303-99-710142", "img": "", "orig": "", "ev": [{"s": "Dutch tap water is of high quality, clean, and safe to drink.", "u": "https://mooiwater.nl/dutch-tap-water-3/", "d": "", "p": "external-verified"}, {"s": "Tap water in the Netherlands meets the European Drinking Water Directive and is continuously tested for hundreds of substances, including heavy metals, pesticides, bacteria, and PFAS.", "u": "https://www.rivm.nl/drinkwater/drinkwater-en-regelgeving", "d": "", "p": "article"}, {"s": "Concentrations of PFAS in Dutch tap water remain below legal health standards and the water is safe for daily consumption.", "u": "https://www.rijksoverheid.nl/onderwerpen/pfas/vraag-en-antwoord/zitten-er-pfas-in-het-drinkwater", "d": "", "p": "article"}, {"s": "Water filters do not provide a health benefit regarding substances like chlorine or fluoride in the Netherlands, as these are not added to the drinking water.", "u": "https://www.drinkwaterplatform.nl/hoe-gezond-en-veilig-is-drinkwater-uit-de-kraan/#:~:text=Zit%20er%20chloor%2C%20fluoride%20of,bevat%2C%E2%80%9D%20voegt%20Hofman%20toe.", "d": "", "p": "article"}, {"s": "Water filters can become a breeding ground for bacteria, potentially making the water unsafe.", "u": "https://www.drinkwaterplatform.nl/waterfilters-de-zin-en-onzin/#:~:text=Nadelen:%20bacteriegroei%2C%20ophoping%20en%20milieuschade,belandt%20vervolgens%20in%20het%20riool.%E2%80%9D", "d": "", "p": "article"}, {"s": "The quality of tap water in the Netherlands is monitored more strictly on more parameters than bottled water.", "u": "https://www.nrc.nl/nieuws/2026/01/28/kraanwater-is-slecht-zeggen-influencers-waterbedrijven-beginnen-tegencampagne-a4918486", "d": "", "p": "article"}, {"s": "Bottled water can contain more microplastics than tap water, including water from glass bottles.", "u": "https://gezondnu.nl/gezondheid/duurzaamheid/schokkend-onderzoek-glazen-flessen-bevatten-vaak-meer-microplastics-dan-plastic-flessen", "d": "", "p": "article"}]}, {"id": 105095, "claim": "White House Press Secretary Karoline Leavitt stated that Donald Trump will revoke the passport of any Olympic athlete who has criticized him.", "date": "2026-02-10", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://digiteye.in/did-karoline-leavitt-say-trump-would-revoke-olympic-athletes-passports-for-criticizing-him-fact-check/", "img": "", "orig": "", "ev": [{"s": "White House Press Secretary Karoline Leavitt did not make the statement that Donald Trump would revoke the passports of Olympic athletes who criticize him.", "u": "https://www.them.us/story/donald-trump-administration-executive-order-trans-girls-womens-sports", "d": "", "p": "external-verified"}, {"s": "The claim originated from social media posts, including one by X user 'dotNoso' attributing the quote to Leavitt.", "u": "https://x.com/TheFungi669/status/2020984157661429833?s=20", "d": "", "p": "article"}, {"s": "While President Trump responded to athlete Hunter Hess's comments on Truth Social, he did not mention revoking passports.", "u": "https://truthsocial.com/@realDonaldTrump/116035760619414211", "d": "", "p": "article"}, {"s": "The U.S. President does not have the authority to revoke citizenship or passports based on political differences.", "u": "https://www.poynter.org/fact-checking/2025/us-government-revoke-your-citizenship-what-to-know-about-denaturalization/", "d": "", "p": "article"}]}, {"id": 102690, "claim": "The Indian government has nationwide schemes offering free scooters to women and free electric bicycles to students.", "date": "2026-02-10", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://www.thequint.com/news/webqoof/government-is-not-offering-free-scooters-electric-cycles-to-women-students-fact-check", "img": "", "orig": "", "ev": [{"s": "There are no nationwide government schemes offering electric cycles or scooters to women or students.", "u": "https://metroev.pk/prime-ministers-e-bike-scheme-2025/", "d": "", "p": "external-verified"}, {"s": "The 'Rani Laxmi Bai Scooty Yojana' is a scheme specific to Uttar Pradesh, not a nationwide scheme.", "u": "https://timesofindia.indiatimes.com/city/lucknow/rani-laxmi-bai-scooty-yojana-for-meritorious-girls-introduced/articleshow/118430045.cms", "d": "", "p": "article"}, {"s": "The domain ''sarkarikbs.in' was registered in Bihar at least four months after the scheme was first announced.", "u": "https://testbook.com/kvs", "d": "", "p": "external-verified"}, {"s": "The video claiming to offer free scooters to women was identified as AI-generated with 75.8 percent certainty.", "u": "https://www.nbcnews.com/news/us-news/electric-scooter-scam-lightning-shared-scooter-co-investors-rcna226832", "d": "", "p": "external-verified"}, {"s": "The video claiming to offer free electric cycles to students was identified as AI-generated with 89.7 percent certainty.", "u": "https://mededu.jmir.org/2025/1/e80084/", "d": "", "p": "external-verified"}, {"s": "While some states like Gujarat, Madhya Pradesh, Maharashtra, and Karnataka have offered free bicycles to students in the past, these were state-level schemes that ran between 2008 and 2019.", "u": "https://m.thewire.in/article/education/free-bicycles-help-wheel-students-to-school-but-what-about-freedom-of-action-and-thought", "d": "", "p": "external-verified"}]}, {"id": 103497, "claim": "The Bukit Mertajam Hospital in Malaysia will be relocated to avoid disturbing a temple.", "date": "2026-03-30", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://factcheck.afp.com/doc.afp.com.A4VV49E", "img": "", "orig": "", "ev": [{"s": "The Bukit Mertajam Hospital is not being relocated; instead, there are plans for a new building at the existing site to accommodate increasing patients.", "u": "https://www.thestar.com.my/news/true-or-not/2026/03/23/quickcheck-is-it-true-the-bukit-mertajam-hospital-will-be-relocated", "d": "", "p": "external-verified"}, {"s": "The Bukit Mertajam Hospital's visitor's board denied the claims that the hospital would be relocated to avoid disturbing a temple.", "u": "https://www.freemalaysiatoday.com/category/nation/2026/03/23/hospital-board-denies-claim-bm-hospital-to-be-relocated-over-temple-issue", "d": "", "p": "article"}, {"s": "A Facebook post falsely claimed that Minister Steven Sim Chee Keong stated the hospital would be relocated to avoid disturbing a temple.", "u": "https://perma.cc/4HDK-GE8H", "d": "", "p": "article"}, {"s": "The minister's special officer, Lim Zheng Han, filed a police report against the social media user who made the false claims.", "u": "https://www.thestar.com.my/news/nation/2026/03/24/steven-sim039s-special-officer-lodges-police-report-over-hospital-bm-relocation-claim", "d": "", "p": "article"}, {"s": "The image used in the false post was actually from a visit by Sim to the hospital in September 2025 to inaugurate new facilities.", "u": "https://www.bernama.com/en/news.php?id=2467425", "d": "", "p": "article"}]}, {"id": 103544, "claim": "425,000 Israelis fled to Thailand to escape the war in the Middle East.", "date": "2026-03-30", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://factcheck.afp.com/doc.afp.com.A4VR9T3", "img": "103544.jpg", "orig": "425,000 Israelis fled to Thailand to escape the war.", "ev": [{"s": "A Thai immigration official stated that there has been no mass arrival of hundreds of thousands of Israelis in Thailand.", "u": "https://www.mnhs.org/hmong/hmong-timeline", "d": "", "p": "external-verified"}, {"s": "The figure of 425,000 is approximately the number of Israeli visitors to Thailand in the year 2025.", "u": "https://www.nationthailand.com/blogs/news/general/40063758", "d": "", "p": "external-verified"}, {"s": "As of the end of March 2026, officials estimate that approximately 30,000 Israeli nationals were in Thailand.", "u": "https://x.com/ThaiEnquirer/status/2031970988683116661", "d": "", "p": "external-verified"}, {"s": "Israel's ambassador to Thailand, Alona Fisher-Kamm, stated in a March 10 interview that around 425,000 Israelis visited Thailand in 2025.", "u": "https://www.khaosodenglish.com/news/2026/03/10/thais-should-be-upset-with-iran-for-oil-price-hike-says-israeli-envoy/", "d": "", "p": "article"}, {"s": "Between January 1 and March 11, officials recorded 84,238 arrivals and 80,171 departures from Israel, indicating no unusual accumulation of visitors.", "u": "https://www.dhs.gov/sites/default/files/2024-10/24_1011_CBP-Entry-Exit-Overstay-Report-FY23-Data.pdf", "d": "", "p": "external-verified"}]}, {"id": 103726, "claim": "Consuming a morning shot of turmeric mixed with ghee detoxifies the body, improves liver function, and cleanses the gut.", "date": "2026-03-23", "mod": "image-text", "pred": "Conflicting Evidence/Cherrypicking", "gold": "false (certain)", "art": "https://www.thip.media/health-news-fact-check/fact-check-can-turmeric-ghee-detox-shots-really-cleanse-your-body/141135/", "img": "103726.jpg", "orig": "", "ev": [{"s": "The human body has a highly efficient natural detoxification system involving the liver, kidneys, lungs, and skin.", "u": "https://www.ncbi.nlm.nih.gov/books/NBK279393/", "d": "", "p": "article"}, {"s": "There is no clinical evidence that turmeric-ghee shots can enhance or speed up the body's natural detoxification process.", "u": "https://timesofindia.indiatimes.com/life-style/food-news/what-happens-when-you-add-ghee-and-turmeric-to-water/articleshow/120123827.cms", "d": "", "p": "external-verified"}, {"s": "Turmeric contains curcumin, which has anti-inflammatory and antioxidant properties and may support liver health, but it is not a detox shortcut.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9881416/", "d": "", "p": "article"}, {"s": "Combining turmeric with ghee improves the absorption of curcumin because curcumin is fat-soluble, but this does not equate to detoxification.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7144558/", "d": "", "p": "article"}, {"s": "Consuming concentrated daily shots of turmeric and ghee may lead to unwanted effects like stomach upset, acid reflux, or increased calorie intake.", "u": "https://www.healthline.com/nutrition/turmeric-side-effects", "d": "", "p": "external-verified"}]}, {"id": 105469, "claim": "The official registration portal for the Sri Lankan National Fuel Pass QR code is fuelpass.gov.lk.", "date": "2026-03-19", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://factcheck.afp.com/doc.afp.com.A3LF3NQ", "img": "", "orig": "", "ev": [{"s": "The Ministry of Energy provided the correct website URL when announcing the reintroduction of the fuel pass scheme.", "u": "https://srilanka.factcrescendo.com/english/fraudulent-site-falsely-claiming-to-be-the-official-platform-for-obtaining-fuel-permits/", "d": "", "p": "external-verified"}, {"s": "Fake registration websites for the fuel pass do not use the official 'gov.lk' domain.", "u": "https://x.com/factcrescendosl/status/2033457666467811669", "d": "", "p": "external-verified"}, {"s": "The Ceylon Petroleum Corporation has identified certain shared links for the National Fuel Pass as fake.", "u": "https://srilanka.factcrescendo.com/english/fraudulent-site-falsely-claiming-to-be-the-official-platform-for-obtaining-fuel-permits/", "d": "", "p": "external-verified"}]}, {"id": 101924, "claim": "The renovation of the Colombo Central Bus Station deviated from its original design and consisted only of repainting the existing building.", "date": "2026-03-26", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://srilanka.factcrescendo.com/2026/03/27/viral-images-falsely-claim-colombo-central-bus-station-renovation-deviated-from-original-design/", "img": "", "orig": "", "ev": [{"s": "The images circulating on social media that supposedly show the 'original design' versus the 'actual renovation' are actually AI-generated/edited images.", "u": "https://www.bbc.com/news/articles/c9wx2dz2v44o", "d": "", "p": "external-verified"}, {"s": "The actual renovation project for the Colombo Central Bus Station began on September 15, 2025, under the leadership of President Anura Kumara Dissanayake.", "u": "https://sinhala.news.lk/current-affairs/2025-09-15-10-28-55", "d": "", "p": "article"}, {"s": "The renovation project has a budget of 425 million rupees and involves multiple agencies including the Sri Lanka Air Force, Colombo Municipal Council, CEB, Water Board, RDA, and UDA.", "u": "https://globalceomag.com/sri-lanka-unveils-major-transport-upgrades/", "d": "", "p": "external-verified"}, {"s": "As of the report, approximately 90% of the renovation work has been completed according to the original plan.", "u": "https://www.southalabama.edu/colleges/mcob/news/home-renovation-statistics.html", "d": "", "p": "external-verified"}]}, {"id": 110187, "claim": "The image shows UK Prime Minister Keir Starmer, who said capping energy bills will save the average household £117.", "date": "2026-03-17", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://fullfact.org/economy/bbc-energy-bills-correction/", "img": "110187.jpg", "orig": "", "ev": [{"s": "Keir Starmer stated that energy bills have been capped until the end of June, saving the average household £117.", "u": "https://www.youtube.com/live/Cfpn7FCOmHY?si=6mmr_eCVg-oyw_I8&t=1602", "d": "", "p": "article"}, {"s": "The energy price cap is set to fall in April by £117 a year for a typical household with a dual-fuel bill paying by direct debit.", "u": "https://www.ofgem.gov.uk/information-consumers/energy-advice-households/energy-price-cap-explained", "d": "", "p": "article"}, {"s": "A BBC live blog post incorrectly reported that the Prime Minister said energy bills would be capped to the end of June, saving the average household £170.", "u": "https://www.bbc.co.uk/news/live/cx2lr40g17kt?post=asset%3A254fb1bf-ffeb-464c-8a67-b07687ef114b#post", "d": "", "p": "article"}]}, {"id": 105914, "claim": "The photo shows a destroyed Halliburton warehouse in Basra, Iraq.", "date": "2026-03-13", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://www.vishvasnews.com/english/world/fact-check-viral-photo-of-iraqi-warehouse-attack-misidentified-as-iranian-water-treatment-plant/", "img": "105914.jpg", "orig": "", "ev": [{"s": "The viral image shows the aftermath of a drone attack on an American company's warehouse in Basra, Iraq.", "u": "https://www.iraqoilreport.com/news/oil-companies-evacuate-as-burjisiya-drone-attack-highlights-rising-threat-47591/", "d": "", "p": "external-verified"}, {"s": "Al Jazeera published a video showing the devastation caused by a drone strike in Basra, Iraq, on March 6.", "u": "https://www.aljazeera.com/video/newsfeed/2026/3/6/drone-evades-defences-ignites-fire-at-southern-iraq-oil-facility#flips-6390513591112:0", "d": "", "p": "article"}]}, {"id": 103652, "claim": "The URL shared on social media is the official registration portal for the Sri Lankan National Fuel Pass QR code.", "date": "2026-03-19", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://factcheck.afp.com/doc.afp.com.A3LF3NQ", "img": "", "orig": "The linked website is the official registration portal for the Sri Lankan National Fuel Pass QR code.", "ev": [{"s": "The link shared in social media posts urging users to sign up for the National Fuel Pass is not the government's official registration website.", "u": "https://srilanka.factcrescendo.com/english/fraudulent-site-falsely-claiming-to-be-the-official-platform-for-obtaining-fuel-permits/", "d": "", "p": "external-verified"}, {"s": "The imposter website lacks the official 'gov.lk' domain and differs in visual style from the official site, which features the national emblem.", "u": "https://www.digicert.com/blog/how-to-identify-fake-websites", "d": "", "p": "external-verified"}, {"s": "Information technology officials warned that the imposter site is used by scammers to steal personal information, such as vehicle chassis numbers.", "u": "https://www.in.gov/bmv/resources/consumer-scam-alerts", "d": "", "p": "external-verified"}, {"s": "The Sri Lanka Computer Emergency Readiness Team (CERT) has taken down five fake websites related to this scheme.", "u": "https://adaderana.lk/news/119680", "d": "", "p": "external-verified"}]}, {"id": 104590, "claim": "The U.S. Department of Defense spent $93 billion in a single month under Defense Secretary Pete Hegseth.", "date": "2026-03-11", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "true (rather certain)", "art": "https://www.snopes.com/fact-check/defense-93-billion-september-2026/", "img": "", "orig": "", "ev": [{"s": "In September 2025, the Department of Defense spent $93.49 billion.", "u": "https://www.usaspending.gov/search?hash=b8050b43c4800aaa1b89b615c56fd633", "d": "", "p": "article"}, {"s": "The $93.4 billion spending in September 2025 was reported by the organization Open the Books.", "u": "https://openthebooks.substack.com/p/pentagon-should-focus-on-defense", "d": "", "p": "article"}, {"s": "The Department of Defense spent $50.1 billion on grants and contracts in the last five working days of September alone.", "u": "https://openthebooks.substack.com/p/pentagon-should-focus-on-defense", "d": "", "p": "article"}, {"s": "The high spending at the end of the fiscal year is attributed to 'use-it-or-lose-it' government budget rules.", "u": "https://www.nber.org/digest/mar14/use-it-or-lose-it-budget-rules", "d": "", "p": "article"}]}, {"id": 104031, "claim": "The TV show \"SpongeBob SquarePants\" was created to entertain children trafficked by Jeffrey Epstein.", "date": "2026-03-05", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.snopes.com/fact-check/spongebob-created-epstein-victims/", "img": "104031.jpg", "orig": "", "ev": [{"s": "Conspiracy theorists claim the show is linked to Epstein because SpongeBob's driver's license address is a valid address on Little St. James Island, which Epstein owned.", "u": "https://www.snopes.com/fact-check/spongebob-epstein-island-address/", "d": "", "p": "article"}, {"s": "Conspiracy theorists claim the Nickelodeon logo has the same shape as Little St. James Island.", "u": "https://www.snopes.com/fact-check/nickelodeon-logo-epstein-island/", "d": "", "p": "article"}, {"s": "A search of the released Epstein government files for 'SpongeBob' yielded only seven references, none of which linked the show to Epstein's crimes; one was an advertisement for a screensaver.", "u": "https://www.yahoo.com/lifestyle/nickelodeon-jeffrey-epstein-conspiracy-theory-163511305.html", "d": "", "p": "external-verified"}, {"s": "There are no references to the creator of SpongeBob, Stephen Hillenburg, in the Epstein files.", "u": "https://forward.com/culture/film-tv/414892/the-secret-jewish-history-of-spongebob-squarepants/", "d": "", "p": "external-verified"}]}, {"id": 110181, "claim": "The $93 billion Defense Department single-month expenditure in September 2025 was driven by standard end-of-fiscal-year budget rules.", "date": "2026-03-11", "mod": "text-only", "pred": "Supported", "gold": "true (rather certain)", "art": "https://www.snopes.com/fact-check/defense-93-billion-september-2026/", "img": "", "orig": "The $93 billion Defense Department single-month expenditure was driven by standard end-of-fiscal-year budget rules.", "ev": [{"s": "The Department of Defense spent $93.49 billion in September 2025.", "u": "https://www.usaspending.gov/search?hash=b8050b43c4800aaa1b89b615c56fd633", "d": "", "p": "article"}, {"s": "September 2025 was the last month of the U.S. government's fiscal year.", "u": "https://www.accounting.uci.edu/support/fiscal-officers/general-ledger/fiscal-period.php", "d": "", "p": "external-verified"}, {"s": "The high spending in September was attributed to 'use-it-or-lose-it' government budget rules.", "u": "https://www.nber.org/digest/mar14/use-it-or-lose-it-budget-rules", "d": "", "p": "article"}, {"s": "The DOD spent $50.1 billion in just the last five working days of September 2025.", "u": "https://openthebooks.substack.com/p/pentagon-should-focus-on-defense", "d": "", "p": "article"}]}, {"id": 102466, "claim": "A mixture of ajwain, saunf, and gud cures PCOD and regulates periods in 7 days.", "date": "2026-03-02", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-ajwain-saunf-and-gud-cure-pcod-and-regulate-periods-in-7-days-166193", "img": "102466.jpg", "orig": "", "ev": [{"s": "There is no scientific evidence or medical consensus to support the claim that a mixture of ajwain, saunf, and gud can cure PCOD or regulate periods within 7 days.", "u": "https://ask-ayurveda.com/wiki/article/4208-natural-period--pcos-relief-with-ajwain", "d": "", "p": "external-verified"}, {"s": "PCOD is a condition caused by hormonal and genetic factors and is considered not curable, though its symptoms can be managed through lifestyle changes.", "u": "https://www.unicef.org/india/stories/do-pcod-and-pcos-mean-same-thing-or-are-they-different#:~:text=PCOD%20(Polycystic%20Ovarian%20Disease)%20is,be%2Dfertilized%20eggs%20each%20month.", "d": "", "p": "article"}, {"s": "While ajwain, saunf, and jaggery have general health benefits like aiding digestion or reducing menstrual pain, they cannot treat PCOD or correct hormonal imbalances.", "u": "https://www.apollo247.com/blog/article/6-health-benefits-of-ajwain", "d": "", "p": "external-verified"}, {"s": "Fennel seeds (saunf) may help alleviate menstrual pain, but this is distinct from curing PCOD or regulating the cycle itself.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3611645/#sec1-5", "d": "", "p": "article"}]}, {"id": 102495, "claim": "Russian military strikes on the distribution networks of Ukraine’s nuclear power plants are technologically safe and pose no risk of a nuclear disaster.", "date": "2026-02-28", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.stopfake.org/en/fake-strikes-on-ukraine-s-nuclear-facilities-pose-no-risk/", "img": "102495.png", "orig": "", "ev": [{"s": "Russian strikes on energy infrastructure have caused frequent emergency shutdowns of high-voltage transmission lines at Ukrainian nuclear plants.", "u": "https://www.aljazeera.com/news/2022/12/13/can-ukraines-energy-infrastructure-withstand-the-winter", "d": "", "p": "external-verified"}, {"s": "Grid damage from strikes has forced operators to reduce the load on nuclear reactors to maintain safety.", "u": "https://t.me/Denys_Smyhal/12360", "d": "", "p": "article"}, {"s": "At least seven incidents have forced Ukrainian nuclear units to reduce output or undergo full emergency shutdowns due to protective system triggers.", "u": "https://news.un.org/en/story/2026/02/1166914", "d": "", "p": "external-verified"}, {"s": "The abrupt disconnection of high-voltage lines carrying reactor-generated power creates significant operational risks and can lead to complex technical failures.", "u": "https://t.me/energyofukraine/5354", "d": "", "p": "article"}, {"s": "Russian strikes have targeted distribution facilities located within the boundaries of nuclear power plants, where inaccuracies could compromise reactor protective structures.", "u": "https://securityanddefence.pl/Nuclear-power-plants-in-war-zones-Lessons-learned-from-the-war-in-Ukraine,174810,0,2.html", "d": "", "p": "external-verified"}, {"s": "Ukrainian defense advisor Serhii Beskrestnov has noted the low precision of Russian missiles, stating a deviation of a few dozen meters could trigger a radiation disaster.", "u": "https://t.me/serhii_flash/6842", "d": "", "p": "article"}, {"s": "Deliberate Russian attacks have led to complete external power loss at Ukrainian nuclear facilities at least 13 times as of September 2025.", "u": "https://en.wikipedia.org/wiki/Zaporizhzhia_Nuclear_Power_Plant_crisis", "d": "", "p": "external-verified"}]}, {"id": 104455, "claim": "Tampa International Airport banned travelers from wearing pajamas and Crocs.", "date": "2026-02-26", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-tampa-airport-did-not-ban-pajamas.html", "img": "104455.jpg", "orig": "", "ev": [{"s": "Tampa International Airport did not ban pajamas; the announcement was a joke.", "u": "https://apnews.com/article/tampa-airport-pajamas-ban-social-media-joke-283d3baf0acaf7117b2fdf20ab4fd5a3", "d": "", "p": "external-verified"}, {"s": "An airport spokesperson confirmed that passengers are free to travel comfortably and that the post was intended as online humor.", "u": "https://www.wjtv.com/news/regional-news/ap-tampa-international-airport-shares-it-wants-to-ban-pajamas-it-was-a-joke-the-airport-says/", "d": "", "p": "external-verified"}, {"s": "The claim originated from a post on the @FlyTPA X account on February 26, 2026.", "u": "https://x.com/FlyTPA/status/2027037182091731286?s=20", "d": "", "p": "article"}, {"s": "The airport's communications department stated they regularly share lighthearted, satirical content to engage followers.", "u": "https://www.usatoday.com/story/travel/airline-news/2026/02/26/tampa-airport-pajama-ban/88881566007/", "d": "", "p": "external-verified"}, {"s": "There is no evidence that Tampa International Airport had previously banned Crocs.", "u": "https://people.com/did-the-tampa-airport-really-ban-pajamas-11915218", "d": "", "p": "external-verified"}]}, {"id": 110500, "claim": "Estimated annual U.S. federal fraud losses are significantly lower than the federal budget deficit.", "date": "2026-02-25", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://www.factcheck.org/2026/02/factchecking-trumps-state-of-the-union-address/", "img": "", "orig": "", "ev": [{"s": "The federal budget deficit for fiscal year 2025 was nearly $1.8 trillion.", "u": "https://www.crfb.org/press-releases/cbo-estimates-18-trillion-deficit-fiscal-year-2025", "d": "", "p": "external-verified"}, {"s": "The Congressional Budget Office projected the deficit will be $1.9 trillion for fiscal year 2026 and rise to $2 trillion or more in 2028.", "u": "https://www.crfb.org/papers/cbos-february-2026-budget-and-economic-outlook", "d": "", "p": "external-verified"}, {"s": "The Government Accountability Office estimated that the entire federal government could lose between $233 billion and $521 billion annually to fraud.", "u": "https://www.gao.gov/products/gao-24-105833", "d": "", "p": "article"}]}, {"id": 104421, "claim": "Under Joe Biden, millions of migrants poured into the U.S. from prisons and mental institutions, including 11,888 murderers.", "date": "2026-02-25", "mod": "image-text", "pred": "Conflicting Evidence/Cherrypicking", "gold": "false (rather certain)", "art": "https://www.dw.com/en/fact-check-donald-trump-claims-biden-inflation-ending-wars-migration-what-is-true/a-76117703", "img": "104421.jpg", "orig": "", "ev": [{"s": "US Customs and Border Protection (CBP) statistics show 10.8 million migrants were encountered at the nation's borders from 2021 to 2024 during Biden's presidency.", "u": "https://www.cbp.gov/newsroom/stats/cbp-enforcement-statistics", "d": "", "p": "article"}, {"s": "It is impossible to link millions of migrants to prisons and mental institutions because there is no comprehensive data documenting people's criminal or institutional history in their countries of origin.", "u": "https://immigrantjustice.org/research/report-a-legacy-of-injustice-the-u-s-criminalization-of-migration/", "d": "", "p": "external-verified"}, {"s": "The figure 11,888 likely refers to noncitizens convicted of murder who were not detained by ICE, but the source of the specific number is unclear.", "u": "https://www.factcheck.org/2024/09/trump-vance-wrong-about-illegal-immigrant-murderers/", "d": "", "p": "article"}, {"s": "As of July 2024, there were 13,099 non-detained noncitizens convicted of homicide and 277 who were detained, but this data spans several decades and includes people who entered long before Biden took office.", "u": "https://homeland.house.gov/wp-content/uploads/2024/09/24-01143-ICEs-Signed-Response-to-Representative-Tony-Gonzales.pdf", "d": "", "p": "article"}]}, {"id": 103141, "claim": "The $1,776 \"warrior dividend\" military bonuses were funded by reallocating Department of Defense housing allowances.", "date": "2026-02-24", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://www.factcheck.org/2026/02/factchecking-trumps-state-of-the-union-address/", "img": "", "orig": "", "ev": [{"s": "Approximately 1.5 million active-duty and reserve military members received the 'warrior dividend' bonus checks.", "u": "https://www.army.mil/article/289703/just_in_time_for_christmas_nation_gifts_service_members_1776_warrior_dividend", "d": "", "p": "article"}, {"s": "The funding for these bonuses was provided by a $2.9 billion appropriation within the One Big Beautiful Bill Act.", "u": "https://abcnews.go.com/Politics/trump-teased-warrior-dividend-checks-money-allotted-congress/story?id=128523188", "d": "", "p": "article"}]}, {"id": 104761, "claim": "The photograph shows Congress leader Sonia Gandhi dancing on a bar table.", "date": "2026-02-24", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.newsmobile.in/nm-fact-checker/verified-1967-go-go-dancers-photo-falsely-shared-as-sonia-gandhi/", "img": "", "orig": "", "ev": [{"s": "The image depicts go-go dancers performing at Rawson’s Hotel in Auburn, Australia, to celebrate the end of a brewery workers' strike.", "u": "https://www.facebook.com/Igrewupinmortdale2223/posts/onthisday-17-november-1967-a-strike-by-more-than-2000-brewery-workers-in-sydney-/857847686632130/", "d": "", "p": "article"}, {"s": "Getty Images hosts the original photograph, dated November 21, 1967, with a caption about go-go dancers at Rawson's Hotel.", "u": "https://www.gettyimages.in/detail/news-photo/go-go-dancing-girls-help-break-the-beer-drought-on-rawson-news-photo/118358810", "d": "", "p": "article"}]}, {"id": 104821, "claim": "Angela Rayner told Suella Braverman, \"Say one more word, and I'll embarrass you on national TV,\" in the House of Commons.", "date": "2026-02-23", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://fullfact.org/politics/rayner-braverman-fake-embarrass/", "img": "", "orig": "", "ev": [{"s": "The reported exchange between Angela Rayner and Suella Braverman in Parliament is fake.", "u": "https://www.gbnews.com/politics/angela-rayner-news-uk-politics-latest-tory", "d": "", "p": "external-verified"}, {"s": "The specific phrase 'embarrass you on national TV' has not been used by anyone in Parliament since Angela Rayner became an MP.", "u": "https://www.bbc.com/news/uk-politics-54675232", "d": "", "p": "external-verified"}, {"s": "The Facebook post incorrectly identifies Angela Rayner as Deputy PM, whereas she resigned from the government last September.", "u": "https://www.bbc.co.uk/news/live/c0lk8ye1979t", "d": "", "p": "article"}, {"s": "The post implies Suella Braverman was representing the Conservatives, but she left the party in January.", "u": "https://www.bbc.co.uk/news/articles/c1evq263e49o", "d": "", "p": "article"}, {"s": "The claim has been rated as false because the exchange was fabricated.", "u": "https://www.facebook.com/help/publisher/182222309230722", "d": "", "p": "article"}]}, {"id": 104367, "claim": "Anthony Albanese declared he will thoroughly investigate Pauline Hanson's comments about Muslims, stating \"I'm not going to let this go.\"", "date": "2026-02-23", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.aap.com.au/factcheck/no-truth-to-pms-pledge-to-investigate-hanson/", "img": "", "orig": "", "ev": [{"s": "Anthony Albanese has not promised to thoroughly investigate Senator Pauline Hanson over her recent comments about Muslims.", "u": "https://www.news24.com.au/politics/anthony-albanese-says-its-up-to-police-to-decide-if-pauline-hansons-muslim-comments-met-threshold-for-hate-speech-laws/news-story/4eb74b9a130e53c8849fd38e3387f87b", "d": "", "p": "external-verified"}, {"s": "The quotes attributed to the Prime Minister regarding an investigation into Senator Hanson are fake.", "u": "https://www.thenewdaily.com.au/life/social-media-life/2025/12/08/social-media-australian-fakes", "d": "", "p": "external-verified"}, {"s": "There is no record of the alleged quotes on the prime minister's social media accounts or official media appearance transcripts.", "u": "https://www.pm.gov.au/media", "d": "", "p": "article"}, {"s": "When asked about Senator Hanson's comments in relation to hate speech laws, the Prime Minister declined to give an opinion and stated he would allow appropriate authorities to engage.", "u": "https://www.pm.gov.au/media/television-interview-sky-news-sunday-agenda-4#:~:text=PRIME%20MINISTER%3A%C2%A0I%27ll%20allow%2C%20I%27m%20not%20a%20lawyer%2C%20nor%20am%20I%20in%20charge%20of%20fulfilling%20those%20laws.%20I%27ll%20allow%20the%20appropriate%20authorities%20to%20engage", "d": "", "p": "article"}, {"s": "The Prime Minister described Senator Hanson's comments as 'disgraceful' and accused her of 'dividing Australians'.", "u": "https://www.pm.gov.au/media/radio-interview-nova-melbourne-2#:~:text=Well%2C%20those%20comments%20are%20disgraceful.", "d": "", "p": "article"}]}, {"id": 110291, "claim": "The pictured Donald Trump called Xi Jinping's approach to the 2019 Hong Kong protests responsible.", "date": "2026-02-16", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://annielab.org/2026/02/16/misleading-old-trump-quote-about-2019-protests-misused-after-jimmy-lai-sentencing/", "img": "110291.png", "orig": "", "ev": [{"s": "A Lianhe Zaobao headline from July 23, 2019, reported that Donald Trump remarked Chinese President Xi Jinping had 'acted responsibly' regarding the Hong Kong protests.", "u": "https://www.zaobao.com/realtime/world/story20190723-974809", "d": "", "p": "article"}, {"s": "The quote used in the social media post refers to the handling of the 2019 mass demonstrations over a proposed extradition bill, not to the recent conviction of Jimmy Lai.", "u": "https://www.aljazeera.com/news/2026/2/9/jimmy-lai-sentenced-whats-happened-to-other-hk-pro-democracy-protesters", "d": "", "p": "external-verified"}, {"s": "Donald Trump's most recent recorded comment regarding Jimmy Lai was on December 15, 2025, where he stated he had asked President Xi to consider Lai's release.", "u": "https://hongkongfp.com/2025/12/16/trump-says-has-asked-chinas-xi-to-release-hong-kongs-jimmy-lai/", "d": "", "p": "article"}]}, {"id": 104867, "claim": "The images show 18 currently serving Muslim mayors in England.", "date": "2026-02-16", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://fullfact.org/culture-and-society/viral-posts-75-per-cent-england-mayors-muslim-misleading/", "img": "104867.jpg", "orig": "", "ev": [{"s": "Of the 18 people pictured in the viral image, only five are currently still mayors.", "u": "https://www.archives.nyc/blog/2025/2/7/digitizing-the-david-n-dinkins-mayoral-photograph-collection", "d": "", "p": "external-verified"}, {"s": "The 18 people in the image include a mix of directly elected and civic mayors, but only three of the 27 directly elected mayors in England are confirmed to be Muslim.", "u": "https://theconversation.com/sadiq-khan-british-dream-now-a-reality-for-londons-first-muslim-mayor-58945", "d": "", "p": "external-verified"}, {"s": "The three directly elected mayors in England identified as Muslim are Sadiq Khan (Mayor of London), Rokhsana Fiaz (Newham), and Lutfur Rahman (Tower Hamlets).", "u": "https://x.com/grok/status/1974631000362909696", "d": "", "p": "external-verified"}, {"s": " function vclass(d){
  const g = d.gold||"", p = d.pred||"";
  if ((g.startsWith("true") && p==="Supported") || (g.startsWith("false") && p==="Refuted")) return "ok";
  if (!g || p==="Not Enough Evidence" || p==="Conflicting Evidence/Cherrypicking") return "na";
  return g ? "bad" : "na";
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function card(d){
  const vc = vclass(d);
  const vlabel = vc==="ok" ? "✓ " : vc==="bad" ? "✗ " : "";
  const img = d.img ? `<img class="cardimg" src="media/${d.img}" loading="lazy" alt="claim media">` : "";
  const ev = d.ev.map(e=>`<div class="evitem">${esc(e.s)}<div class="evmeta"><span class="tag ${e.p}">${e.p}</span>${e.d?`<span class="mono">${e.d}</span>`:""}${e.u?`<a href="${esc(e.u)}" target="_blank" onclick="event.stopPropagation()">${esc(e.u.slice(0,70))}</a>`:""}</div></div>`).join("");
  const decon = d.orig ? `<h4>Decontextualization</h4><div class="deconbox">original: ${esc(d.orig)}</div>` : "";
  return `<div class="card" onclick="this.classList.toggle('open')">${img}<div class="cardbody">
  <div class="claimtext">${esc(d.claim)}</div>
  <div class="cfoot"><span>#${d.id}</span><span>${d.date}</span><span class="chip mod">${d.mod}</span>
  <span class="chip v-${vc}" style="margin-left:auto">${vlabel}${esc(d.pred||"—")}${d.gold?` · gold: ${esc(d.gold)}`:""}</span></div>
  <div class="detail">${decon}<h4>Evidence (${d.ev.length})</h4>${ev}
  <h4>Source</h4><a href="${esc(d.art)}" target="_blank" onclick="event.stopPropagation()">fact-checking article ↗</a></div></div></div>`;
}
function render(){
  const fv=document.getElementById("fVerdict").value, fm=document.getElementById("fMod").value,
        fe=document.getElementById("fEv").value, ord=document.getElementById("fOrder").value;
  let list=[...DATA];
  list.sort((a,b)=>ord==="desc"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  const htmls=[]; let n=0;
  for(const d of list){
    if(fv && vclass(d)!==fv) continue;
    if(fm && d.mod!==fm) continue;
    if(fe && !d.ev.some(e=>e.p===fe)) continue;
    htmls.push(card(d)); n++;
  }
  document.getElementById("grid").innerHTML=htmls.join("");
  document.getElementById("count").textContent=n+" shown";
  document.getElementById("pill").textContent=DATA.length+" claims";
}
for(const id of ["fVerdict","fMod","fEv","fOrder"]) document.getElementById(id).addEventListener("change",render);
const btn=document.getElementById("themeBtn");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);btn.textContent=t==="dark"?"☀️":"🌙";localStorage.setItem("mcfc_theme",t)}
btn.onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
setTheme(localStorage.getItem("mcfc_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
render();
</script>
