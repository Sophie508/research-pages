<head>

<title>MCFC Bench — Claim Browser</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fafbfc; --card:#ffffff; --ink:#101828; --ink2:#475467; --ink3:#98a2b3;
  --line:#eaecf0; --accent:#e8590c; --accent-soft:#fff4ed;
  --ok:#079455; --ok-soft:#ecfdf3; --bad:#d92d20; --bad-soft:#fef3f2;
  --info:#175cd3; --info-soft:#eff8ff; --warn:#b54708; --warn-soft:#fffaeb;
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
}
[data-theme="dark"] {
  --bg:#0c111d; --card:#161b26; --ink:#f5f5f6; --ink2:#94969c; --ink3:#61646c;
  --line:#1f242f; --accent:#ff692e; --accent-soft:#2a1206;
  --ok:#47cd89; --ok-soft:#0a2417; --bad:#f97066; --bad-soft:#2d1210;
  --info:#84adff; --info-soft:#0e1f3d; --warn:#fdb022; --warn-soft:#2a1e05;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",-apple-system,"PingFang SC",sans-serif;font-size:15px;line-height:1.6;transition:background .2s}
nav{display:flex;align-items:center;gap:32px;padding:0 40px;height:64px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.brand{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand a{color:inherit;text-decoration:none}
.navlinks{display:flex;gap:28px;margin-left:auto;font-weight:500;color:var(--ink2);font-size:14.5px}
.navlinks a{color:inherit;text-decoration:none} .navlinks a:hover{color:var(--ink)}
#themeBtn{margin-left:20px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink2)}
.hero{text-align:center;padding:56px 20px 8px}
h1{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:40px;letter-spacing:-.03em}
.pill{display:inline-block;margin-top:16px;padding:8px 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}
.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;max-width:1240px;margin:36px auto 0;padding:0 24px 18px;border-bottom:1px solid var(--line)}
.controls label{font-weight:600;color:var(--ink2);font-size:14px}
select{font-family:inherit;font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.count{margin-left:auto;font-size:13.5px;color:var(--ink3);font-family:"JetBrains Mono",monospace}
.grid{max-width:1240px;margin:26px auto 80px;padding:0 24px;column-count:3;column-gap:20px}
@media(max-width:1000px){.grid{column-count:2}} @media(max-width:660px){.grid{column-count:1}}
.card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 12px rgba(16,24,40,.1)}
.cardimg{width:100%;display:block;max-height:280px;object-fit:cover}
.cardbody{padding:18px 22px 20px}
.claimtext{font-size:15.5px;line-height:1.55;margin-bottom:14px}
.cfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);font-family:"JetBrains Mono",monospace;border-top:1px solid var(--line);padding-top:12px}
.chip{padding:2px 10px;border-radius:999px;font-family:"DM Sans";font-size:12px;font-weight:600}
.chip.mod{background:var(--info-soft);color:var(--info)}
.chip.v-ok{background:var(--ok-soft);color:var(--ok)} .chip.v-bad{background:var(--bad-soft);color:var(--bad)} .chip.v-na{background:var(--warn-soft);color:var(--warn)}
.detail{display:none;margin-top:16px}
.card.open .detail{display:block}
.detail h4{font-family:"Plus Jakarta Sans";font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:14px 0 8px}
.evitem{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.evmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px}
.tag{padding:1px 9px;border-radius:999px;font-weight:600;font-size:11.5px}
.tag.article{background:var(--info-soft);color:var(--info)}
.tag.external-verified{background:var(--ok-soft);color:var(--ok)}
.tag.external-nodate{background:var(--warn-soft);color:var(--warn)}
.tag.ungrounded{background:var(--bad-soft);color:var(--bad)}
.tag.metadata,.tag.none{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
.detail a{color:var(--info);word-break:break-all;text-decoration:none;font-size:12.5px} .detail a:hover{text-decoration:underline}
.deconbox{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:6px;color:var(--ink2)}
.mono{font-family:"JetBrains Mono",monospace}
</style>
</head>

<script>
const DATA = [{"id": 103585, "claim": "Mark Twain said, \"If you don't read the newspaper, you're uninformed. If you do read it, you're misinformed.\"", "date": "2026-03-27", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/03/fact-check-mark-twain-did-not-say-if-you-dont-read-the-newspaper-youre-uninformed-if-you-do-read-it-youre-misinformed.html", "img": "103585.jpg", "orig": "", "ev": [{"s": "The Center for Mark Twain Studies categorizes the quote as part of 'The Apocryphal Twain,' a collection of unverified anecdotes attributed to him.", "u": "https://marktwainstudies.com/the-apocryphal-twain/if-you-dont-read-the-newspaper-youre-uninformed-if-you-do-youre-misinformed/", "d": "", "p": "article"}, {"s": "A Google Advanced Search of the Twainquotes.com website yielded no matches for the specific quote.", "u": "https://www.twainquotes.com/", "d": "", "p": "article"}, {"s": "Barbara Schmidt, the publisher of Twainquotes.com, stated via email that there is no evidence Mark Twain ever made this quote.", "u": "https://www.twainquotes.com/twain3d.html", "d": "", "p": "article"}]}, {"id": 105348, "claim": "A herbal tea made of coriander seeds, arjun bark, and curry leaves prevents heart attacks.", "date": "2026-03-24", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://www.thip.media/health-news-fact-check/fact-check-can-a-particular-herbal-tea-prevent-heart-attacks/141333/", "img": "", "orig": "", "ev": [{"s": "There is no clinical evidence showing that a tea made of coriander, arjun bark, and curry leaves can prevent heart attacks.", "u": "https://www.ebsco.com/research-starters/nutrition-and-dietetics/arjun-dietary-supplement", "d": "", "p": "external-verified"}, {"s": "A heart attack occurs when blood flow to a part of the heart muscle is suddenly blocked, often due to cholesterol-rich plaque rupture and clot formation.", "u": "https://www.thip.media/health/heart-health/heart-attack/", "d": "", "p": "article"}, {"s": "Arjun bark (Terminalia arjuna) may support heart function or help with mild blood pressure reduction, but it is not a primary preventive therapy for heart attacks.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5198828/", "d": "", "p": "article"}, {"s": "Coriander seeds may help lower blood sugar and improve lipid metabolism, but they do not directly remove arterial plaque or prevent clots.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10220854/", "d": "", "p": "article"}, {"s": "Curry leaves may help reduce oxidative stress and support cholesterol regulation, but they are not powerful enough to prevent heart attacks on their own.", "u": "https://www.healthline.com/nutrition/curry-leaves-benefits", "d": "", "p": "external-verified"}]}, {"id": 104545, "claim": "UK Prime Minister Keir Starmer said the UK may need to go into lockdown as early as May if meningitis cases continue to escalate.", "date": "2026-03-20", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://fullfact.org/health/keir-starmer-fake-quote-lockdown-meningitis/", "img": "", "orig": "", "ev": [{"s": "Number 10 confirmed that Prime Minister Keir Starmer did not make the comments regarding a potential lockdown due to meningitis cases.", "u": "https://x.com/FullFact/status/2034938851697803643", "d": "", "p": "external-verified"}, {"s": "The fake quote about a lockdown originated from a satirical Facebook page.", "u": "https://www.buzzfeed.com/joeydurso/coronavirus-fake-bill-gates-quote", "d": "", "p": "external-verified"}, {"s": "Social media posts falsely claimed the Prime Minister said the UK may need to go into lockdown as early as May if meningitis cases continue to escalate.", "u": "https://x.com/FullFact/status/2034938851697803643", "d": "", "p": "external-verified"}, {"s": "Some social media posts included an additional fake quote from Mr. Starmer stating he would do whatever it takes to keep the country safe, even if it means people cannot go outside.", "u": "https://www.gov.uk/government/news/pm-no-platform-gets-a-free-pass-government-takes-action-to-keep-children-safe-online", "d": "", "p": "external-verified"}, {"s": "At the time of the report, there were 27 confirmed or suspected cases of invasive meningococcal disease in Kent and two deaths.", "u": "https://www.gov.uk/government/news/cases-of-invasive-meningococcal-disease-confirmed-in-kent", "d": "", "p": "article"}, {"s": "The UKHSA stated that the risk of infection from the meningitis outbreak to the wider population remains low.", "u": "https://ukhsa.blog.gov.uk/2026/03/18/meningitis-b-outbreak-what-you-need-to-know/", "d": "", "p": "article"}]}, {"id": 110141, "claim": "Soleus push-ups gradually improve blood sugar levels and metabolic health.", "date": "2026-03-19", "mod": "image-text", "pred": "Supported", "gold": "true (rather certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-soleus-push-up-reduce-blood-sugar-by-30-mgdl-in-an-hour-167107", "img": "110141.jpg", "orig": "", "ev": [{"s": "Soleus push-ups are an easy seated exercise that focus on the soleus muscle to improve metabolic health and circulation.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9404652/", "d": "", "p": "article"}, {"s": "Research indicates that performing soleus push-ups can lead to significant improvements in VLDL and triglyceride levels, as well as enhanced glucose tolerance.", "u": "https://pubmed.ncbi.nlm.nih.gov/36034224/", "d": "", "p": "article"}, {"s": "The soleus push-up exercise provides physiological benefits including improved blood sugar regulation, enhanced blood flow, increased energy production, and more efficient metabolic activity.", "u": "https://stories.uh.edu/2022-soleus-pushup/index.html", "d": "", "p": "external-verified"}]}, {"id": 103979, "claim": "Fairview School in Calgary banned all food from its cafeteria and lunchroom for Ramadan.", "date": "2026-03-18", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://factcheck.afp.com/doc.afp.com.A3NF6NQ", "img": "", "orig": "", "ev": [{"s": "A Calgary middle school issued an advisory designating the cafeteria and lunchroom as 'no food' zones at specific times to support students observing Ramadan.", "u": "https://nypost.com/2026/03/16/world-news/canadian-school-sparks-controversy-over-no-food-zones-to-serve-muslim-students-fasting-for-ramadan/", "d": "", "p": "external-verified"}, {"s": "The Calgary Board of Education (CBE) stated that these accommodations did not change the school's normal lunch areas and did not bar students from eating on campus.", "u": "https://calgaryherald.com/news/fairview-school", "d": "", "p": "external-verified"}, {"s": "Students in grades 4, 5, and 6 typically eat in their homerooms rather than the cafeteria, according to the Fairview School website.", "u": "https://fairview.cbe.ab.ca/lunchtime", "d": "", "p": "article"}, {"s": "For older students (grades 7, 8, and 9), the school provides 'no food' areas in the lunchroom, but they have other options for eating.", "u": "https://fairview.cbe.ab.ca/lunchtime", "d": "", "p": "article"}]}, {"id": 104563, "claim": "Indian Prime Minister Narendra Modi announced that free gas cylinders will be provided to everyone under the Ujjwala scheme starting March 12 due to the LPG shortage.", "date": "2026-03-16", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.boomlive.in/fact-check/fake-news-viral-video-pm-modi-announcing-free-lpg-cylinders-iran-war-factcheck-30867", "img": "", "orig": "", "ev": [{"s": "The video claiming PM Modi announced free LPG cylinders under the Ujjwala scheme is a digitally altered deepfake.", "u": "https://x.com/boomlive_in/status/2033519447776837792", "d": "2026-03-16", "p": "external-verified"}, {"s": "The visual content of the viral video is actually from an original 2019 speech by PM Modi in Gorakhpur, Uttar Pradesh, regarding the Pradhan Mantri Kisan Samman Nidhi scheme.", "u": "https://www.youtube.com/watch?v=RqckrQW54kE#:~:text=PM%20Modi's%20speech%20at%20launch,This%20content%20isn't%20available.", "d": "", "p": "article"}, {"s": "AI detection tools have flagged the video's audio and lip-syncing as highly likely to be artificial/deepfake.", "u": "https://www.resemble.ai/resources/how-to-tell-if-a-video-is-ai-generated", "d": "2025-10-27", "p": "external-verified"}, {"s": "The official Ministry of Petroleum and Natural Gas and Ujjwala scheme websites contain no information regarding free cylinders.", "u": "https://mopng.gov.in/hi", "d": "", "p": "article"}, {"s": "The existing Ujjwala scheme provides free connections and subsidies, but does not offer free gas cylinders.", "u": "https://pmujjwalayojana.com/hindi/free-gas-cylinder-yojana/", "d": "", "p": "article"}]}, {"id": 103921, "claim": "The UK government is cutting defence spending by £2.6 billion from the Ministry of Defence budget in 2026.", "date": "2026-03-13", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://fullfact.org/politics/defence-spending-increase-pmqs/", "img": "", "orig": "", "ev": [{"s": "The £2.6 billion figure refers to a projected overspend for the 2025/26 year, rather than a budget cut.", "u": "https://ifs.org.uk/publications/annual-report-education-spending-england-2025-26", "d": "2026-01-21", "p": "external-verified"}, {"s": "The £2.6 billion figure originated from a leaked MoD internal spending estimate reported by the Telegraph in October 2025.", "u": "https://x.com/Telegraph/status/1981440542664774098", "d": "", "p": "external-verified"}, {"s": "The Ministry of Defence's budget for 2025/26 is £62.2 billion, which is an increase of approximately 3.2% in cash terms compared to 2024/25.", "u": "https://www.gov.uk/government/statistics/defence-departmental-resources-2025/mod-departmental-resources-2025", "d": "2026-01-15", "p": "external-verified"}, {"s": "The National Audit Office suggests the MoD's budget is increasing in real terms by £0.3 billion this financial year.", "u": "https://www.nao.org.uk/wp-content/uploads/2025/12/mod-2024-25.pdf#page=13", "d": "", "p": "article"}, {"s": "The MoD's budget is projected to increase by an average of 3.8% a year in real terms between 2025/26 and 2028/29.", "u": "https://www.gov.uk/government/publications/spending-review-2025-document/spending-review-2025-html", "d": "2025-06-11", "p": "external-verified"}]}, {"id": 103830, "claim": "The photo shows a freshwater desalination plant destroyed in Qeshm, Iran.", "date": "2026-03-13", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.vishvasnews.com/english/world/fact-check-viral-photo-of-iraqi-warehouse-attack-misidentified-as-iranian-water-treatment-plant/", "img": "103830.jpg", "orig": "", "ev": [{"s": "While Iranian Foreign Minister Seyed Abbas Araghchi did post about a US attack on a desalination plant on Qeshm Island, his post did not include any photos.", "u": "https://x.com/araghchi/status/2030285674528616916", "d": "", "p": "article"}, {"s": "Al Jazeera published a video showing the devastation caused by a drone strike in Basra, Iraq, on March 6.", "u": "https://www.aljazeera.com/video/newsfeed/2026/3/6/drone-evades-defences-ignites-fire-at-southern-iraq-oil-facility#flips-6390513591112:0", "d": "", "p": "article"}]}, {"id": 103885, "claim": "Pope Leo XIV condemned U.S. and Israeli military actions against Iran and rebuked a White House prayer gathering for Donald Trump by stating, \"War is not holy; only peace is holy because it is willed by God.\"", "date": "2026-03-11", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.snopes.com/fact-check/pope-leo-xiv-iran-war/", "img": "", "orig": "", "ev": [{"s": "In March 2026, Pope Leo XIV addressed the violence in Iran and the Middle East, but he did not use the specific quote 'war is not holy; only peace is holy because it is willed by God' in that address.", "u": "", "d": "", "p": "metadata"}, {"s": "The quote 'War is never holy; only peace is holy, because it is willed by God!' was actually spoken by Pope Leo XIV during a speech on October 28, 2025, at the International Meeting for Peace in Rome.", "u": "https://www.vatican.va/content/leo-xiv/en/speeches/2025/october/documents/20251028-meeting-pace.html#:~:text=war%20is%20never%20holy%3B%20only%20peace%20is%20holy%2C%20because%20it%20is%20willed%20by%20God!", "d": "", "p": "article"}, {"s": "Pope Leo XIV's March 8, 2026, Angelus message was an appeal for peace and dialogue rather than a powerful condemnation of specific military actions.", "u": "", "d": "", "p": "metadata"}, {"s": "In his March 8, 2026, address, the Pope prayed for the cessation of violence and for dialogue, stating: 'We lift up our humble prayer to the Lord, so that the thunderous sound of bombs may cease, weapons may fall silent, and a space for dialogue may open up in which the voice of the people can be heard.'", "u": "https://www.vatican.va/content/leo-xiv/en/angelus/2026/documents/20260308-angelus.html", "d": "", "p": "article"}, {"s": "Pope Leo XIV did not mention the United States or Israel by name in his March 2026 remarks regarding the conflict.", "u": "https://apnews.com/article/vatican-pope-mideast-war-0156c759d1bbdf1cadc0cd8f48cc8c82", "d": "", "p": "external-verified"}]}, {"id": 103875, "claim": "Inflation in South Africa is at its lowest level in 20 years.", "date": "2026-03-11", "mod": "text-only", "pred": "Supported", "gold": "true (rather certain)", "art": "https://africacheck.org/fact-checks/reports/sona-2026-data-showed-modest-economic-progress-south-africa-middle-east", "img": "", "orig": "", "ev": [{"s": "The average Consumer Price Index (CPI) rate for 2025 in South Africa was 3.2%.", "u": "https://www.statssa.gov.za/publications/P0141/CPIHistory.pdf#page=3", "d": "", "p": "article"}, {"s": "Excluding 2004, the last time South Africa's average CPI rate fell below 3.2% was in 1969, when it was 3.0%.", "u": "https://www.statssa.gov.za/publications/P0141/CPIHistory.pdf#page=2", "d": "", "p": "article"}, {"s": "The average Producer Price Index (PPI) rate for 2025 was 1.5%, which is the lowest since at least 2013.", "u": "https://www.statssa.gov.za/publications/P01421/Final_manufactured_goods.pdf?t=1772111579", "d": "", "p": "article"}]}, {"id": 102852, "claim": "The photo shows the damaged USS Forrestal in 1967.", "date": "2026-03-05", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://espanol.leadstories.com/fact-check/2026/03/verificacion-de-datos-foto-no-muestra-danos-en-el-abraham-lincoln-es-el-forrestal.html", "img": "102852.jpg", "orig": "", "ev": [{"s": "The photo was identified via Getty Images, confirming it dates from 1967.", "u": "https://www.gettyimages.com/detail/news-photo/repair-crews-working-to-fix-the-damaged-deck-of-the-uss-news-photo/53369847", "d": "", "p": "article"}, {"s": "The damage to the USS Forrestal was caused by a devastating fire in the Gulf of Tonkin during the Vietnam War.", "u": "https://www.history.com/this-day-in-history/july-29/rocket-causes-deadly-fire-on-aircraft-carrier", "d": "", "p": "article"}]}, {"id": 102445, "claim": "The United Nations Security Council labeled U.S. President Donald Trump a \"wanted international war criminal\".", "date": "2026-03-02", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.snopes.com/fact-check/un-trump-war-criminal-iran/", "img": "102445.jpg", "orig": "", "ev": [{"s": "The United Nations Security Council had not released any resolutions, presidential statements, or news releases labeling Donald Trump as a war criminal at the time of the article's publication.", "u": "https://trumpwhitehouse.archives.gov/briefings-statements/remarks-president-trump-united-nations-security-council-briefing-counterproliferation-new-york-ny/", "d": "", "p": "external-verified"}, {"s": "No reputable news outlets reported that the UN Security Council declared Trump a war criminal.", "u": "https://ca.news.yahoo.com/trump-labeled-war-criminal-no-160450615.html", "d": "", "p": "external-verified"}, {"s": "The United States is a permanent member of the UN Security Council and possesses veto power over decisions, meaning it could overrule any attempt to label Trump a war criminal.", "u": "https://main.un.org/securitycouncil/en/content/voting-system", "d": "", "p": "article"}, {"s": "During the emergency session, Iran's ambassador Amir Saeid Iravani called the attacks a 'war crime,' but he did not specifically call Trump a war criminal.", "u": "https://news.un.org/en/story/2026/02/1167060", "d": "", "p": "article"}, {"s": "Under UN Charter Article 27, decisions on non-procedural matters require the concurring votes of the permanent members, including the United States.", "u": "https://legal.un.org/repertory/art27.shtml", "d": "", "p": "article"}]}, {"id": 102489, "claim": "Several celebrities, including Neil Diamond, Eminem, and Coco Gauff, donated $5 million to provide emergency relief and medical aid following an elementary school strike in southern Iran.", "date": "2026-03-01", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/03/fact-check-taylor-swift-Kelsey-bono-your-favorite-celeb--did-not-donate-5m-to-iran-school.html", "img": "102489.jpg", "orig": "", "ev": [{"s": "The false claim about celebrity donations was created and distributed by a spam factory in Vietnam using AI tools to publish fake articles.", "u": "https://www.yahoo.com/entertainment/celebrity/articles/prebunk-beware-fake-fan-pages-184921955.html", "d": "", "p": "external-verified"}, {"s": "The fake claims began spreading on Facebook shortly after U.S. and Israel missile attacks on Iran on February 28, 2026.", "u": "", "d": "", "p": "metadata"}, {"s": "The Facebook pages hosting these false posts are linked to Vietnam, a known source of AI-generated false stories.", "u": "https://www.nbcnews.com/tech/tech-news/facebook-says-pro-trump-media-outlet-used-artificial-intelligence-create-n1105951", "d": "", "p": "external-verified"}]}, {"id": 106197, "claim": "The image of Tampa International Airport banning pajamas is satire.", "date": "2026-02-26", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-tampa-airport-did-not-ban-pajamas.html", "img": "106197.jpg", "orig": "", "ev": [{"s": "The pajama ban announcement was a playful social media post intended to engage followers rather than a real rule.", "u": "https://people.com/did-the-tampa-airport-really-ban-pajamas-11915218", "d": "", "p": "external-verified"}, {"s": "The airport's communications department confirmed they regularly share lighthearted, satirical content on social media.", "u": "https://www.wfla.com/news/hillsborough-county/had-enough-tampa-international-airport-jokes-about-banning-pajamas/", "d": "", "p": "external-verified"}, {"s": "The specific post about banning pajamas was described by the airport as a playful nod to fashion debates.", "u": "https://www.foxnews.com/travel/tampa-airport-teases-pajama-ban-triggering-social-media-firestorm-dress-code-controversy", "d": "", "p": "external-verified"}, {"s": "The airport spokesperson stated that passengers are free to travel comfortably.", "u": "https://abcnews.com/GMA/Travel/viral-tiktok-amplifies-southwest-airlines-policy-giving-size/story?id=105687491", "d": "", "p": "external-verified"}, {"s": "The claim originated from a post on the @FlyTPA X account on February 26, 2026.", "u": "https://x.com/FlyTPA/status/2027037182091731286?s=20", "d": "", "p": "article"}]}, {"id": 104769, "claim": "Eliminating fraudulent spending in the U.S. federal government would be enough to balance the federal budget.", "date": "2026-02-25", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.factcheck.org/2026/02/factchecking-trumps-state-of-the-union-address/", "img": "", "orig": "", "ev": [{"s": "The federal government's annual loss to fraud is estimated to be between $233 billion and $521 billion.", "u": "https://www.gao.gov/products/gao-24-105833", "d": "", "p": "article"}, {"s": "The federal budget deficit for fiscal year 2025 was nearly $1.8 trillion.", "u": "https://www.crfb.org/press-releases/cbo-estimates-18-trillion-deficit-fiscal-year-2025", "d": "", "p": "external-verified"}, {"s": "The Congressional Budget Office projected the federal deficit would be $1.9 trillion for fiscal year 2026 and could rise to $2 trillion or more in 2028.", "u": "https://www.crfb.org/papers/cbos-february-2026-budget-and-economic-outlook", "d": "", "p": "external-verified"}, {"s": "The maximum estimated annual loss to fraud is significantly lower than the current federal budget deficit.", "u": "https://www.gao.gov/products/gao-24-105833", "d": "", "p": "external-verified"}]}, {"id": 104024, "claim": "Mark Zuckerberg was subpoenaed over wire transfers from Meta subsidiary Horizon Bridge LLC to the Epstein-linked Butterfly Foundation. The payments funded Project Looking Glass, a facial recognition database of children on Instagram.", "date": "2026-03-05", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://leadstories.com/hoax-alert/2026/03/fact-check-post-does-not-prove-mark-zuckerberg-was-subpoenaed-over-payments-from-horizon-bridge-to-butterfly-foundation.html", "img": "", "orig": "", "ev": [{"s": "The Butterfly Foundation is not named in the Epstein Files.", "u": "https://www.latimes.com/opinion/story/2025-09-07/epstein-survivors", "d": "", "p": "external-verified"}, {"s": "A search for 'Horizon Bridge LLC' and 'Meta' yielded no results.", "u": "https://www.google.com/search?q=%22Horizon+Bridge+LLC%22+Meta&sca_esv=286534660d0b6d5d&rlz=1C5CHFA_enUS932US932&biw=1551&bih=707&tbm=nws&sxsrf=ANbL-n6ecr88zGdYMgQMPOixVWFS8O2nxA%3A1772753723255&ei=OxOqafuSD9Sw5NoP6cbR2Q8&ved=0ahUKEwi7nMuf9omTAxVUGFkFHWljNPsQ4dUDCA4&uact=5&oq=%22Horizon+Bridge+LLC%22+Meta&gs_lp=Egxnd3Mtd2l6LW5ld3MiGSJIb3Jpem9uIEJyaWRnZSBMTEMiIE1ldGEyCBAhGKABGMMESN4LUP8CWIIHcAB4AJABAJgBiAGgAfoDqgEDMy4yuAEDyAEA-AEBmAIFoAKGBMICChAhGAoYoAEYwwSYAwCIBgGSBwMzLjKgB6AKsgcDMy4yuAeGBMIHAzEuNMgHB4AIAQ&sclient=gws-wiz-news", "d": "", "p": "article"}, {"s": "No records were found for the combination of 'Mark Zuckerberg', ''subpoenaed', 'Bondi', 'Epstein', and 'Horizon Bridge LLC'.", "u": "https://www.google.com/search?q=%22Mark+Zuckerberg%22+subpoenaed+Bondi+Epstein+Horizon+Bridge+LLC&sca_esv=4cca1bafe5d3c697&rlz=1C5CHFA_enUS932US932&biw=1551&bih=707&tbm=nws&sxsrf=ANbL-n4FtNfB1HKd_qlEc7LGq7ruIfMleQ%3A1772753896632&ei=6BOqadSaJs6y5NoPjdTlWA&ved=0ahUKEwjUrqHy9omTAxVOGVkFHQ1qGQsQ4dUDCA4&uact=5&oq=%22Mark+Zuckerberg%22+subpoenaed+Bondi+Epstein+Horizon+Bridge+LLC&gs_lp=Egxnd3Mtd2l6LW5ld3MiPSJNYXJrIFp1Y2tlcmJlcmciIHN1YnBvbmEgQm9uZGkgRXBzdGVpbiBIb3Jpem9uIEJyaWRnZSBMTENIu3BQpQJYgW1wAHgAkAEAmAGRAaABlgqqAQQxMi4zuAEDyAEA-AEBmAIAoAIAmAMAiAYBkgcAoAe1DrIHALgHAMIHAMgHAIAIAQ&sclient=gws-wiz-news", "d": "", "p": "article"}, {"s": "The Department of Justice's 'Epstein Library' contains no results for 'Horizon Bridge LLC'.", "u": "https://www.brennancenter.org/our-work/research-reports/2020-annual-report", "d": "", "p": "external-verified"}, {"s": "There is no evidence supporting the existence of 'Project Looking Glass' or its alleged purpose.", "u": "https://x.com/grok/status/1969608438704718098", "d": "", "p": "external-verified"}]}, {"id": 110194, "claim": "The image shows California paid the Coalition for Humane Immigrant Rights over $100 million for social welfare and legal services.", "date": "2026-02-23", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-california-did-not-give-coalition-for-humane-immigrant-rights-100-million-mainly-to-pay-protesters.html", "img": "110194.jpg", "orig": "", "ev": [{"s": "California paid the Coalition for Humane Immigrant Rights (CHIRLA) approximately $115 million for the 2019-2025 fiscal years.", "u": "https://www.chirla.org/news-category/chirla-celebrates-gov-newsoms-commitment-to-immigrant-wellbeing-in-proposed-2022-budget/", "d": "", "p": "external-verified"}, {"s": "Of the total payments to CHIRLA, 98% ($113 million) came from California's Department of Social Services.", "u": "https://www.chirla.org/what-we-do/programs-initiatives/policy-advocacy/state-work/", "d": "", "p": "external-verified"}, {"s": "State budget records show no evidence that funds were used to pay or organize protesters, nor are there line items for activist stipends or demonstration organizing.", "u": "https://ebudget.ca.gov/2024-25/pdf/GovernorsBudget/4000/5180.pdf", "d": "", "p": "article"}, {"s": "The mission of the California Department of Social Services involves providing cash assistance, social services, and protecting vulnerable children and adults.", "u": "https://ebudget.ca.gov/2024-25/pdf/GovernorsBudget/4000/5180.pdf", "d": "", "p": "article"}, {"s": "CHIRLA's communications director stated that the organization has not received state funding for organizing or civic engagement and does not pay for protesters.", "u": "https://www.cbsnews.com/losangeles/news/chirla-responds-to-potential-investigation-into-nonprofits-involvement-in-l-a-protests/", "d": "", "p": "external-verified"}, {"s": "CHIRLA provides services including legal immigration services (family petitions, U-visas, naturalizations, etc.), community education, and advocacy for policy changes.", "u": "https://www.chirla.org/news-announcements/", "d": "", "p": "article"}]}, {"id": 104485, "claim": "During his first 10 months in office, Donald Trump ended eight wars: Cambodia and Thailand, Pakistan and India, Kosovo and Serbia, Israel and Iran, Egypt and Ethiopia, Armenia and Azerbaijan, the Congo and Rwanda, and the war in Gaza.", "date": "2026-02-24", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.dw.com/en/fact-check-donald-trump-claims-biden-inflation-ending-wars-migration-what-is-true/a-76117703", "img": "104485.jpg", "orig": "", "ev": [{"s": "The claim that Trump ended eight wars is false because many of the listed conflicts remain unresolved and his role as a peace broker is disputed.", "u": "https://www.bbc.com/news/articles/c5y3599gx4qo", "d": "", "p": "external-verified"}, {"s": "The ceasefire agreement between Cambodia and Thailand in July 2025 did not hold and was replaced by another ceasefire in which Trump was not involved.", "u": "https://www.bbc.com/news/articles/c0q5je8048xo", "d": "", "p": "article"}, {"s": "India has repeatedly rejected Trump's claim of ending the war against Pakistan.", "u": "https://www.bbc.com/news/articles/c5y204pmrp2o", "d": "", "p": "external-verified"}, {"s": "Serbia and Kosovo were not in an open state of war, and they have never signed a final peace treaty.", "u": "https://www.lawfaremedia.org/article/deal-or-no-deal-international-influence-and-serbia-kosovo-conflict", "d": "", "p": "external-verified"}, {"s": "The situation between Israel and Iran remains fragile despite a ceasefire brokered by Trump in June 2025.", "u": "https://www.theguardian.com/world/2025/jun/21/trump-us-nuclear-strikes-iran", "d": "", "p": "article"}, {"s": "Egypt and Ethiopia were never at war during Trump's presidency, and the dispute over the Grand Renaissance Dam continues.", "u": "https://www.justsecurity.org/123615/trump-egypt-ethiopia-dam-conflict/", "d": "", "p": "external-verified"}, {"s": "Despite a peace deal signed by Armenia and Azerbaijan in August 2025, tensions and regional leadership discussions continue.", "u": "https://www.state.gov/releases/office-of-the-spokesperson/2025/08/peace-deal-between-armenia-and-azerbaijan", "d": "", "p": "article"}, {"s": "Fighting in the Democratic Republic of Congo and Rwanda continued even after a peace deal was signed in June 2025.", "u": "https://www.gicj.org/positions-opinons/gicj-positions-and-opinions/4355-will-the-rwanda-drc-peace-deal-end-decades-of-conflict", "d": "", "p": "external-verified"}, {"s": "The conflict in Gaza is still ongoing despite a ceasefire document signed by Trump in October 2025.", "u": "https://www.bbc.com/news/articles/ckgk4x5ze3mo", "d": "", "p": "external-verified"}]}, {"id": 104888, "claim": "Oekraïne is het wereldwijde centrum van de drugshandel.", "date": "2026-02-21", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://dpa-factchecking.com/netherlands/260223-99-623887", "img": "104888.jpg", "orig": "", "ev": [{"s": "Recent large-scale drug seizures in Ukraine do not prove that the center of global drug trade is located in that country.", "u": "https://globalinitiative.net/wp-content/uploads/2023/07/Ruggero-Scaturro-Disruption-or-displacement-Impact-of-the-Ukraine-war-on-drug-markets-in-SE-Europe-GI-TOC-17-July.pdf", "d": "", "p": "external-verified"}, {"s": "The Global Organized Crime Index (OC Index) report does not show that Ukraine is the global hub for drug trafficking.", "u": "https://ocindex.net/report/2025/section2/", "d": "", "p": "article"}, {"s": "In terms of heroin, cocaine, and cannabis trafficking, Colombia scores higher than Ukraine.", "u": "https://ocindex.net/", "d": "", "p": "article"}, {"s": "The United Nations World Drug Report indicates that Ukraine is not the global hub for drug trafficking in general.", "u": "https://www.unodc.org/documents/data-and-analysis/WDR_2025/WDR25_B1_Key_findings.pdf", "d": "", "p": "article"}, {"s": "According to the UN report, cocaine trade flows primarily between Latin America, West Africa, and West Europe.", "u": "https://www.unodc.org/documents/data-and-analysis/WDR_2025/WDR25_B1_Key_findings.pdf", "d": "", "p": "article"}, {"s": "The UN report identifies Russia and Ukraine as the primary departure points for seized stocks of methadone.", "u": "https://www.unodc.org/documents/data-and-analysis/WDR_2025/WDR25_B1_Key_findings.pdf", "d": "", "p": "article"}, {"s": "In Europe, the Netherlands ranks first in synthetic drug production (based on waste disposal sites), followed by Belgium and Ukraine.", "u": "https://www.unodc.org/documents/data-and-analysis/WDR_2025/WDR25_B1_Key_findings.pdf", "d": "", "p": "article"}]}, {"id": 109710, "claim": "Applying mango seeds is an unverified home remedy for hair fall.", "date": "2026-02-16", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-applying-mango-seeds-twice-a-week-on-scalp-prevent-hair-fall-165357", "img": "", "orig": "", "ev": [{"s": "Mango seed oil or butter, derived from the seeds, can be beneficial for hair health due to fatty acids, vitamins, and minerals, but rubbing the seed itself is not a proven scientific method for hair fall.", "u": "https://tryblossom.com/blogs/news/the-benefits-of-mango-butter-for-your-hair-and-scalp?srsltid=AfmBOoqWVocoits8pZpKhfE3EEHk6prwfIh47VNdOLyoBYYgiUFQ-Ac0", "d": "2023-01-27", "p": "external-verified"}, {"s": "Hair fall is influenced by multiple complex factors including genetics, hormonal changes, nutritional deficiencies, and underlying medical conditions, rather than being solvable by unverified home remedies.", "u": "https://www.isdin.com/us/blog/beauty/hair-and-nails/what-causes-hair-loss-top-7-reasons/", "d": "", "p": "external-verified"}, {"s": "There is no scientific evidence that applying mango seeds to the scalp can prevent hair fall.", "u": "https://www.curlynikki.com/5-amazing-benefits-of-mango-for-natural.html", "d": "", "p": "external-verified"}]}, {"id": 104746, "claim": "Applying mango seeds to the scalp twice a week prevents hair fall.", "date": "2026-02-16", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-applying-mango-seeds-twice-a-week-on-scalp-prevent-hair-fall-165357", "img": "", "orig": "", "ev": [{"s": "Hair fall is influenced by complex factors including genetics, hormonal changes, nutritional deficiencies, and underlying medical conditions.", "u": "https://www.isdin.com/us/blog/beauty/hair-and-nails/what-causes-hair-loss-top-7-reasons/", "d": "", "p": "external-verified"}, {"s": "Mango seeds are rich in nutrients like crude protein, healthy fats, carbohydrates, minerals (potassium, magnesium, etc.), and vitamins (A, C, E, K), which may be useful in food and nutraceuticals.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12168231/", "d": "", "p": "article"}, {"s": "Dr. Rema Devi T J, a dermatologist, states that rubbing mango seed is not a proven scientific method for hair fall, though mango seed oil or butter might be beneficial for hair health due to fatty acids and vitamins.", "u": "https://glammednaturallyoil.com/blogs/news/mango-oil-for-hair-growth?srsltid=AfmBOooIcPt6UoOcVpyRfBg8pwuhXQSqHEYAmq7iabKWeLbzFQqop2xG", "d": "2022-04-20", "p": "external-verified"}]}, {"id": 103145, "claim": "Ongefilterd Nederlands kraanwater is gezonder dan gefilterd water of bronwater.", "date": "2026-02-13", "mod": "text-only", "pred": "Supported", "gold": "true (rather certain)", "art": "https://dpa-factchecking.com/netherlands/260303-99-710142", "img": "", "orig": "", "ev": [{"s": "The claim that tap water is less healthy than filtered or spring water is incorrect; Dutch tap water is of good quality, clean, and safe to drink.", "u": "https://www.kwrwater.nl/en/actueel/welk-drinkwater-is-veiligst/", "d": "", "p": "external-verified"}, {"s": "Dutch tap water meets the European Drinking Water Directive and is continuously tested for hundreds of substances, including heavy metals, pesticides, bacteria, and PFAS.", "u": "https://www.rivm.nl/drinkwater/drinkwater-en-regelgeving", "d": "", "p": "article"}, {"s": "Concentrations of PFAS in Dutch tap water remain below the legal health standards, making it safe for daily consumption.", "u": "https://www.rijksoverheid.nl/onderwerpen/pfas/vraag-en-antwoord/zitten-er-pfas-in-het-drinkwater", "d": "", "p": "article"}, {"s": "Water filters do not provide health benefits regarding substances like chlorine or fluoride, as these are not added to Dutch tap water.", "u": "https://www.drinkwaterplatform.nl/hoe-gezond-en-veilig-is-drinkwater-uit-de-kraan/#:~:text=Zit%20er%20chloor%2C%20fluoride%20of,bevat%2C%E2%80%9D%20voegt%20Hofman%20toe.", "d": "", "p": "article"}, {"s": "Water filters can become a breeding ground for bacteria, potentially making the water you drink unsafe.", "u": "https://www.drinkwaterplatform.nl/waterfilters-de-zin-en-onzin/#:~:text=Nadelen:%20bacteriegroei%2C%20ophoping%20en%20milieuschade,belandt%20vervolgens%20in%20het%20riool.%E2%80%9D", "d": "", "p": "article"}, {"s": "Bottled water is not necessarily cleaner than tap water; in fact, tap water is monitored much more strictly on many more parameters.", "u": "https://www.nrc.nl/nieuws/2026/01/28/kraanwater-is-slecht-zeggen-influencers-waterbedrijven-beginnen-tegencampagne-a4918486", "d": "", "p": "article"}, {"s": "Research indicates that bottled water often contains more microplastics than tap water, including water from glass bottles.", "u": "https://www.bnnvara.nl/joop/artikelen/wie-water-uit-fles-drinkt-krijgt-veel-meer-microplastics-binnen", "d": "", "p": "article"}]}, {"id": 115468, "claim": "A male person of interest was detained in connection with the disappearance of Nancy Guthrie from her Arizona home.", "date": "2026-02-10", "mod": "text-only", "pred": "Supported", "gold": "true (certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-annie-Guthrie-not-in-police-custody-for-disappearance-of-mother-nancy-guthrie.html", "img": "", "orig": "A male person of interest was detained in connection with the disappearance of Nancy Guthrie.", "ev": [{"s": "Authorities have detained a male person of interest in the disappearance of Nancy Guthrie.", "u": "https://apnews.com/article/savannah-guthrie-mom-missing-arizona-b765fed6b9669441383b75860263ac99", "d": "", "p": "external-verified"}, {"s": "Nancy Guthrie was reported missing from her Arizona home on February 1, 2026.", "u": "https://www.azdps.gov/S/502067", "d": "2026-02-01", "p": "external-verified"}]}, {"id": 105145, "claim": "Sonbeddens is net so gevaarlik soos rook.", "date": "2026-02-10", "mod": "image-text", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://fullfact.org/health/sunbeds-smoking-dhsc-iarc/", "img": "105145.jpg", "orig": "", "ev": [{"s": "The World Health Organisation (WHO) has classified both sunbeds and smoking as Group 1 cancer-causing hazards.", "u": "https://cansa.org.za/sunbed-use-causes-cancer/", "d": "", "p": "external-verified"}, {"s": "Being in Group 1 means an agent is a known human carcinogen, but it does not imply that all Group 1 agents carry the same level of risk.", "u": "https://monographs.iarc.who.int/wp-content/uploads/2019/07/Preamble-2019.pdf#page=38", "d": "", "p": "article"}, {"s": "Using sunbeds before the age of 30 is associated with a 75% increase in the risk of skin cancer.", "u": "https://www.iarc.who.int/media-centre-iarc-news-32/?utm_source=chatgpt.com", "d": "", "p": "article"}, {"s": "Smoking is significantly more dangerous than sunbeds, with smokers being 15 to 30 times more likely to get or die from lung cancer.", "u": "https://www.cdc.gov/lung-cancer/risk-factors/index.html#:~:text=People%20who%20smoke,risk%20goes%20up.", "d": "", "p": "article"}, {"s": "Smoking increases the risk of lung cancer by an estimated 1,400% to 2,900%.", "u": "https://www.cdc.gov/tobacco/about/cigarettes-and-cancer.html", "d": "", "p": "external-verified"}, {"s": "Smoking is linked to a much wider variety of cancers and non-cancer health risks than sunbed use.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2913608/", "d": "", "p": "external-verified"}, {"s": "Cancer Research UK states that while both are Group 1 carcinogens, tobacco has a much bigger impact on cancer cases.", "u": "https://news.cancerresearchuk.org/2024/07/09/smoking-cancers-reach-all-time-high/", "d": "", "p": "external-verified"}]}, {"id": 105019, "claim": "Ukrainian athlete Vladislav Heraskevych's helmet bears terrorist symbols and portraits of military personnel.", "date": "2026-02-10", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.stopfake.org/en/fake-ukrainian-athlete-vladislav-heraskevych-s-helmet-bears-terrorist-symbols-and-portraits-of-military-personnel/", "img": "105019.png", "orig": "", "ev": [{"s": "Vladislav Heraskevych's helmet is a memorial object featuring portraits of 22 Ukrainian athletes who died during the Russian-Ukrainian war.", "u": "https://www.nbcnews.com/sports/olympics/ukraine-winter-olympics-helmet-banned-ioc-war-dead-skeleton-rcna258301", "d": "", "p": "external-verified"}, {"s": "The helmet does not contain terrorist symbols, calls for violence, political slogans, or military symbols like unit chevrons.", "u": "https://protectiongroupdenmark.us/blog/are-there-civilian-alternatives-to-u-s-army-ballistic-helmets/", "d": "2025-10-29", "p": "external-verified"}, {"s": "The portraits on the helmet include athletes who died in missile attacks or during the full-scale invasion, as well as those who died defending their country.", "u": "https://www.businessinsider.com/8-ukrainian-athletes-who-died-russia-ukraine-war-2024-1", "d": "", "p": "external-verified"}, {"s": "The National Olympic Committee of Ukraine confirmed that the helmet design contains no discriminatory elements or advertising and meets safety standards.", "u": "https://noc-ukr.org/news/nok-ukrayini-zvernuvsya-do-mok-shhodo-dozvolu-vikoristannya-sholoma-pam-yati-vladislavom-geraskevichem", "d": "", "p": "article"}, {"s": "Vladislav Heraskevych was disqualified from the 2026 Winter Olympics after refusing to follow the IOC's suggestion to wear a black ribbon instead of the memorial helmet.", "u": "https://www.cbc.ca/sports/olympics/winter/skeleton/olympics-skeleton-ukrain-heraskevych-helmet-banned-ioc-9.7082352", "d": "", "p": "external-verified"}]}, {"id": 104948, "claim": "U.S. Representative Thomas Massie stated that he received a flash drive containing the complete Jeffrey Epstein files.", "date": "2026-02-10", "mod": "text-only", "pred": "Refuted", "gold": "false (certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-massie-did-not-say-he-has-flash-drive-with-all-epstein-files.html", "img": "", "orig": "", "ev": [{"s": "Rep. Thomas Massie denied in an email to Lead Stories that he obtained a flash drive containing the Epstein files.", "u": "https://x.com/drhossamsamy65/status/2020838237552476505", "d": "", "p": "external-verified"}, {"s": "A social media post on X claimed Massie received a flash drive with the complete list of Jeffrey Epstein's files, but there is no evidence supporting this.", "u": "https://x.com/OlenaRohoza/status/2020668593122193822", "d": "", "p": "article"}, {"s": "On the day the claim was published, Rep. Massie posted on X that he would review unredacted Epstein files at the Department of Justice, but he made no mention of a flash drive.", "u": "https://x.com/RepThomasMassie/status/2020620474888474941", "d": "", "p": "article"}, {"s": "A search of Rep. Massie's X account yielded no mentions of the alleged flash drive.", "u": "https://x.com/search?q=drive%20(from%3ARepThomasMassie)&src=typed_query", "d": "", "p": "article"}, {"s": "A Google News search for the specific phrase attributed to Massie regarding the Epstein flash drive yielded no English-language results.", "u": "https://www.google.com/search?sca_esv=9687c9b822386596&rlz=1C5CHFA_enUS932US932&sxsrf=ANbL-n6ZW2eB6cWmpHPFSRpIqXNG4yO09Q:1770739755664&q=%22I+received+a+flash+drive+containing+the+complete+list+of+files+belonging+to+Jeffrey+Epstein%22+AND+Massie&tbm=nws&source=lnms&fbs=ADc_l-aN0CWEZBOHjofHoaMMDiKp0UJuhqwKhR0QUhF54-6jIYFfWbU_Clyew-1Wh7zkL7FFfeQ8UTZRt91soqZupfwPo0crig5A2MrUrvJfjH7QciSH8xUwQHQ9E5ErbsMbM8TE-vSnoDz0uiGZY2lFFSUOY9YcktIMaOamWoIYoq_K39QHv1JgkGPARMooT83wM_fA1Z7IQJUEzhMYSXrprIOMkBHVHg&sa=X&ved=2ahUKEwin1IDRp8-SAxWQ1fACHYrlJmkQ0pQJegQIGhAB&biw=1447&bih=793&dpr=1.5", "d": "", "p": "article"}]}, {"id": 104958, "claim": "The images are from the Jeffrey Epstein files and show human flesh being served at a dinner table.", "date": "2026-02-10", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.thequint.com/news/webqoof/tarantino-film-archives-viral-as-epstein-files-content-fact-check", "img": "104958.jpg", "orig": "", "ev": [{"s": "The claim that the visuals are from the Epstein files is false.", "u": "https://www.bbc.com/news/articles/c5yj4yvx80do", "d": "", "p": "external-verified"}, {"s": "The film 'Thanksgiving' (2007) was featured in Quentin Tarantino's film 'Grindhouse'.", "u": "https://awfj.org/blog/2023/11/15/thanksgiving-review-by-maitland-mcdonagh/", "d": "", "p": "external-verified"}, {"s": "There is no mention of these specific photos in the documents released by the U.S. Department of Justice regarding the Epstein files.", "u": "https://www.nbcnews.com/politics/justice-department/live-blog/epstein-files-live-updates-doj-release-documents-rcna250208", "d": "", "p": "external-verified"}, {"s": "Matching frames for the viral visuals were found within Quentin Tarantino's archives website.", "u": "https://wiki.tarantino.info/index.php/Thanksgiving", "d": "", "p": "article"}, {"s": "A scene matching one of the viral images, featuring children and a man wearing glasses, was identified in a trailer for the film on YouTube.", "u": "https://www.youtube.com/watch?v=GUh_AKvMz3g", "d": "", "p": "article"}]}, {"id": 103504, "claim": "Several participants of the \"No Kings\" protests on March 28, 2026, were paid between $20 and $40 per hour to attend.", "date": "2026-03-30", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://leadstories.com/hoax-alert/2026/03/fact-check-post-does-not-prove-no-kings-rallies-participants-were-paid-to-join-protests.html", "img": "", "orig": "", "ev": [{"s": "The claim that participants of the 'No Kings' rallies were paid between $20 and $40 per hour originated from a post on X by the account @drritaded.", "u": "https://x.com/drritaded/status/2038363624444715420", "d": "", "p": "article"}, {"s": "The account @drritaded had previously identified itself as a parody account.", "u": "https://x.com/DrRitaDed/status/2003305108864729353", "d": "", "p": "article"}, {"s": "The account's profile features a comedy mask icon, which is X's indicator for Parody, Fan, and Commentary accounts.", "u": "https://help.x.com/en/rules-and-policies/profile-labels", "d": "", "p": "article"}, {"s": "AI detectors determined that the account's profile picture was highly likely to be AI-generated.", "u": "https://hivemoderation.com/ai-generated-content-detection", "d": "", "p": "article"}, {"s": "The post claiming participants were paid was published on March 29, 2026, regarding rallies that took place on March 28, 2026.", "u": "https://www.bbc.com/news/articles/cq8wy7g1gd1o", "d": "", "p": "article"}]}, {"id": 103592, "claim": "AI chatbots prove that chemtrails are real.", "date": "2026-03-25", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://factcheck.afp.com/doc.afp.com.A4L24ZQ", "img": "", "orig": "", "ev": [{"s": "The claim that AI chatbots prove the existence of 'chemtrails' is based on social media posts that misinterpret or manipulate AI responses.", "u": "https://edmo.eu/thematic-areas/elections/european-elections/eu-elections-disinfo-bulletin/", "d": "", "p": "external-verified"}, {"s": "The 'chemtrails' theory alleges that aircraft contrails are actually toxic chemicals or biological weapons used for weather control, a claim scientists have debunked for years.", "u": "https://salatainstitute.harvard.edu/understanding-and-addressing-chemtrails/", "d": "", "p": "article"}, {"s": "White trails behind aircraft are actually condensation phenomena consisting of water droplets, and their appearance depends on air temperature and pressure.", "u": "https://www.nasa.gov/wp-content/uploads/2023/06/contrails-k-12.pdf", "d": "", "p": "article"}, {"s": "The EPA, NOAA, and NASA state that contrails have been a normal effect of jet aviation since its early days.", "u": "https://nepis.epa.gov/Exe/ZyPDF.cgi/00000LVU.PDF?Dockey=00000LVU.PDF", "d": "", "p": "article"}, {"s": "Geoengineering is a legitimate scientific field of research focused on cooling the Earth, which is distinct from the 'chemtrails' conspiracy theory.", "u": "https://www.epa.gov/geoengineering", "d": "", "p": "article"}, {"s": "AFP was unable to replicate the conspiratorial ChatGPT responses using the prompts shared in the viral posts.", "u": "https://www.npr.org/2026/01/20/nx-s1-5591473/ai-delusions-spiral-support-group-chatgpt", "d": "", "p": "external-verified"}, {"s": "Experts warn that AI chatbots can 'hallucinate' information, use unreliable sources, or be manipulated by specific prompts to bypass safety guardrails.", "u": "https://coralogix.com/ai-blog/ai-chatbot-hallucinations-understanding-and-mitigating-risks/", "d": "", "p": "external-verified"}, {"s": "Large Language Models (LLMs) can present claims with high confidence even when they are incorrect or lack proper verification.", "u": "https://www.nature.com/articles/s42256-024-00976-7", "d": "2025-01-21", "p": "external-verified"}]}, {"id": 103619, "claim": "A drink made of shakkar, sesame seeds, and sonth can regularize menstrual periods in 21 days.", "date": "2026-03-23", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-shakkar-seasme-seeds-and-sonth-drink-regularize-periods-in-21-days-167698", "img": "103619.jpg", "orig": "", "ev": [{"s": "The claim that a drink made of shakkar, sesame seeds, and sonth can regularize menstrual periods in 21 days is false and not supported by scientific or clinical evidence.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12461132/", "d": "", "p": "external-verified"}, {"s": "Menstrual irregularities are typically caused by underlying hormonal imbalances, medical conditions, or lifestyle factors, rather than something that can be corrected by home remedies in a fixed timeframe.", "u": "https://www.pihealthcancerhospital.com/blog/managing-irregular-periods-causes-and-treatment-options/", "d": "", "p": "external-verified"}, {"s": "While sesame seeds contain nutrients like lignans that have antioxidant and anti-inflammatory effects, research suggests any potential impact on hormones would require weeks or months, not 21 days.", "u": "https://www.healthline.com/nutrition/sesame-seeds", "d": "", "p": "external-verified"}, {"s": "Sesame seeds, sonth (dry ginger), and shakkar (jaggery) have nutritional benefits, such as anti-inflammatory properties and mineral content, but they are not substitutes for medical treatment for irregular periods.", "u": "https://pharmeasy.in/blog/ayurveda-uses-benefits-side-effects-of-sesame-seeds/", "d": "", "p": "external-verified"}]}, {"id": 104558, "claim": "The Soleus Push-Up reduces blood sugar by 30 mg/dL in an hour.", "date": "2026-03-19", "mod": "image-text", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-soleus-push-up-reduce-blood-sugar-by-30-mgdl-in-an-hour-167107", "img": "104558.jpg", "orig": "", "ev": [{"s": "Soleus Push-Ups and regular physical activity can help manage blood sugar levels over time, but they are not a quick fix for immediate reduction.", "u": "https://diatribe.org/exercise/4-exercises-lower-blood-sugar", "d": "", "p": "external-verified"}, {"s": "Research by Marc T. Hamilton et. al. showed that the Soleus Push-Up exercise can lead to improvements in glucose tolerance.", "u": "https://pubmed.ncbi.nlm.nih.gov/36034224/", "d": "", "p": "article"}]}, {"id": 104592, "claim": "UK Prime Minister Keir Starmer said that energy bills will be capped until the end of June, saving the average household £170.", "date": "2026-03-17", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://fullfact.org/economy/bbc-energy-bills-correction/", "img": "104592.jpg", "orig": "", "ev": [{"s": "Keir Starmer stated that energy bills are capped until the end of June, saving the average household £117, rather than £170.", "u": "https://www.youtube.com/live/Cfpn7FCOmHY?si=6mmr_eCVg-oyw_I8&t=1602", "d": "", "p": "article"}, {"s": "The energy price cap is set to fall in April by £117 a year for a typical household with a dual-fuel bill paying by direct debit.", "u": "https://www.ofgem.gov.uk/information-consumers/energy-advice-households/energy-price-cap-explained", "d": "", "p": "article"}]}, {"id": 103962, "claim": "The image shows actor Timothée Chalamet falling down the stairs at the 2026 Oscars.", "date": "2026-03-16", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://digiteye.in/did-timothee-chalamet-really-fall-down-the-stairs-during-oscars-2026-event-fact-check/", "img": "103962.png", "orig": "", "ev": [{"s": "Timothée Chalamet appeared safely on the 2026 Oscars red carpet wearing a white Givenchy suit.", "u": "https://wwd.com/pop-culture/celebrity-news/timothee-chalamet-givenchy-suit-2026-oscars-red-carpet-1238665184/", "d": "", "p": "external-verified"}, {"s": "The image circulating is an old meme that has been surfacing online frequently since 2015.", "u": "https://asistdl.onlinelibrary.wiley.com/doi/10.1002/asi.24900", "d": "", "p": "external-verified"}, {"s": "The viral image actually depicts an incident from the 64th Cannes Film Festival on May 17, 2011.", "u": "https://en.wikipedia.org/wiki/2011_Cannes_Film_Festival", "d": "", "p": "external-verified"}, {"s": "The image shows an unidentified attendee slipping while walking up a red-carpet staircase outside the Palais des Festivals in 2011.", "u": "https://www.instagram.com/p/DVlhcPXDQmS/?utm_source=ig_web_copy_link&igsh=NTc4MTIwNjQ2YQ==", "d": "", "p": "article"}, {"s": "Video footage of the 2026 Oscars Red Carpet shows Timothée Chalamet arriving and posing without any stumble or security intervention.", "u": "https://youtu.be/plzE2jioaNU?si=9xgnmeRb0SARRgkn", "d": "", "p": "article"}]}, {"id": 103594, "claim": "The SAVE America Act requires all registered U.S. voters to re-register to vote in person. Driver's licenses, REAL IDs, and military IDs are not sufficient to complete this registration.", "date": "2026-03-17", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://www.politifact.com/factchecks/2026/mar/24/mark-kelly/reregister-vote-elections-SAVE-America-Act/", "img": "", "orig": "", "ev": [{"s": "The SAVE America Act does not require all currently registered voters to re-register to vote.", "u": "https://www.rockthevote.org/explainers/the-save-act/", "d": "", "p": "external-verified"}, {"s": "The bill requires individuals seeking to register to vote in federal elections to present documentary proof of U.S. citizenship in person to an election official.", "u": "https://www.whitehouse.gov/saveamerica/", "d": "", "p": "external-verified"}, {"s": "The bill requires documentary proof of citizenship such as a passport or birth certificate.", "u": "https://bipartisanpolicy.org/article/do-documentary-proof-of-citizenship-requirements-disadvantage-one-party-more-than-the-other/", "d": "", "p": "external-verified"}, {"s": "Most state driver's licenses and REAL IDs do not contain the citizenship information required by the bill.", "u": "https://responsivegov.org/research/real-id-an-overview/", "d": "2026-03-04", "p": "external-verified"}, {"s": "Certain groups, such as people who move (even within a state), change their party registration, or change their name, would likely need to update their registration and thus comply with the new requirements.", "u": "https://www.rockthevote.org/explainers/the-save-act/", "d": "", "p": "external-verified"}, {"s": "Any registration update would require the voter to comply with the bill's proof of citizenship requirement.", "u": "https://ballotpedia.org/Proof_of_citizenship_requirements_for_voter_registration_by_state", "d": "", "p": "external-verified"}]}, {"id": 103947, "claim": "A drink made of ghee, turmeric, and black pepper can prevent or cure PCOD.", "date": "2026-03-12", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-ghee-turmeric-and-black-pepper-drink-prevent-or-cure-pcod-167108", "img": "103947.jpg", "orig": "", "ev": [{"s": "There is no scientific evidence or medical consensus to support the claim that consuming a drink made with ghee, turmeric, and black pepper can prevent or cure PCOD.", "u": "https://www.clairepettitt.com/blog/turmeric-for-pcos-fact-or-fiction", "d": "", "p": "external-verified"}, {"s": "PCOD cannot be entirely prevented because it is largely influenced by genetic and hormonal factors.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9964744/", "d": "", "p": "article"}, {"s": "PCOD cannot be permanently cured due to its genetic and hormonal nature.", "u": "https://www.unicef.org/india/stories/do-pcod-and-pcos-mean-same-thing-or-are-they-different#:~:text=PCOD%20(Polycystic%20Ovarian%20Disease)%20is,be%2Dfertilized%20eggs%20each%20month.", "d": "", "p": "article"}, {"s": "While turmeric may have anti-inflammatory properties and black pepper may aid absorption, they cannot address the underlying hormonal issues of PCOD.", "u": "https://rootfunctionalmedicine.com/turmeric-for-pcos", "d": "", "p": "external-verified"}, {"s": "PCOD is a complex hormonal and metabolic condition that cannot be reversed through a single home remedy.", "u": "http://www.nawcare.com/blog/pcos-cure-tips", "d": "", "p": "external-verified"}]}, {"id": 102286, "claim": "Manfred Weber kötelező európai sorkatonai szolgálat bevezetését javasolta, amely a magyar fiatalokra is vonatkozna.", "date": "2026-03-06", "mod": "text-only", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://magyar.leadstories.com/hoax-alert/2026/03/tenyellenorzes-manfred-weber-europai-sorozasi-programot-javasolt-magyarokat-szolgalatba.html", "img": "", "orig": "", "ev": [{"s": "Manfred Weber's proposal for a mandatory service was specifically directed at German youth, not Hungarian youth.", "u": "https://manfredweber.eu/en/manfred-weber-about-me/", "d": "", "p": "external-verified"}, {"s": "In a May 2024 panel discussion on the German public broadcaster BR-24, Manfred Weber expressed support for an 'all-purpose national service' for German youth.", "u": "https://youtu.be/SXvHTJcdpHI?t=2449", "d": "", "p": "article"}, {"s": "Weber clarified that he supports a national service where youth can freely choose the type of service, noting that the Bundeswehr does not need an entire age cohort.", "u": "https://www.youtube.com/watch?v=SXvHTJcdpHI", "d": "", "p": "article"}, {"s": "Regarding European-level defense, Weber emphasized the need for missile defense systems rather than mandatory military service.", "u": "https://www.youtube.com/live/SXvHTJcdpHI?si=iHdPV4vE3cQDxHJa&t=2480", "d": "", "p": "article"}, {"s": "Weber has spoken about creating a European army since May 2024, but he has not stated that participation would be mandatory for all European youth.", "u": "https://manfredweber.eu/de/aktiv-fuer-europa/europaeische-armee/", "d": "", "p": "article"}]}, {"id": 104029, "claim": "Jayphal and Haldi cure pigmentation and dark circles in just 2–3 days.", "date": "2026-03-05", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://medicaldialogues.in/fact-check/fact-check-can-jayphal-and-haldi-cure-pigmentation-and-dark-circles-in-just-23-days-166719", "img": "104029.jpg", "orig": "", "ev": [{"s": "Skin pigmentation develops due to excess melanin production and is a gradual process that cannot disappear within two or three days, especially through home remedies.", "u": "https://www.sunshinestatederm.com/blog/113-understanding-hyperpigmentation-causes-treatments-and-prevention", "d": "2025-04-18", "p": "external-verified"}, {"s": "While turmeric contains curcumin which has anti-inflammatory and antioxidant properties, neither turmeric nor nutmeg can produce rapid skin-lightening or pigmentation reversal.", "u": "https://skinkraft.com/blogs/articles/benefits-of-turmeric-for-glowing-skin", "d": "", "p": "external-verified"}, {"s": "Applying raw kitchen ingredients like nutmeg and turmeric directly to the skin may cause irritation, allergic reactions, or contact dermatitis, which can actually worsen pigmentation.", "u": "https://www.medicalnewstoday.com/articles/turmeric-face-mask", "d": "", "p": "external-verified"}, {"s": "Medical treatments for pigmentation, such as topical depigmenting agents or laser therapy, typically take weeks to months to show visible improvement.", "u": "https://jcasonline.com/lasers-for-treatment-of-melasma-and-post-inflammatory-hyperpigmentation/", "d": "", "p": "external-verified"}, {"s": "Pigmentation conditions like melasma or post-inflammatory hyperpigmentation typically take weeks to months to improve, even with medical treatment.", "u": "https://www.getharley.com/knowledge/post-inflammatory-hyperpigmentation", "d": "", "p": "external-verified"}]}, {"id": 102331, "claim": "The photo shows the damaged aircraft carrier USS Abraham Lincoln.", "date": "2026-03-05", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://espanol.leadstories.com/fact-check/2026/03/verificacion-de-datos-foto-no-muestra-danos-en-el-abraham-lincoln-es-el-forrestal.html", "img": "102331.jpg", "orig": "", "ev": [{"s": "The viral photo does not show the USS Abraham Lincoln; it actually shows repair work on the damaged deck of the USS Forrestal in 1967.", "u": "https://en.wikipedia.org/wiki/USS_Forrestal", "d": "", "p": "external-verified"}, {"s": "U.S. Central Command (CENTCOM) issued a statement denying that the aircraft carrier was hit by Iranian missiles.", "u": "https://x.com/centcom/status/2028124242273767557?s=46&t=RCLraXbGJ2xR9r-YyJ5qFg", "d": "", "p": "article"}, {"s": "CENTCOM released footage from February 28 and March 1, 2026, which did not show the extensive damage claimed in the viral photo.", "u": "https://understandingwar.org/research/middle-east/iran-update-evening-special-report-march-1-2026/", "d": "", "p": "external-verified"}, {"s": "The original image was located on Getty Images and is confirmed to date from 1967.", "u": "https://www.gettyimages.com/detail/news-photo/repair-crews-working-to-fix-the-damaged-deck-of-the-uss-news-photo/53369847", "d": "", "p": "article"}]}, {"id": 104634, "claim": "Practising butterfly yoga, standing in bitter gourd soaked water, and consuming fenugreek can normalise blood sugar levels within one week.", "date": "2026-03-03", "mod": "image-text", "pred": "Refuted", "gold": "false (certain)", "art": "https://www.thip.media/health-news-fact-check/fact-check-can-butterfly-yoga-normalise-blood-sugar-levels-in-just-one-week/140033/", "img": "104634.jpg", "orig": "", "ev": [{"s": "A single yoga posture like the butterfly pose is not a shortcut to normal glucose levels, especially for those with insulin resistance, long-standing diabetes, or other medical factors.", "u": "https://diabetessisters.org/resources/balancing-blood-glucose-and-mind-the-healing-power-of-yoga-for-women-with-diabetes/", "d": "", "p": "external-verified"}, {"s": "Butterfly pose primarily stretches the hips and inner thighs and encourages calm breathing, but it lacks the sustained muscle work required to consistently use up glucose, unlike brisk walking or cycling.", "u": "https://www.artofliving.org/us-en/yoga/poses/butterfly-pose", "d": "", "p": "external-verified"}, {"s": "While structured yoga programs can improve fasting glucose and HbA1c, these benefits are observed over weeks or months, not within a single week.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6145966/", "d": "", "p": "article"}, {"s": "Relying on unproven methods like soaking feet in bitter gourd (karela) or consuming fenugreek without medical treatment can lead to uncontrolled blood sugar and permanent organ damage.", "u": "https://www.thip.media/health-news-fact-check/fact-check-is-soaking-feet-in-karela-juice-beneficial-for-diabetes/55895/", "d": "", "p": "article"}, {"s": "The claim is medically vague because it does not specify whether 'normal blood sugar' refers to fasting levels, post-meal levels, or HbA1c.", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9009294/", "d": "", "p": "external-verified"}, {"s": "HbA1c reflects average glucose over approximately 2-3 months, meaning it cannot meaningfully 'turn normal' in a single week.", "u": "https://www.ncbi.nlm.nih.gov/books/NBK549816/", "d": "", "p": "article"}]}, {"id": 102532, "claim": "Rupert Lowe issued a three-day ultimatum demanding that Keir Starmer surrender £95 million in profits generated through connections to NHS reform legislation.", "date": "2026-02-27", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://fullfact.org/shopping/rupert-lowe-keir-starmer-false-NHS-profits/", "img": "102532.jpg", "orig": "", "ev": [{"s": "Claims that Rupert Lowe demanded Keir Starmer surrender £95 million in profits linked to NHS reform legislation are false.", "u": "https://x.com/ScaryEurope/status/2024042311185797300", "d": "", "p": "external-verified"}, {"s": "There is no evidence to support the allegation that Keir Starmer made profits from NHS reform legislation.", "u": "https://www.bbc.com/news/articles/c3w6g0gzw40o", "d": "", "p": "external-verified"}]}, {"id": 104267, "claim": "Eight Ukrainian athletes who competed in the 2026 Winter Olympics in Italy did not return home. They fled to avoid forced conscription for earning no medals.", "date": "2026-02-27", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://www.stopfake.org/en/fake-news-eight-ukrainian-athletes-didn-t-return-from-italy-after-the-2026-winter-olympics/", "img": "104267.png", "orig": "", "ev": [{"s": "The report that eight Ukrainian athletes did not return from the 2026 Milan Olympics is unconfirmed by both Ukraine’s National Olympic Committee and the Youth and Sports Ministry.", "u": "https://en.interfax.com.ua/news/sport/1146300.html", "d": "", "p": "external-verified"}, {"s": "Ukrainian officials and specialized media reported no disappearance or mass failure of athletes to return following the Milan-Cortina d’Ampezzo Games in February 2026.", "u": "https://x.com/24tvua/status/2026047712282505677", "d": "", "p": "article"}, {"s": "The Center for Countering Disinformation identified the claim about athletes fleeing to avoid conscription as a fake news item and part of a Russian information operation.", "u": "https://www.france24.com/en/live-news/20260212-ukraine-says-russia-behind-fake-posts-targeting-winter-olympics-team", "d": "", "p": "external-verified"}, {"s": "There is no legal basis or evidence in Ukrainian law that links an athlete's performance (such as winning medals) to military service or conscription.", "u": "https://www.gov.uk/government/publications/ukraine-country-policy-and-information-notes/country-policy-and-information-note-military-service-ukraine-june-2022-accessible", "d": "", "p": "external-verified"}, {"s": "The National Olympic Committee of Ukraine issued a press release following the Games expressing gratitude to the Defense Forces and stating that athletes return home with experience and faith in victory.", "u": "https://noc-ukr.org/news/xxv-zimovi-olimpijski-igri-2026-oficzijno-zaversheno-rekordne-predstavnicztvo-ukrayini-ta-visim-potraplyan-u-top-10", "d": "", "p": "article"}]}, {"id": 104906, "claim": "Senator John Kennedy, Kash Patel, Representative Jim Jordan, Senator Marco Rubio, and Denzel Washington invoked a \"Born In America Act\" to demand the expulsion of naturalized citizens from elected office.", "date": "2026-02-25", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-there-is-no-born-in-america-act.html", "img": "104906.jpg", "orig": "", "ev": [{"s": "There is no federal 'Born In America' act currently under consideration in Congress.", "u": "https://forumtogether.org/article/birthright-citizenship-act-of-2025-bill-summary/", "d": "", "p": "external-verified"}, {"s": "A search of the Google News index yielded no real reports regarding a 'Born in America Act'.", "u": "https://www.whitehouse.gov/saveamerica/", "d": "", "p": "external-verified"}, {"s": "C-SPAN's advanced search tool found no record of Senator Kennedy or anyone else making the specific inflammatory remarks attributed to them.", "u": "https://www.c-span.org/search/?searchtype=People&sort=Best+Match&all%5B%5D=%2522No%2Bflags%2Bbut%2Bours%2522&addedterm%5B%5D=Kennedy", "d": "", "p": "article"}, {"s": "The claims involving various celebrities and politicians are part of a template used by an international network of websites to generate traffic.", "u": "https://reutersinstitute.politics.ox.ac.uk/journalism-media-and-technology-trends-and-predictions-2024", "d": "", "p": "external-verified"}, {"s": "The fake stories are being promoted by a website based in Vietnam.", "u": "https://nbcuacademy.com/cookie-duong-vietnamese-fake-news-online/", "d": "", "p": "external-verified"}]}, {"id": 110332, "claim": "The 1967 photograph shows go-go dancers celebrating at an Australian hotel.", "date": "2026-02-24", "mod": "image-text", "pred": "Supported", "gold": "true (certain)", "art": "https://www.newsmobile.in/nm-fact-checker/verified-1967-go-go-dancers-photo-falsely-shared-as-sonia-gandhi/", "img": "", "orig": "", "ev": [{"s": "The photograph was taken on November 21, 1967.", "u": "https://www.onthisday.com/date/1967/november", "d": "", "p": "external-verified"}, {"s": "The photograph depicts go-go dancers performing at Rawson’s Hotel in Auburn, Australia.", "u": "https://www.gettyimages.in/detail/news-photo/go-go-dancing-girls-help-break-the-beer-drought-on-rawson-news-photo/118358810", "d": "", "p": "article"}, {"s": "The event in the photo was related to a strike by more than 2,000 brewery workers in Sydney known as the 'Beer Brawl'.", "u": "https://www.facebook.com/Igrewupinmortdale2223/posts/onthisday-17-november-1967-a-strike-by-more-than-2000-brewery-workers-in-sydney-/857847686632130/", "d": "", "p": "article"}]}, {"id": 103587, "claim": "Iran is working to build missiles that will soon reach the United States.", "date": "2026-02-24", "mod": "text-only", "pred": "Conflicting Evidence/Cherrypicking", "gold": "false (rather certain)", "art": "https://www.factcheck.org/2026/03/assessing-trumps-claims-on-irans-nuclear-and-missile-capabilities/", "img": "", "orig": "", "ev": [{"s": "Experts dispute the claim that Iran could 'soon' have missiles capable of reaching the United States.", "u": "https://www.iranwatch.org/library/government/united-states/congress/legislation-reports/irans-long-range-missile-capabilities", "d": "", "p": "external-verified"}, {"s": "Recent estimates suggest Iran lacks intercontinental ballistic missile (ICBM) capability and appears to maintain a self-imposed missile range limit of 2,000 km.", "u": "http://iranprimer.usip.org/resource/irans-ballistic-missile-program", "d": "", "p": "external-verified"}, {"s": "A Defense Intelligence Agency (DIA) report from May 2025 projected that Iran could develop a militarily-viable ICBM by 2035 if it chose to pursue the capability.", "u": "https://www.everycrsreport.com/reports/IF13035.html", "d": "", "p": "external-verified"}, {"s": "Iranian Foreign Minister Abbas Araghchi denied that Iran is developing long-range missiles, stating they intentionally limit range to below 2,000 kilometers.", "u": "https://www.iranintl.com/en/202510081527", "d": "", "p": "external-verified"}, {"s": "Secretary of State Marco Rubio acknowledged that Iran is attempting to achieve ICBM capability and is increasing missile ranges, but did not provide a specific timeframe for reaching the U.S.", "u": "https://www.state.gov/releases/office-of-the-spokesperson/2026/02/secretary-of-state-marco-rubio-remarks-to-press-5", "d": "", "p": "article"}]}, {"id": 104842, "claim": "The photos show Austin Tucker Martin, who was shot and killed trying to breach Mar-a-Lago, and reveal that he was transgender.", "date": "2026-02-23", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-mislabeled-photos-do-not-show-austin-tucker-martin-is-transgender.html", "img": "104842.jpg", "orig": "", "ev": [{"s": "The photos circulating on social media that claim to show Austin Tucker Martin are mislabeled and depict an unidentified person who does not resemble Martin.", "u": "https://www.ftc.gov/system/files/ftc_gov/pdf/Combatting%20Online%20Harms%20Through%20Innovation%3B%20Federal%20Trade%20Commission%20Report%20to%20Congress.pdf", "d": "", "p": "external-verified"}, {"s": "Verified family photos of Austin Tucker Martin, such as one shared by Melissa Martin on Facebook, show a person who does not resemble the individual in the mislabeled social media posts.", "u": "https://www.thesun.co.uk/news/38309168/bizarre-texts-shotgun-man-trump-mar-a-lago-epstein/", "d": "", "p": "article"}]}, {"id": 104764, "claim": "The State of California paid the Coalition for Humane Immigrant Rights (CHIRLA) over $100 million primarily to organize protests and pay protesters.", "date": "2026-02-23", "mod": "image-text", "pred": "Refuted", "gold": "", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-california-did-not-give-coalition-for-humane-immigrant-rights-100-million-mainly-to-pay-protesters.html", "img": "104764.jpg", "orig": "", "ev": [{"s": "California paid the Coalition for Humane Immigrant Rights (CHIRLA) approximately $115 million for the 2019-2025 fiscal years.", "u": "https://www.chirla.org/what-we-do/programs-initiatives/policy-advocacy/state-work/", "d": "", "p": "external-verified"}, {"s": "98% of the funds paid to CHIRLA by the state ($113 million out of $115 million) came from California's Department of Social Services.", "u": "https://www.chirla.org/news-category/chirla-celebrates-gov-newsoms-commitment-to-immigrant-wellbeing-in-proposed-2022-budget/", "d": "", "p": "external-verified"}, {"s": "State budget records show no evidence that funds were used to pay or organize protesters, nor are there line items for activist stipends or demonstration organizing.", "u": "https://www.newsnationnow.com/politics/compensated-activist-majority-protesters-paid/", "d": "", "p": "external-verified"}, {"s": "The mission of the California Department of Social Services involves providing cash assistance, social services, and protecting vulnerable children and adults.", "u": "https://ebudget.ca.gov/2024-25/pdf/GovernorsBudget/4000/5180.pdf", "d": "", "p": "article"}, {"s": "CHIRLA's communications director stated that the organization has not received state funding for organizing or civic engagement and does not pay for protesters.", "u": "", "d": "", "p": "metadata"}, {"s": "CHIRLA provides services including legal immigration assistance, community education, and advocacy for policy changes in areas like housing and healthcare.", "u": "https://www.chirla.org/news-announcements/", "d": "", "p": "article"}]}, {"id": 104143, "claim": "The Seattle Seahawks refused an invitation to the White House.", "date": "2026-02-19", "mod": "image-text", "pred": "Refuted", "gold": "false (rather certain)", "art": "https://leadstories.com/hoax-alert/2026/02/fact-check-seattle-seahawks-did-not-decline-a-white-house-invitation.html", "img": "104143.jpg", "orig": "", "ev": [{"s": "There is no evidence that the Seattle Seahawks have been invited to the White House or have refused an invitation.", "u": "https://www.marca.com/en/nfl/seattle-seahawks/2026/02/19/69967371268e3e5d348b45de.html",
